function coopTagAutre(n){ return '<span class="tag serv-autre" data-v="'+esc(n)+'">'+esc(n)+'<button type="button" class="icone-btn" data-act="cf-autre-suppr" aria-label="Retirer">'+ic('x')+'</button></span>'; }
/** Le catalogue de la devise choisie : les articles disponibles (proposés), ou tous (pour retrouver un article). */
function cfCatalogue(tous){ return S.coop.catalogue.filter(a => (tous || a.disponible) && a.devise === S.cf.devise); }
function cfItem(article){ return cfCatalogue(true).find(x => norm(x.article) === norm(article)) || null; }
/** Une ligne pour un article du catalogue (prix et options proposées d'office). */
function cfLigne(a, q){
  const opts = {}; (a.groupes || []).forEach(g => { opts[g.nom] = g.defaut || (g.valeurs.length === 1 ? g.valeurs[0] : ''); });
  return {article:a.article, prix:a.prix, quantite:q || 1, precision:'', opts:opts, libre:false, nouveau:false};

/** Une ligne d'une commande déjà enregistrée : les options sont relues dans la précision (« M · Troupe (bleu) »). */
function cfRestaurer(l){
  const a = cfItem(l.article), base = {article:l.article, prix:l.prix, quantite:l.quantite, precision:l.precision || '', opts:{}, libre:true, nouveau:false};
  if(!a || !a.groupes.length) return base;
  const parts = String(l.precision || '').split(' · ');
  if(parts.length !== a.groupes.length || !a.groupes.every((g, i) => g.progression || !g.valeurs.length || g.valeurs.indexOf(parts[i]) >= 0)) return base;
  a.groupes.forEach((g, i) => { base.opts[g.nom] = parts[i]; });

}
function cfChoisir(nom, groupe, oui){
  const cf = S.cf, k = norm(nom);
  const i = cf.choisis.findIndex(n => norm(n) === k);
  if(oui && i < 0){ cf.choisis.push(nom); cf.groupes[k] = groupe || ''; if(!cf.lignes[k]) cf.lignes[k] = []; }
  if(!oui && i >= 0){ cf.choisis.splice(i, 1); if(S.cfPick && S.cfPick.k === k) S.cfPick = null; }

/** Une saisie dans une ligne : l'état suit (quantité, prix, options, précision). */

const cfMontant = l => (Number(l.quantite) || 0) * (Number(l.prix) || 0);
function cfTotaux(){
  const cf = S.cf, d = S.coop; if(!cf) return;

/** La commande à envoyer ; « manque » signale une option pas encore choisie. */
function cfCommande(f){

/** Le choix du sélecteur : une nouvelle ligne, une ligne remplacée, ou une ligne pour chaque membre choisi. */
function cfAppliquer(fabrique){

/* ---- Achat, paiements, PDF ---- */
function formAchat(c){
  const m = ouvrirModal({titre:'Commande n°'+c.num+' achetée', icone:'panier', couleur:COOP_C.vert,
    sous:'Le CU ou un ACU est allé à la Coop et a payé la commande avec l’argent de la caisse.',
    corps:'<form class="form" id="f-achat" novalidate><label class="champ"><span>Date de l’achat</span><input type="date" name="date" value="'+aujourdhui()+'" required></label>'+
      '<div class="coop-explique"><div>'+ic('baisse')+'<span>Une <b>dépense de '+argent(c.total, c.devise)+'</b> est ajoutée à la caisse (type « Autre », catégorie « Coop scoute »).</span></div>'+
      '<div>'+ic('drapeau')+'<span>Elle est rangée sous l’événement <b>« '+esc(coopEvenement(c))+' »</b>, avec chaque paiement à venir.</span></div>'+
      '<div>'+ic('check')+'<span>Une case apparaît devant chaque membre : cochez-la quand il a payé, son paiement entre dans la caisse.</span></div></div>'+
      '<div class="actions"><button type="button" class="btn fantome" data-act="fermer">Annuler</button><button type="submit" class="btn vert grand">'+ic('check')+'Confirmer l’achat</button></div></form>'});
  const f = $('#f-achat', m);
  f.onsubmit = async ev => {
    ev.preventDefault();
    if(!f.date.value) return toast('Choisissez la date de l’achat.', 'erreur');
    await chargement($('button[type=submit]', f), 'Enregistrement…', async () => {
      try { const r = await api('coopAcheter', c.id, f.date.value); fermerModal(); coopMaj(r); toast('Commande n°'+c.num+' achetée : '+argent(c.total, c.devise)+' sortis de la caisse.'); }
      catch(e){ erreur(e); }
    });
  };
}
async function coopPayer(el){
  const c = S.coop.commandes.find(x => x.id === el.dataset.c), p = c && c.participants.find(x => x.id === el.dataset.p);
  if(!p){ el.checked = !el.checked; return; }
  const oui = el.checked;
  el.checked = !oui;                       // l'état ne change qu'après confirmation et réponse du serveur
  const ok = oui
    ? await confirmer(p.membre+' a payé ?', '<b>'+esc(p.membre)+'</b> a payé <b>'+argent(p.montant, c.devise)+'</b> pour la commande n°'+c.num+'.<br>Une entrée de '+argent(p.montant, c.devise)+' sera ajoutée à la caisse, sous « '+esc(coopEvenement(c))+' ».', 'Oui, il a payé', {icone:'check', classe:'vert', couleur:'var(--vert)'})
    : await confirmer('Annuler le paiement ?', 'Le paiement de <b>'+esc(p.membre)+'</b> ('+argent(p.montant, c.devise)+') sera retiré de la caisse.', 'Annuler le paiement');
  if(!ok) return;
  const box = $('[data-change="coop-payer"][data-p="'+CSS.escape(p.id)+'"]');
  if(box){ box.disabled = true; box.closest('.rc-m').classList.add('envoi'); }
  try {
    const r = await api('coopPayer', c.id, p.id, oui, aujourdhui());
    coopMaj(r);
    if(r.soldee) toast('Commande n°'+c.num+' entièrement payée : tout l’argent dépensé est revenu dans la caisse. Elle passe dans l’historique.');
    else toast(oui ? 'Paiement de '+p.membre+' noté : + '+argent(p.montant, c.devise)+' dans la caisse.' : 'Paiement de '+p.membre+' annulé.');
  } catch(e){ erreur(e); if(box && box.isConnected){ box.disabled = false; box.closest('.rc-m').classList.remove('envoi'); } }
}
/** Un nom de fichier que tous les navigateurs acceptent (sans « ° », tiret long, accents…). */
function nomFichierSur(n){ return String(n).replace(/n°/g, 'n').replace(/[—–]/g, '-').normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^\w .()-]+/g, '').replace(/\s+/g, ' ').trim() || 'commande.pdf'; }
function base64EnBlob(b64, type){ const bin = atob(b64), n = bin.length, a = new Uint8Array(n); for(let i = 0; i < n; i++) a[i] = bin.charCodeAt(i); return new Blob([a], {type:type}); }
async function coopPdf(el){
  const c = S.coop.commandes.find(x => x.id === el.dataset.id); if(!c) return;
  await chargement(el, 'PDF…', async () => {
    try {
      const r = await api('coopPdf', c.id);
      let url = ''; try { url = URL.createObjectURL(base64EnBlob(r.data, 'application/pdf')); } catch(e){ url = ''; }
      ouvrirModal({titre:'Bon de commande n°'+c.num, icone:'doc', couleur:COOP_C.bleu,
        sous:'Enregistré dans « Info › Tresorerie › Coop ». Prêt à être envoyé (WhatsApp, e-mail…).',
        corps:'<div class="coop-pdf"><div class="cp-ic">'+ic('doc')+'</div><div><b>'+esc(r.nom)+'</b><div class="sous">'+pluriel(c.participants.length, 'membre')+' · '+argent(c.total, c.devise)+'</div></div></div>'+
          '<div class="actions">'+(url ? '<a class="btn primaire coop-btn" href="'+url+'" download="'+esc(nomFichierSur(r.nom))+'">'+ic('telecharger')+'Télécharger</a>' : '')+'<a class="btn fantome" href="'+esc(r.url)+'" target="_blank" rel="noopener">'+ic('externe')+'Ouvrir dans Drive</a></div>'});
    } catch(e){ erreur(e); }
  });
}
Object.assign(ACTIONS, {
  'tr-onglet': el => { S.trOnglet = el.dataset.v; rendreTresorier(); if(S.trOnglet === 'coop' && !S.coop) chargerCoop(); if(S.trOnglet === 'cotisation' && !S.cot) chargerCot(); if(S.trOnglet === 'caisse' && !S.treso) chargerTreso(); },
  'coop-nouvelle': () => { if(!S.coop) return toast('Un instant : les commandes se chargent.', 'erreur'); formCoop(null); },
  'coop-modifier': el => { const c = S.coop.commandes.find(x => x.id === el.dataset.id); if(c) formCoop(c); },
  'coop-catalogue': (el, e) => { if(e) e.preventDefault(); formCatalogue(); },
  'coop-acheter': el => { const c = S.coop.commandes.find(x => x.id === el.dataset.id); if(c) formAchat(c); },
  'coop-annuler': async el => {
    const c = S.coop.commandes.find(x => x.id === el.dataset.id); if(!c) return;
    if(!await confirmer('Annuler l’achat ?', 'La dépense de <b>'+argent(c.total, c.devise)+'</b> sera retirée de la caisse et la commande n°'+c.num+' redeviendra modifiable.', 'Annuler l’achat')) return;
    try { coopMaj(await api('coopAnnulerAchat', c.id)); toast('Achat annulé : la dépense est retirée de la caisse.'); } catch(e){ erreur(e); }
  },
  'coop-suppr': async el => {
    const c = S.coop.commandes.find(x => x.id === el.dataset.id); if(!c) return;
    if(!await confirmer('Supprimer la commande n°'+c.num+' ?', 'La commande ('+pluriel(c.participants.length, 'membre')+', '+argent(c.total, c.devise)+') sera supprimée. La caisse n’est pas touchée.')) return;
    try { coopMaj(await api('coopSupprimer', c.id)); toast('Commande supprimée.'); } catch(e){ erreur(e); }
  },
  'coop-pdf': el => coopPdf(el),
  'coop-hist': el => { S.coopHist[el.dataset.id] = !S.coopHist[el.dataset.id]; rendreTresorier(); const r = $('#recu-'+CSS.escape(el.dataset.id)); if(r) r.scrollIntoView({behavior:'smooth', block:'start'}); },
  'coop-tout-hist': () => { S.coopVoirHist = true; rendreTresorier(); },
  'coop-actualiser': async el => { el.innerHTML = '<span class="spin"></span>'; S.coop = null; rendreTresorier(); await chargerCoop(); },
  'cf-devise': el => { S.cf.devise = el.dataset.v; S.cfPick = null; $$('#coop-dev button').forEach(b => b.classList.toggle('actif', b === el));
    Object.values(S.cf.lignes).forEach(l => l.forEach(x => { const a = cfItem(x.article); if(a){ x.prix = a.prix; x.nouveau = false; } else x.nouveau = true; })); cfRendre(); },
  'cf-groupe': el => { const l = $$('#f-coop .cf-p').filter(i => i.dataset.g === el.dataset.v), tous = l.every(i => i.checked);
    l.forEach(i => { if(i.checked === !tous) return; i.checked = !tous; i.closest('.presence').classList.toggle('oui', !tous); const cf = S.cf, k = norm(i.value), j = cf.choisis.findIndex(n => norm(n) === k);
      if(!tous && j < 0){ cf.choisis.push(i.value); cf.groupes[k] = i.dataset.g; if(!cf.lignes[k]) cf.lignes[k] = []; }
      if(tous && j >= 0){ cf.choisis.splice(j, 1); if(S.cfPick && S.cfPick.k === k) S.cfPick = null; } });
    cfRendre(); },
  'cf-autre': () => { const i = $('#cf-autre'); const n = i.value.trim().replace(/\s+/g, ' '); if(!n) return i.focus();
    if(S.cf.choisis.some(x => norm(x) === norm(n))){ toast('« '+n+' » est déjà dans la commande.', 'erreur'); return; }
    const mb = $$('#f-coop .cf-p').find(c => norm(c.value) === norm(n));
    if(mb){ mb.checked = true; mb.closest('.presence').classList.add('oui'); cfChoisir(mb.value, mb.dataset.g, true); }
    else { $('#cf-autres').insertAdjacentHTML('beforeend', coopTagAutre(n)); cfChoisir(n, '', true); }
    i.value = ''; i.focus(); },
  'cf-autre-suppr': el => { const t = el.closest('.serv-autre'); cfChoisir(t.dataset.v, '', false); t.remove(); },
  'cf-ligne': el => { const k = el.closest('.cf-m').dataset.k; S.cfPick = S.cfPick && S.cfPick.k === k && S.cfPick.i === -1 ? null : {k:k, i:-1}; cfRendre(); },
  'cf-pick': el => { const k = el.closest('.cf-m').dataset.k, i = Number(el.closest('.cf-l').dataset.i); S.cfPick = S.cfPick && S.cfPick.k === k && S.cfPick.i === i ? null : {k:k, i:i}; cfRendre(); },
  'cf-pick-tous': () => { if(!S.cf.choisis.length) return toast('Choisissez d’abord les membres.', 'erreur'); S.cfPick = S.cfPick && S.cfPick.tous ? null : {tous:true}; cfRendre(); },
  'cf-pick-fermer': () => { S.cfPick = null; cfRendre(); },
  'cf-pick-choisir': el => { const a = S.coop.catalogue.find(x => x.id === el.dataset.id); if(a) cfAppliquer(q => cfLigne(a, q)); },
  'cf-pick-autre': el => { const pk = el.closest('.cf-picker'), n = $('.cf-an', pk).value.trim().replace(/\s+/g, ' '), p = Number($('.cf-ap', pk).value);
    if(!n){ $('.cf-an', pk).focus(); return toast('Indiquez le nom de l’article.', 'erreur'); }
    const a = cfItem(n);
    if(a){ cfAppliquer(q => cfLigne(a, q)); toast('« '+a.article+' » est déjà dans le catalogue : son prix est repris.'); return; }
    if(!(p > 0)){ $('.cf-ap', pk).focus(); return toast('Indiquez le prix de « '+n+' ».', 'erreur'); }
    cfAppliquer(q => ({article:n, prix:p, quantite:q || 1, precision:'', opts:{}, libre:true, nouveau:true})); },
  'cf-ligne-suppr': el => { const k = el.closest('.cf-m').dataset.k, i = Number(el.closest('.cf-l').dataset.i); S.cf.lignes[k].splice(i, 1); S.cfPick = null; cfRendre(); },
  'cat-ajout': () => { $('#cat-liste').insertAdjacentHTML('beforeend', S.catRangee({})); const a = $$('#cat-liste .cat-a').pop(); if(a) a.focus(); },
  'cat-suppr': el => el.closest('.cat-l').remove()
});
Object.assign(CHANGES, { 'coop-payer': el => coopPayer(el) });

/* =================================================================
 *  TRÉSORIER › COTISATION ANNUELLE (Troupe, Meute, Clan) — chaque paiement entre dans la caisse
 *  sous « Cotisation annuelle <année> ». La Maîtrise la suit en lecture seule (Caisses des unités).
 * ================================================================= */
Object.assign(S, {cot:null, cotAnnee:'', cotF:{q:'', statut:''}});
const COT_STATUT = {ajour:['À jour', 'vert'], partiel:['Partiel', 'jaune'], rien:['Rien payé', 'rouge'], dispense:['Dispensé', 'gris']};
async function chargerCot(){
  try { S.cot = await api('cotisationDonnees', S.cotAnnee); S.cotAnnee = S.cot.annee; } catch(e){ erreur(e); }
  if(S.vue === 'tresorier' && S.trOnglet === 'cotisation') rendreTresorier();
}
function cotMaj(r){
  S.cot = r; S.cotAnnee = r.annee;
  if(r.caisse){ S.treso = r.caisse; S.resume = null; }
  if(S.vue === 'tresorier') rendreTresorier();
}
function rendreCotisation(){
  const d = S.cot, sec = SEC.tresorier, el = $('#vue-tresorier');
  const actions = '<button class="btn primaire cot-btn" data-act="cot-montant"'+(d ? '' : ' disabled')+'>'+ic('crayon')+'Montant par personne</button>'+
    (d ? '<a class="btn lien" href="'+esc(d.lien)+'" target="_blank" rel="noopener">'+ic('tableur')+'Fichier</a>' : '');
  if(!d){ el.innerHTML = hero(sec, actions)+ongletsTreso()+squelette(); return; }
  el.innerHTML = hero(sec, actions)+ongletsTreso()+cotCorps(d, false);
  rendreCotListe();
}
/** Le corps de l'écran (aussi pour le suivi de la Maîtrise, en lecture seule). */
function cotCorps(d, lecture){
  const t = d.totaux, dev = d.devise, pct = t.attendu ? Math.min(100, t.paye / t.attendu * 100) : 0;
  const G = d.groupe, ordre = G.unites.concat(Array.from(new Set(d.membres.map(m => m.groupe))).filter(g => G.unites.indexOf(g) < 0));
  const parG = ordre.map(g => { const l = d.membres.filter(m => m.groupe === g); return {g:g, l:l, du:l.reduce((s, m) => s + m.du, 0), paye:l.reduce((s, m) => s + m.paye, 0)}; }).filter(x => x.l.length);
  return '<div class="carte cot-tete"><div class="cot-tete-g">'+
      (lecture ? '<span class="cot-annee-l">'+ic('calendrier')+'Année '+esc(d.annee)+'</span>'
        : '<label class="annee">'+ic('calendrier')+'<select data-change="cot-annee" aria-label="Année scoute">'+d.annees.map(a => '<option'+(a === d.annee ? ' selected' : '')+'>'+esc(a)+'</option>').join('')+'</select></label>')+
      '<div class="cot-montant"><span class="sous">Montant par personne</span><b>'+argent(d.montant, dev)+'</b>'+(lecture ? '' : '<button class="btn lien" data-act="cot-montant">'+ic('crayon')+'Modifier</button>')+'</div></div>'+
      '<div class="cot-flag">'+ic('drapeau')+'<span>Dans la caisse : « '+esc(d.evenement)+' »</span></div></div>'+
    '<div class="kpis mt">'+
      '<div class="kpi vedette cot-kpi"><div class="lbl">'+ic('bourse')+'Encaissé</div><div class="val">'+argent(t.paye, dev)+'</div><div class="det">sur '+argent(t.attendu, dev)+' attendus</div></div>'+
      '<div class="kpi"><div class="lbl">'+ic('alerte')+'Reste à percevoir</div><div class="val '+(t.reste > 0.004 ? 'moins-c' : 'plus-c')+'">'+argent(t.reste, dev)+'</div><div class="det">'+pluriel(t.partiel + t.rien, 'membre')+' doi'+(t.partiel + t.rien > 1 ? 'vent' : 't')+' encore</div></div>'+
      '<div class="kpi"><div class="lbl">'+ic('check')+'À jour</div><div class="val plus-c">'+t.ajour+'<small> / '+(t.n - t.dispense)+'</small></div><div class="det">'+pluriel(t.partiel, 'paiement partiel', 'paiements partiels')+'</div></div>'+
      '<div class="kpi"><div class="lbl">'+ic('etoile')+'Exceptions</div><div class="val">'+t.exceptions+'</div><div class="det">'+pluriel(t.dispense, 'dispensé', 'dispensés')+'</div></div></div>'+
    '<div class="carte mt"><div class="cot-glob"><div class="cot-glob-t"><b>'+Math.round(pct)+' %</b> de la cotisation '+esc(d.annee)+' encaissée</div><div class="cot-bar grand"><i style="width:'+pct.toFixed(1)+'%"></i></div></div>'+
      (parG.length ? '<div class="barres mt">'+parG.map(x => { const p = x.du ? x.paye / x.du * 100 : 100;
        return '<div class="barre-l"><div class="nom"><span class="pat-pastille" style="--pc:'+cotCoul(d, x.g)+'"></span><span>'+esc(x.g || 'Autres')+'</span></div><div><div class="piste"><div class="fond"><div class="rempli" style="width:'+Math.max(x.paye > 0 ? 2 : 0, p).toFixed(1)+'%;background:var(--vert)"></div></div><span class="v">'+argent(x.paye, dev)+' / '+argent(x.du, dev)+'</span></div>'+
          '<div class="sous">'+x.l.filter(m => m.statut === 'ajour').length+' / '+x.l.filter(m => m.statut !== 'dispense').length+' à jour'+(x.du - x.paye > 0.004 ? ' · reste '+argent(x.du - x.paye, dev) : '')+'</div></div></div>'; }).join('')+'</div>' : '')+'</div>'+
    (lecture ? '<div class="carte mt"><div class="carte-titre"><h2>'+ic('groupe')+'Membres</h2><span class="sous">'+pluriel(t.n, 'membre')+'</span></div>'+cotListeHtml(d, true, d.membres)+'</div>'
      : '<div class="carte mt"><div class="carte-titre"><h2>'+ic('groupe')+'Membres</h2><span class="sous" id="cot-compte"></span></div>'+
        '<div class="barre-outils"><label class="recherche">'+ic('recherche')+'<input type="search" placeholder="Rechercher un membre…" data-filtre="cotF.q" value="'+esc(S.cotF.q)+'"></label>'+
        '<div class="puces">'+[['', 'Tous'], ['apayer', 'À payer'], ['partiel', 'Partiel'], ['ajour', 'À jour'], ['exception', 'Exceptions']].map(f => '<button class="puce '+(S.cotF.statut === f[0] ? 'actif' : '')+'" data-act="cot-filtre" data-v="'+f[0]+'">'+f[1]+'</button>').join('')+'</div></div>'+
        '<div id="cot-liste"></div></div>');
}
function cotCoul(d, g){ const i = d.groupe.unites.indexOf(g); return i < 0 ? '#8A939B' : COUL_PAT[i % COUL_PAT.length]; }
function rendreCotListe(){
  const d = S.cot, z = $('#cot-liste'); if(!d || !z) return;
  const q = norm(S.cotF.q), f = S.cotF.statut;
  const l = d.membres.filter(m => (!q || norm(m.nom+' '+m.groupe).indexOf(q) >= 0) &&
    (!f || (f === 'apayer' ? m.statut === 'rien' || m.statut === 'partiel' : f === 'exception' ? !!m.exception : m.statut === f)));
  const c = $('#cot-compte'); if(c) c.textContent = pluriel(l.length, 'membre');
  z.innerHTML = cotListeHtml(d, false, l);
}
function cotListeHtml(d, lecture, l){
  if(!d.membres.length) return vide('groupe', 'Aucun membre pour '+d.annee, 'Les membres viennent de « Secrétaire › Présences » (tous les trimestres de l’année).');
  if(!l.length) return vide('recherche', 'Aucun membre trouvé', 'Modifiez la recherche ou le filtre.');
  const dev = d.devise, G = d.groupe, ordre = G.unites.concat(Array.from(new Set(l.map(m => m.groupe))).filter(g => G.unites.indexOf(g) < 0));
  return ordre.map(g => { const ms = l.filter(m => m.groupe === g); if(!ms.length) return '';
    return '<div class="cot-g"><div class="cot-gt" style="--pc:'+cotCoul(d, g)+'"><span class="pat-pastille"></span><b>'+esc(g ? G.titre+' '+g : 'Autres')+'</b><span>'+argent(ms.reduce((s, m) => s + m.paye, 0), dev)+' / '+argent(ms.reduce((s, m) => s + m.du, 0), dev)+'</span></div>'+
      ms.map(m => cotMembreHtml(d, m, lecture)).join('')+'</div>'; }).join('');
}
function cotMembreHtml(d, m, lecture){
  const dev = d.devise, st = COT_STATUT[m.statut], pct = m.du ? Math.min(100, m.paye / m.du * 100) : 100;
  const nomA = esc(m.nom);
  return '<div class="cot-m s-'+m.statut+'"><div class="cot-mt"><div class="cot-nom"><b>'+nomA+'</b><span class="tag '+st[1]+'">'+st[0]+'</span>'+
      (m.exception && (m.exception.montant || m.exception.raison) ? '<span class="tag cot-exc" title="'+esc(m.exception.raison || '')+'">'+ic('etoile')+(m.exception.montant ? 'Exception : '+argent(m.exception.montant, dev)+(m.exception.raison ? ' — '+esc(m.exception.raison) : '') : esc(m.exception.raison))+'</span>' : '')+
      (m.ancien ? '<span class="tag">Plus dans la liste des membres</span>' : '')+'</div>'+
    (m.du > 0 ? '<div class="cot-bar"><i style="width:'+pct.toFixed(1)+'%"></i></div><div class="sous">Payé <b class="plus-c">'+argent(m.paye, dev)+'</b> sur '+argent(m.du, dev)+(m.reste > 0.004 ? ' · reste <b class="moins-c">'+argent(m.reste, dev)+'</b>' : m.paye > m.du + 0.004 ? ' · '+argent(m.paye - m.du, dev)+' de plus que le montant dû' : '')+'</div>'
      : '<div class="sous">Ne paie pas de cotisation cette année.</div>')+
    (m.paiements.length ? '<div class="cot-pays">'+m.paiements.map(p => '<span class="cot-p" title="'+esc((p.remarque ? p.remarque+' · ' : '')+(p.par ? 'noté par '+p.par : ''))+'">'+ic('check')+dateCourte(p.date)+' · <b>'+argent(p.montant, dev)+'</b>'+
        (lecture ? '' : '<button type="button" class="icone-btn" data-act="cot-suppr" data-id="'+esc(p.id)+'" data-nom="'+nomA+'" aria-label="Retirer ce paiement">'+ic('x')+'</button>')+'</span>').join('')+'</div>' : '')+'</div>'+
    (lecture ? '' : '<div class="cot-a">'+(m.reste > 0.004 ? '<button class="btn vert" data-act="cot-tout" data-nom="'+nomA+'">'+ic('check')+'Payé en entier · '+argent(m.reste, dev)+'</button><button class="btn fantome" data-act="cot-partiel" data-nom="'+nomA+'">'+ic('plus')+'Paiement partiel</button>' : '')+
      '<button class="icone-btn" data-act="cot-exception" data-nom="'+nomA+'" title="Exception (montant réduit ou dispense)" aria-label="Exception">'+ic('etoile')+'</button></div>')+'</div>';
}
const cotTrouver = nom => S.cot.membres.find(m => m.nom === nom);
function formCotPaiement(m){
  const d = S.cot, dev = d.devise;
  const md = ouvrirModal({titre:'Paiement de '+esc(m.nom), icone:'bourse', couleur:'var(--vert)',

/** Dimensions de la photo dans le cadre (« couvrir » × zoom) et décalage permis. */
function couvGeom(){
  const C = S.couv, mo = C.res.modeles[C.format], i = C.img;
  const s = Math.max(mo.w / i.width, mo.h / i.height) * C.zoom, w = i.width * s, h = i.height * s;
  const mx = Math.max(0, (w - mo.w) / 2), my = Math.max(0, (h - mo.h) / 2);
  C.ox = Math.max(-mx, Math.min(mx, C.ox)); C.oy = Math.max(-my, Math.min(my, C.oy));
  return {mo, s, w, h, x:(mo.w - w) / 2 + C.ox, y:(mo.h - h) / 2 + C.oy};
}
/** Dessine la couverture dans un canvas à la taille du modèle : photo, bande, logo et trait, puis les deux textes. */
function couvDessin(cv){
  const C = S.couv, mo = C.res.modeles[C.format], x = cv.getContext('2d');
  x.setTransform(1, 0, 0, 1, 0, 0); x.clearRect(0, 0, mo.w, mo.h);
  if(C.img){ const g = couvGeom(); x.imageSmoothingQuality = 'high'; x.drawImage(C.img, g.x, g.y, g.w, g.h); }
  else { const gr = x.createLinearGradient(0, 0, mo.w, mo.h); gr.addColorStop(0, '#8E99A6'); gr.addColorStop(1, '#5E6A77'); x.fillStyle = gr; x.fillRect(0, 0, mo.w, mo.h); }
  // bande de couleur (position et taille du modèle Canva ; un écart de moins de 3 px avec le bas est comblé)
  const b = typeof mo.bande === 'object' ? mo.bande : {y:mo.bande, h:mo.h - mo.bande};
  x.fillStyle = C.couleur; x.fillRect(0, b.y, mo.w, mo.h - (b.y + b.h) < 3 ? mo.h - b.y : b.h);
  // logo (taille et position exactes), puis le trait blanc sous les titres (épaisseur 1)
  mo.calques.forEach(c => x.drawImage(c.img, c.x, c.y, c.w, c.h));
  if(mo.ligne){ x.fillStyle = '#fff'; x.fillRect(mo.ligne.x1, mo.ligne.y - mo.ligne.ep / 2, mo.ligne.x2 - mo.ligne.x1, mo.ligne.ep); }
  const trop = {};
  [['titre', 'EstelaPara', C.titre], ['unite', 'EstelaLora', C.unite]].forEach(t => {
    const spec = mo[t[0]], txt = String(t[2] || '').trim(); if(!txt) return;
    x.font = spec.taille+'px '+t[1]; x.textAlign = 'left'; x.textBaseline = 'alphabetic'; x.direction = 'ltr';
    try { x.letterSpacing = '0px'; } catch(e){ /* ancien navigateur */ }
    const m = x.measureText(txt), ink = m.actualBoundingBoxLeft + m.actualBoundingBoxRight, gauche = mo.w / 2 - ink / 2 + m.actualBoundingBoxLeft;
    x.lineJoin = 'round'; x.miterLimit = 2; x.lineWidth = spec.trait; x.strokeStyle = '#000'; x.strokeText(txt, gauche, spec.base);
    x.fillStyle = '#fff'; x.fillText(txt, gauche, spec.base);
    trop[t[0]] = ink + spec.trait > mo.w - 2 * COUV_MARGE;
  });
  return trop;
}
let couvImage = 0;
function couvDessiner(){
  if(couvImage) return;
  couvImage = requestAnimationFrame(() => {
    couvImage = 0;
    const cv = $('#couv-canvas'); if(!cv || !S.couv.res) return;
    const t = couvDessin(cv);
    ['titre', 'unite'].forEach(k => { const a = $('#couv-trop-'+k); if(a) a.hidden = !t[k]; });
    S.couv.trop = t;
  });
}
function couvZoomer(z, px, py){
  const C = S.couv; if(!C.img) return;
  const avant = C.zoom; z = Math.max(1, Math.min(4, z)); if(z === avant) return;

/** Cet écran est-il ouvert ? Le compte d'une section ouvre son travail ET son suivi ; l'administrateur règle ce qui s'ouvre sans mot de passe. */
function ouvert(id){
  if(!REGLAGES.maitrise || id === 'accueil' || id === 'suivi') return true;
  const s = S.session;
  if(id === 'admin') return !!(s && s.admin);
  const k = id.indexOf('u-') === 0 ? id.slice(2) : id, libre = id.indexOf('u-') === 0 ? 'suivi:'+k : k;
  return S.libres.indexOf(libre) >= 0 || !!(s && s.sections.indexOf(k) >= 0);
}

function brancherConnexion(f, id){
  if(!f) return;
  f.onsubmit = async ev => {
    ev.preventDefault();
    const u = f.u.value.trim(), p = f.p.value;
    if(!p) { f.p.focus(); return toast('Tapez le mot de passe.', 'erreur'); }
    await chargement($('button[type=submit]', f), 'Vérification…', async () => {
      try {
        const avant = S.session ? S.session.sections.slice() : [];
        const s = await api('connexion', u, p, S.session ? S.session.jeton : '');
        definirSession(s, true); S.resume = null;
        const nouvelles = s.sections.filter(k => avant.indexOf(k) < 0);
        if(id && !ouvert(id)){
          if(S.vue === id && !$('#modal-root').classList.contains('ouvert')) rendreConnexion(id);
          else f.p.value = '';
          return toast('Ce compte ouvre '+(nouvelles.length ? nomsSections(nouvelles) : 'des sections déjà ouvertes')+', mais pas « '+SEC[id].titre+' ».', 'erreur');
        }
        if($('#modal-root').classList.contains('ouvert')) fermerModal();
        toast(s.admin && id === 'admin' ? 'Administration ouverte.' : s.sections.length === M_PROPRES.length ? 'Toutes les sections sont ouvertes.' : 'Section'+(s.sections.length > 1 ? 's' : '')+' ouverte'+(s.sections.length > 1 ? 's' : '')+' : '+nomsSections(s.sections)+'.');

      } catch(e){ f.p.value = ''; f.p.focus(); erreur(e); }
    });
  };
}

/* ---------------- Suivi des unités : chargement ---------------- */
/** Exécute f() avec un état temporaire (les données d'une unité) : permet de réutiliser les calculs et les vues des sections. */
function avecEtat(etat, f){
  const sauve = {}, ens = REGLAGES.ensemble;
  Object.keys(etat).forEach(k => { if(k === '_ensemble') return; sauve[k] = S[k]; S[k] = etat[k]; });
  if(etat._ensemble) REGLAGES.ensemble = etat._ensemble;
  try { return f(); } finally { Object.keys(sauve).forEach(k => { S[k] = sauve[k]; }); REGLAGES.ensemble = ens; }
}
/** Rend un morceau d'écran inerte : boutons et cases désactivés ; seules les actions listées sont gardées (sous un autre nom). */
function inerte(html, garder){
  garder = garder || {};
  return html.replace(/data-(act|change|filtre)="([^"]*)"/g, (m, t, v) => garder[v] ? 'data-act="'+garder[v]+'"' : 'data-inerte="'+v+'"')
    .replace(/<(input|select|textarea)\b/g, '<$1 disabled').replace(/<button\b(?![^>]*data-act=)/g, '<button disabled');
}
function uCle(cle, quoi){ const p = quoi === 'presences' ? S.u.per[cle] : null; return cle+'|'+quoi+(p ? '|'+p.annee+'|'+p.trimestre : ''); }
function uEtat(cle, quoi){ return S.u.cache[uCle(cle, quoi)]; }
async function uCharger(cle, quoi){
  const k = uCle(cle, quoi), per = quoi === 'presences' ? S.u.per[cle] : null;
  const e = S.u.cache[k] = {etat:'attente'};
  try {
    e.r = await api('uniteDonnees', cle, quoi, per ? per.annee : '', per ? per.trimestre : '');
    e.etat = 'ok';
    if(quoi === 'presences' && !per && e.r.donnees && S.u.cache[k] === e){      // période choisie par le serveur : on la retient
      S.u.per[cle] = {annee:e.r.donnees.annee, trimestre:e.r.donnees.trimestre}; delete S.u.cache[k]; S.u.cache[uCle(cle, quoi)] = e;
    }
  } catch(err){ e.etat = 'erreur'; e.msg = msgErr(err); }
  majUnites();
}
/** {d: données} ou {attente} / {erreur} / {introuvable} */
function uDon(cle, quoi){
  const e = uEtat(cle, quoi);
  if(!e || e.etat === 'attente') return {attente:true};
  if(e.etat === 'erreur') return {erreur:e.msg};
  if(e.r.introuvable) return {introuvable:e.r.message};
  return {d:e.r.donnees};
}

const barreW = (v, max) => Math.max(v > 0 ? 2 : 0, max ? v / max * 100 : 0).toFixed(1)+'%';

/* ---------------- Trésorier : caisse de chaque unité ---------------- */
function caisseCalc(d, dev){
  const ops = d.operations.filter(o => o.devise === dev), som = n => ops.filter(o => o.nature === n).reduce((s, o) => s + o.montant, 0);
  const E = som('Entrée'), D = som('Dépense');
  return {ops:ops, E:E, D:D, solde:E - D};
}
function uApercuTresorier(u){
  const x = uDon(u.cle, 'caisse'); if(!x.d) return uPlace(x, 150);
  const us = caisseCalc(x.d, 'USD'), lb = caisseCalc(x.d, 'LBP'), dern = x.d.operations[0], tot = us.E + us.D;
  return '<div class="u-grand '+(us.solde < 0 ? 'moins-c' : '')+'">'+argent(us.solde, 'USD')+'</div><div class="sous">Solde de la caisse'+(lb.ops.length ? ' · <b>'+argent(lb.solde, 'LBP')+'</b>' : '')+'</div>'+
    '<div class="u-split">'+(tot ? '<i class="e" style="width:'+(us.E / tot * 100).toFixed(1)+'%"></i><i class="d" style="width:'+(us.D / tot * 100).toFixed(1)+'%"></i>' : '')+'</div>'+
    '<div class="u-lignes"><span><i class="pt e"></i>Entrées<b>'+argent(us.E, 'USD')+'</b></span><span><i class="pt d"></i>Dépenses<b>'+argent(us.D, 'USD')+'</b></span></div>'+
    '<div class="u-pied">'+pluriel(x.d.operations.length, 'opération')+(dern ? ' · dernière le '+dateCourte(dern.date) : '')+'</div>'+uApercuCot(u);
}
/** Cotisation annuelle d'une unité, en une ligne (carte de la vue d'ensemble). */
function uApercuCot(u){
  const y = uDon(u.cle, 'cotisation'); if(!y.d) return y.attente ? '<div class="sq" style="height:40px;margin-top:10px"></div>' : '';
  const t = y.d.totaux, pc = t.attendu ? Math.min(100, t.paye / t.attendu * 100) : 0;

    '<div class="u-lignes"><span>'+ic('check')+t.ajour+' / '+(t.n - t.dispense)+' à jour</span><span>'+ic('bourse')+'<b>'+argent(t.paye, y.d.devise)+'</b> / '+argent(t.attendu, y.d.devise)+'</span></div>';
}
/** Trésorier d'une unité : la caisse, ou la cotisation annuelle (lecture seule). */

function uTotalTresorier(){
  const l = SUIVI.map(u => ({u:u, x:uDon(u.cle, 'caisse')})).filter(o => o.x.d);
  if(l.length < 2) return '';
  const c = l.map(o => Object.assign({u:o.u}, caisseCalc(o.x.d, 'USD'))), lb = l.map(o => caisseCalc(o.x.d, 'LBP'));
  const tot = c.reduce((a, o) => a + o.solde, 0), totL = lb.reduce((a, o) => a + o.solde, 0), max = Math.max(1, ...c.map(o => Math.abs(o.solde)));
  return '<div class="carte u-total"><div class="u-total-g"><div class="lbl">'+ic('bourse')+'Caisses des unités</div><div class="val '+(tot < 0 ? 'moins-c' : '')+'">'+argent(tot, 'USD')+'</div>'+
    '<div class="sous">'+pluriel(l.length, 'unité')+(lb.some(o => o.ops.length) ? ' · '+argent(totL, 'LBP') : '')+'</div></div>'+
    '<div class="barres u-total-d">'+c.map(o => '<div class="barre-l"><div class="nom"><span class="pat-pastille" style="--pc:'+o.u.couleur+'"></span><span>'+esc(o.u.nom)+'</span></div><div class="piste"><div class="fond"><div class="rempli" style="width:'+barreW(Math.abs(o.solde), max)+';background:'+(o.solde < 0 ? 'var(--rouge)' : o.u.couleur)+'"></div></div><span class="v">'+argent(o.solde, 'USD')+'</span></div></div>').join('')+'</div></div>';
}
function uJournalLignes(d){
  const q = norm(S.u.q), idx = new Map(d.operations.map((o, i) => [o, i]));
  const l = d.operations.filter(o => o.devise === S.u.dev && (!S.u.nature || o.nature === S.u.nature) && (!S.u.ev || (S.u.ev === '-' ? !o.evenement : norm(o.evenement) === norm(S.u.ev))) &&
    (!q || norm(o.cause+' '+o.categorie+' '+o.remarque+' '+o.journee+' '+(o.evenement || '')).indexOf(q) >= 0));
  const ligne = (o, enfant) => { const ent = o.nature === 'Entrée';
    return '<tr class="cliquable'+(enfant ? ' ev-enfant' : '')+'" data-act="u-op" data-i="'+idx.get(o)+'"><td class="nowrap">'+dateCourte(o.date)+'</td><td><div class="cellule-t">'+esc(o.cause)+'</div>'+(o.remarque ? '<div class="sous">'+esc(o.remarque)+'</div>' : '')+'</td>'+
      '<td>'+tagJournee(o.journee)+'</td><td class="hide-m">'+esc(o.categorie)+'</td>'+
      '<td class="num nowrap"><b class="'+(ent ? 'plus-c' : 'moins-c')+'">'+(ent ? '+ ' : '− ')+argent(o.montant, o.devise)+'</b></td><td class="num">'+ic('chevron', 'u-chev')+'</td></tr>'; };
  return l.length ? lignesJournal(l, S.u.evOuverts, ligne, 'u-ev-ouvrir', S.u.dev)
    : '<tr><td colspan="6">'+vide('bourse', d.operations.length ? 'Aucune opération trouvée' : 'Aucune opération', d.operations.length ? 'Modifiez la recherche ou la devise.' : 'Cette unité n’a encore rien enregistré dans sa caisse.')+'</td></tr>';

function uDetailTresorier(u){
  const x = uDon(u.cle, 'caisse'); if(!x.d) return uEntete(u, 'Caisse', '', '')+uPlace(x, 260);
  const d = x.d, dev = S.u.dev, c = caisseCalc(d, dev), ops = c.ops;
  if(S.u.ev && S.u.ev !== '-'){ const ex = evenementsDe(d.operations).find(e => norm(e.nom) === norm(S.u.ev)); S.u.ev = ex ? ex.nom : ''; }
  const som = (l, n) => l.filter(o => o.nature === n).reduce((s, o) => s + o.montant, 0);
  const mois = aujourdhui().slice(0, 7), om = ops.filter(o => o.date.slice(0, 7) === mois), netMois = som(om, 'Entrée') - som(om, 'Dépense');

/* ---------------- Secrétaire : présences et progression ---------------- */
function uCalcPres(d){ return d.membres.length ? avecEtat({pres:d, prog:null, statType:'', statPour:'', statTri:'unite'}, () => calcStats()) : null; }
function uEtatsProg(d){
  return avecEtat({prog:d, pres:null}, () => d.membres.map(m => d.config.type === 'clan' ? etatClan(m) : d.config.type === 'meute' ? etatMeute(m) : etatMembre(m)));
}
/** [libellé, nombre, sur (ou null pour un simple total), couleur] */
function uResumeProg(d){
  const E = uEtatsProg(d), N = d.membres.length, C = d.config, n = f => E.filter(f).length, tot = f => E.reduce((a, e) => a + f(e), 0);
  if(C.type === 'clan') return C.ETAPES.map((e, i) => [e.nom, n(x => x.etapes[i].fait), N, coulEtape(e)]).concat([['Jalons', tot(x => x.nJ), null, '#7A5230']]);
  if(C.type === 'meute') return [[(C.ASPIRANT || 'Aspirant')+'s', n(x => x.aspirant), N, '#8A7A68']].concat(C.PARTIES.map((p, i) => [p.nom, n(x => x.parties[i].ok), N, p.couleur])).concat([['Brevets', tot(x => x.brevets.length), null, C.BREVETS.couleur]]);
  return [[C.PROMESSE.nom, n(x => x.promOk), N, C.PROMESSE.couleur], [C.DEUXIEME.nom, n(x => x.deuxOk), N, C.DEUXIEME.couleur], [C.PREMIERE.nom, n(x => x.premOk), N, C.PREMIERE.couleur],
    [C.RAIDER.nom, n(x => x.raider), N, C.RAIDER.couleur], ['Badges', tot(x => x.badges.length), null, C.BADGES.couleur]];
}

      '<div class="u-jauge">'+jauge(s && s.nR ? s.total.v : null, u.couleur)+'</div>'+
      '<div class="u-lignes"><span>'+ic('groupe')+pluriel(d.membres.length, 'membre')+'</span><span>'+ic('calendrier')+pluriel(s ? s.nR : 0, act)+'</span></div>'; }

 * ================================================================= */
const SAISONS_DESACTIVEES = [];

};
/* ---------- dates ---------- */
function saisonCle(d){ return d.getFullYear() * 10000 + (d.getMonth() + 1) * 100 + d.getDate(); }
function saisonPlus(d, j){ const x = new Date(d.getFullYear(), d.getMonth(), d.getDate() + j); return x; }
/** Pâques (calendrier grégorien, Églises catholiques et maronite). */
function paquesLatine(y){
  const a = y % 19, b = Math.floor(y / 100), c = y % 100, d = Math.floor(b / 4), e = b % 4, f = Math.floor((b + 8) / 25), g = Math.floor((b - f + 1) / 3);
  const h = (19 * a + b - d - g + 15) % 30, i = Math.floor(c / 4), k = c % 4, l = (32 + 2 * e + 2 * i - h - k) % 7, m = Math.floor((a + 11 * h + 22 * l) / 451);
  const mois = Math.floor((h + l - 7 * m + 114) / 31), jour = ((h + l - 7 * m + 114) % 31) + 1;
  return new Date(y, mois - 1, jour);
}
/** Pâques orthodoxe (calendrier julien, ramené au grégorien : + 13 jours de 1900 à 2099). */
function paquesOrthodoxe(y){
  const a = y % 4, b = y % 7, c = y % 19, d = (19 * c + 15) % 30, e = (2 * a + 4 * b - d + 34) % 7;
  const mois = Math.floor((d + e + 114) / 31), jour = ((d + e + 114) % 31) + 1;
  return new Date(y, mois - 1, jour + 13);
}
/** La fête du jour (une seule : la plus importante) ou null. */
function saisonDuJour(date){
  const d = new Date(date.getFullYear(), date.getMonth(), date.getDate()), y = d.getFullYear(), m = d.getMonth() + 1, j = d.getDate(), k = saisonCle(d);
  const entre = (a, b) => k >= saisonCle(a) && k <= saisonCle(b);
  const l = [];
  if((m === 12 && j === 31) || (m === 1 && j === 1)) l.push({id:'nouvel-an', annee:m === 12 ? y + 1 : y, veille:m === 12});
  if(m === 12 && j <= 30) l.push({id:'noel', jours:25 - j});
  const pl = paquesLatine(y), po = paquesOrthodoxe(y);
  if(entre(pl, saisonPlus(pl, 7))) l.push({id:'paques', jour:Math.round((d - pl) / 864e5), orthodoxe:saisonCle(po) === k});
  else if(entre(po, saisonPlus(po, 1))) l.push({id:'paques', jour:Math.round((d - po) / 864e5), orthodoxe:true});
  if(k === saisonCle(saisonPlus(pl, -7)) || k === saisonCle(saisonPlus(po, -7))) l.push({id:'rameaux'});
  // saints patrons des unités (4 octobre, 23 avril, 29 juin) : avant l'octave de Pâques, mais pas avant le dimanche et le lundi de Pâques
  const patron = m === 4 && j === 23 ? 'saint-georges' : m === 6 && j === 29 ? 'saint-paul' : m === 10 && j === 4 ? 'saint-francois' : '';
  if(patron){ const ip = l.findIndex(x => x.id === 'paques' && x.jour > 1); if(ip >= 0) l.splice(ip, 0, {id:patron}); else l.push({id:patron}); }
  if(m === 11 && (j === 21 || j === 22)) l.push({id:'independance', veille:j === 21});
  if(m === 9 && (j === 13 || j === 14)) l.push({id:'croix', veille:j === 13});
  if(m === 8 && j === 15) l.push({id:'assomption'});
  if(m === 3 && j === 25) l.push({id:'annonciation'});
  if(m === 3 && j === 21) l.push({id:'fete-meres'});
  if(m === 2 && j === 9) l.push({id:'saint-maroun'});
  if(m === 2 && j === 22) l.push({id:'fondateurs', ans:y - 1857});
  const s = l.find(x => SAISONS_DESACTIVEES.indexOf(x.id) < 0);
  return s ? Object.assign(s, saisonTextes(s)) : null;
}

    const cx = saisonR(W * .15, W * .9), cy = saisonR(H * .08, H * .38), c = coul[Math.floor(saisonR(0, coul.length))], n = 46;
    for(let i = 0; i < n; i++){ const a = i / n * 6.283, v = saisonR(60, 150); CIEL.p.push({x:cx, y:cy, vx:Math.cos(a) * v, vy:Math.sin(a) * v, vie:0, max:saisonR(1.1, 1.8), c, r:saisonR(1.2, 2.2)}); }
  }
  x.globalCompositeOperation = 'source-over';
  CIEL.p = CIEL.p.filter(p => p.vie < p.max);
  CIEL.p.forEach(p => { p.vie += dt; p.vx *= .985; p.vy = p.vy * .985 + 60 * dt; p.x += p.vx * dt; p.y += p.vy * dt;
    const a = Math.max(0, 1 - p.vie / p.max); x.globalAlpha = a; x.fillStyle = p.c; x.shadowColor = p.c; x.shadowBlur = 6;
    x.beginPath(); x.arc(p.x, p.y, p.r, 0, 6.283); x.fill(); });
  x.shadowBlur = 0;
}

const emNrm = s => String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/[’']/g, ' ').replace(/[^a-z0-9]+/g, ' ').trim();
/* ---------- téléphones libanais : 8 chiffres (avec ou sans +961) ---------- */
function emNumero(d){
  d = String(d || '').replace(/\D/g, '');
  if(d.indexOf('00961') === 0) d = d.slice(5); else if(d.indexOf('961') === 0 && d.length >= 10) d = d.slice(3);
  if(d.length === 7 && '1345689'.indexOf(d.charAt(0)) >= 0) d = '0'+d;
  return d.length === 8 && EM_PREF.indexOf(d.slice(0, 2)) >= 0 ? d : '';
}
function emDecoupe(m){
  const ch = String(m || '').match(/\d+/g) || [], out = [];
  let i = 0;
  while(i < ch.length){
    if(ch[i] === '961' || ch[i] === '00961'){ i++; continue; }
    let t = null;
    for(let j = Math.min(ch.length, i+4); j > i && !t; j--){
      const d = ch.slice(i, j).join('');
      if(d.length > 13 || (j-i > 1 && ch[i].length > 2)) continue;
      const v = emNumero(d);
      if(v && (d.length >= 8 || j === ch.length || ch[j].length >= 2)) t = {v, j};
    }
    if(!t){ i++; continue; }
    if(out.indexOf(t.v) < 0) out.push(t.v);
    i = t.j;
    while(i < ch.length && ch[i].length <= 2 && (i+1 === ch.length || ch[i+1].length <= 2)) i++;
  }
  return out;
}
function emTels(txt){
  const ok = [], refuses = [];
  String(txt || '').split(/[,;\n]|\s\/\s|\/(?=\s*\+)/).map(x => x.trim()).filter(Boolean).forEach(m => {
    const l = emDecoupe(m); l.forEach(n => { if(ok.indexOf(n) < 0) ok.push(n); });
    if(!l.length && /\d/.test(m)) refuses.push(m);
  });
  return {ok, refuses};
}

function emCap(e){
  if(e.capMax == null && e.capMin == null) return e.capacite ? e.capacite : '';
  if(e.capMax >= 9999) return 'Sans limite';
  if(e.capMin && e.capMax && e.capMin !== e.capMax) return e.capMin+' à '+e.capMax+' pers.';

/* ---------- filtres ---------- */
function emFiltrer(){
  const d = S.empl, f = S.emF;
  if(!d || !d.liste) return [];
  const mots = emNrm(f.q).split(' ').filter(Boolean), qTel = String(f.q || '').replace(/\D/g, '');
  const n = parseInt(f.membres, 10);
  let l = d.liste.filter(e => {
    if(mots.length && !mots.every(m => e._q.indexOf(m) >= 0) && !(qTel.length >= 4 && e.tels.some(t => t.indexOf(qTel) >= 0 || ('961'+t.replace(/^0/, '')).indexOf(qTel) >= 0))) return false;
    if(f.type && e.type !== f.type) return false;
    if(f.lieu){
      const [k, v] = [f.lieu.slice(0, 2), f.lieu.slice(2)];
      if(k === 'r:' && e.region !== v) return false;
      if(k === 'c:' && e.caza !== v) return false;
      if(k === '0:' && (e.region || e.caza)) return false;
    }
    if(n > 0 && !(e.capMax != null && e.capMax >= n)) return false;         // seulement si la capacité est connue
    if(f.campe === '*' && !e.camps.length) return false;
    if(f.campe === '-' && e.camps.length) return false;
    if(f.campe && f.campe !== '*' && f.campe !== '-' && !e.camps.some(c => c.unite === f.campe)) return false;
    return true;
  });
  const fr = (a, b) => a.localeCompare(b, 'fr', {sensitivity:'base'});
  const tri = {
    nom:(a, b) => fr(a.nom, b.nom),
    lieu:(a, b) => fr(a.region || 'zz', b.region || 'zz') || fr(a.caza || 'zz', b.caza || 'zz') || fr(a.lieu || 'zz', b.lieu || 'zz') || fr(a.nom, b.nom),
    capacite:(a, b) => (b.capMax == null ? -1 : b.capMax) - (a.capMax == null ? -1 : a.capMax) || fr(a.nom, b.nom),
    camp:(a, b) => ((b.dernier && b.dernier.date) || '').localeCompare((a.dernier && a.dernier.date) || '') || fr(a.nom, b.nom),
    modifie:(a, b) => (b.modifieLe || b.le || '').localeCompare(a.modifieLe || a.le || '') || fr(a.nom, b.nom)
  }[f.tri] || ((a, b) => fr(a.nom, b.nom));
  return l.sort(tri);
}
function emOptionsLieu(d){

        ligne('epingle', 'Localisation', esc([e.lieu, e.caza, e.region].filter(Boolean).filter((x, i, a) => a.findIndex(y => emNrm(y) === emNrm(x)) === i).join(' · ') || '—')+(e.district ? '<br><span class="em-d-sec">District scout : '+esc(e.district)+'</span>' : ''))+
        ligne('telephone', 'Contact', (e.contact ? '<b>'+esc(e.contact)+'</b>' : '')+(e.tels.length ? '<div class="em-d-tels">'+e.tels.map(t => '<a class="em-tel" href="'+emTelLien(t)+'" data-act="em-tel">'+ic('telephone')+emTel(t)+'</a>').join('')+'</div>' : (e.contact ? '' : '—')))+
        ligne('groupe', 'Capacité', cap ? esc(cap)+(e.capacite && e.capacite !== cap ? '<br><span class="em-d-sec">'+esc(e.capacite)+'</span>' : '') : '<span class="em-d-sec">Non renseignée</span>')+
        ligne('bourse', 'Prix', (prix ? '<b>'+esc(prix)+'</b>' : '<span class="em-d-sec">Non renseigné</span>')+(e.frais ? '<br><span class="em-d-sec">Noté dans les listes : '+esc(e.frais)+'</span>' : ''))+
        (e.toilettes ? ligne('goutte', 'Sur place', 'Toilettes') : '')+
      '</div>'+
      (e.description ? '<div class="em-d-bloc"><h3>'+ic('doc')+'Description</h3><p>'+esc(e.description).replace(/\n/g, '<br>')+'</p></div>' : '')+
      (e.remarques ? '<div class="em-d-bloc"><h3>'+ic('alerte')+'Remarques</h3><p>'+esc(e.remarques).replace(/\n/g, '<br>')+'</p></div>' : '')+
      '<div class="em-d-bloc"><div class="em-d-camps-t"><h3>'+ic('etoile')+'Camps faits ici</h3><button class="btn fantome petit" data-act="em-camp" data-id="'+esc(e.id)+'">'+ic('plus')+'Ajouter un camp</button></div>'+
        (e.camps.length ? '<ul class="em-camps">'+e.camps.map(k => '<li style="--uc:'+emCouleur(k.unite)+'"><i></i><div><b>'+esc(k.unite)+'</b> · '+esc(k.camp)+'<small>'+esc(dateCourte(k.date))+(k.remarque ? ' · '+esc(k.remarque) : '')+(k.par ? ' · ajouté par '+esc(k.par) : '')+'</small></div>'+
          '<button class="icone-btn danger" data-act="em-camp-suppr" data-id="'+esc(k.id)+'" data-e="'+esc(e.id)+'" title="Retirer ce camp" aria-label="Retirer ce camp">'+ic('x')+'</button></li>').join('')+'</ul>' :
          '<p class="em-d-sec">Aucune unité n’a encore campé ici. Ajoutez un camp pour mettre une étoile ★ sur cet emplacement.</p>')+'</div>'+
      '<p class="em-d-meta">'+esc([e.sources ? 'Source : '+e.sources : '', e.par && e.par !== 'Listes reçues' ? 'Ajouté par '+e.par+(e.le ? ' le '+dateCourte(e.le) : '') : '', e.modifiePar ? 'Modifié par '+e.modifiePar+(e.modifieLe ? ' le '+dateCourte(e.modifieLe) : '') : ''].filter(Boolean).join(' · '))+
        (e.rouge ? ' · <span class="em-rouge">marqué en rouge dans l’ancienne liste</span>' : '')+'</p>'+
      '<div class="actions"><button class="btn fantome rouge-t" data-act="em-suppr" data-id="'+esc(e.id)+'">'+ic('poubelle')+'Supprimer</button><button class="btn primaire" style="background:'+EM_C+'" data-act="em-modifier" data-id="'+esc(e.id)+'">'+ic('crayon')+'Modifier</button></div>'+
    '</div>'});
  return m;
}

/* ---------- ajout / modification ---------- */
function emCazaConnue(lieu){
  const n = emNrm(lieu); if(!n || !S.empl) return null;
  const c = {}; S.empl.liste.forEach(e => { if(e.caza && emNrm(e.lieu) === n) c[e.caza] = (c[e.caza] || 0)+1; });
  const k = Object.keys(c).sort((a, b) => c[b] - c[a])[0];
  return k || null;
}
function emForm(e){
  const d = S.empl; if(!d || !d.liste) return;
  const modif = !!e; e = e || {type:'', nom:'', lieu:'', caza:'', region:'', district:'', contact:'', tels:[], capacite:'', capMin:null, capMax:null, prix:null, prixPar:'', devise:'$', toilettes:false, remarques:'', description:''};
  const lieux = Array.from(new Set(d.liste.map(x => x.lieu).filter(Boolean))).sort((a, b) => a.localeCompare(b, 'fr'));
  const districts = Array.from(new Set(d.liste.map(x => x.district).filter(Boolean))).sort((a, b) => a.localeCompare(b, 'fr', {numeric:true}));
  const contacts = Array.from(new Set(d.liste.map(x => x.contact).filter(Boolean)));
  const illimite = e.capMax >= 9999, gratuit = e.prix === 0;
  const m = ouvrirModal({titre:modif ? 'Modifier l’emplacement' : 'Nouvel emplacement', icone:'epingle', couleur:EM_C, large:true,
    sous:'La liste est commune à toutes les unités : vos changements sont vus par tout le groupe.',
    corps:'<form class="form" id="f-em" novalidate>'+
      '<div class="rangee"><label class="champ"><span>Nom <span class="req">*</span></span><input type="text" name="nom" maxlength="140" placeholder="ex : Couvent Saint Antoine" value="'+esc(e.nom)+'" autofocus></label>'+
        '<label class="champ"><span>Type</span><select name="type">'+d.types.map(t => '<option'+((e.type || 'Autre') === t ? ' selected' : '')+'>'+esc(t)+'</option>').join('')+'</select></label></div>'+
      '<div class="rangee"><label class="champ"><span>Localité <span class="req">*</span> <span class="aide">— village ou ville</span></span><input type="text" name="lieu" list="dl-em-lieu" maxlength="160" placeholder="ex : Baskinta" value="'+esc(e.lieu)+'"></label>'+
        '<label class="champ"><span>Caza</span><select name="caza"><option value="">— choisir —</option>'+d.regions.map(([r, cs]) => '<optgroup label="'+esc(r)+'">'+cs.map(c => '<option'+(e.caza === c ? ' selected' : '')+'>'+esc(c)+'</option>').join('')+'</optgroup>').join('')+
          (e.caza && !d.regions.some(r => r[1].indexOf(e.caza) >= 0) ? '<option selected>'+esc(e.caza)+'</option>' : '')+'</select></label></div>'+
      '<datalist id="dl-em-lieu">'+lieux.map(x => '<option value="'+esc(x)+'">').join('')+'</datalist>'+
      '<div class="rangee"><label class="champ"><span>Région <span class="aide">— suit le caza</span></span><select name="region"><option value="">—</option>'+d.regions.map(([r]) => '<option'+(e.region === r ? ' selected' : '')+'>'+esc(r)+'</option>').join('')+'</select></label>'+
        '<label class="champ"><span>District scout <span class="aide">(facultatif)</span></span><input type="text" name="district" list="dl-em-dist" maxlength="40" placeholder="ex : Mont-Liban 2" value="'+esc(e.district)+'"></label></div>'+
      '<datalist id="dl-em-dist">'+districts.map(x => '<option value="'+esc(x)+'">').join('')+'</datalist>'+
      '<fieldset class="em-fs"><legend>'+ic('telephone')+'Contact</legend>'+
        '<div class="rangee"><label class="champ"><span>Personne à contacter</span><input type="text" name="contact" list="dl-em-cont" maxlength="160" placeholder="ex : Père Antoine" value="'+esc(e.contact)+'"></label>'+
        '<label class="champ"><span>Téléphones <span class="aide">— numéros libanais, séparés par une virgule</span></span><input type="text" name="tels" inputmode="tel" placeholder="ex : 03 123 456, 71 234 567" value="'+esc(e.tels.map(emTel).join(', '))+'"></label></div>'+
        '<div class="em-tels-ap" id="em-tels-ap"></div></fieldset>'+
      '<datalist id="dl-em-cont">'+contacts.slice(0, 400).map(x => '<option value="'+esc(x)+'">').join('')+'</datalist>'+
      '<fieldset class="em-fs"><legend>'+ic('groupe')+'Capacité</legend>'+
        '<div class="rangee em-r3"><label class="champ"><span>Minimum <span class="aide">(pers.)</span></span><input type="number" name="capMin" min="0" max="9999" inputmode="numeric" placeholder="—" value="'+(e.capMin != null && !illimite ? e.capMin : '')+'"></label>'+
          '<label class="champ"><span>Maximum <span class="aide">(pers.)</span></span><input type="number" name="capMax" min="1" max="9999" inputmode="numeric" placeholder="ex : 40" value="'+(e.capMax != null && !illimite ? e.capMax : '')+'"'+(illimite ? ' disabled' : '')+'></label>'+
          '<label class="interrupteur em-int"><input type="checkbox" name="illimite"'+(illimite ? ' checked' : '')+'><span class="rail"></span><span>Sans limite</span></label></div>'+
        '<label class="champ"><span>Précisions <span class="aide">(facultatif)</span></span><input type="text" name="capacite" maxlength="160" placeholder="ex : 40 dans les salles, plus sous tente" value="'+esc(e.capacite)+'"></label></fieldset>'+
      '<fieldset class="em-fs"><legend>'+ic('bourse')+'Prix</legend>'+
        '<div class="rangee em-r3 em-r-prix"><label class="champ"><span>Montant</span><div class="em-prix"><input type="number" name="prix" min="0" step="any" inputmode="decimal" placeholder="ex : 5" value="'+(e.prix != null && !gratuit ? e.prix : '')+'"'+(gratuit ? ' disabled' : '')+'>'+
            '<select name="devise" aria-label="Devise"'+(gratuit ? ' disabled' : '')+'>'+d.devises.map(x => '<option'+((e.devise || '$') === x ? ' selected' : '')+'>'+esc(x)+'</option>').join('')+'</select></div></label>'+
          '<div class="champ"><span>Par</span><div class="seg em-par" id="em-par">'+d.prixPar.map(p => '<button type="button" data-act="em-par" data-v="'+p+'" class="'+(e.prixPar === p ? 'actif' : '')+'"'+(gratuit ? ' disabled' : '')+'>'+cap(p)+'</button>').join('')+'</div></div>'+
          '<label class="interrupteur em-int"><input type="checkbox" name="gratuit"'+(gratuit ? ' checked' : '')+'><span class="rail"></span><span>Gratuit</span></label></div>'+
        (e.frais ? '<p class="aide em-frais">'+ic('historique')+'Noté dans les listes reçues : '+esc(e.frais)+'</p>' : '')+'</fieldset>'+
      '<label class="interrupteur"><input type="checkbox" name="toilettes"'+(e.toilettes ? ' checked' : '')+'><span class="rail"></span><span>Toilettes sur place</span></label>'+
      '<label class="champ"><span>Description <span class="aide">— le lieu, les salles, le terrain, l’accès…</span></span><textarea name="description" rows="4" maxlength="2000" placeholder="ex : Grand terrain plat sous les pins, 2 salles, cuisine équipée. Accès en bus jusqu’à l’église.">'+esc(e.description)+'</textarea></label>'+
      '<label class="champ"><span>Remarques <span class="aide">(facultatif)</span></span><textarea name="remarques" rows="2" maxlength="2000" placeholder="ex : appeler 2 mois à l’avance">'+esc(e.remarques)+'</textarea></label>'+
      '<div class="em-doublons" id="em-doublons" hidden></div>'+
      '<div class="actions"><button type="button" class="btn fantome" data-act="'+(modif ? 'em-voir' : 'fermer')+'" data-id="'+esc(e.id || '')+'">Annuler</button><button type="submit" class="btn primaire grand" style="background:'+EM_C+'">'+ic('check')+(modif ? 'Enregistrer' : 'Ajouter l’emplacement')+'</button></div></form>'});
  const f = $('#f-em', m);
  f._par = e.prixPar || '';
  const majTels = () => {
    const t = emTels(f.tels.value), z = $('#em-tels-ap', f);
    z.innerHTML = t.ok.map(n => '<span class="tag vert">'+ic('check')+emTel(n)+'</span>').join('')+t.refuses.map(n => '<span class="tag rouge" title="Pas un numéro libanais à 8 chiffres : il ne sera pas enregistré">'+ic('x')+esc(n)+' · retiré</span>').join('');
  };
  majTels();
  f.tels.addEventListener('input', majTels);
  let cazaAuto = !e.caza;
  const majRegion = () => { const r = d.regions.find(x => x[1].indexOf(f.caza.value) >= 0); if(r) f.region.value = r[0]; };
  f.caza.addEventListener('change', () => { cazaAuto = false; majRegion(); });
  f.lieu.addEventListener('change', () => { if(!cazaAuto && f.caza.value) return; const c = emCazaConnue(f.lieu.value); if(c){ f.caza.value = c; majRegion(); } });
  f.illimite.addEventListener('change', () => { f.capMax.disabled = f.illimite.checked; });
  f.gratuit.addEventListener('change', () => { const g = f.gratuit.checked; f.prix.disabled = g; f.devise.disabled = g; $$('#em-par button', f).forEach(b => { b.disabled = g; }); });
  f.addEventListener('input', () => { if(f._force){ f._force = false; $('#em-doublons', f).hidden = true; } });
  f.onsubmit = async ev => {
    ev.preventDefault();
    const x = {id:e.id || '', version:modif ? e.version : null, type:f.type.value, nom:f.nom.value.trim().replace(/\s+/g, ' '), lieu:f.lieu.value.trim().replace(/\s+/g, ' '), caza:f.caza.value, region:f.region.value,
      district:f.district.value.trim(), contact:f.contact.value.trim(), tels:emTels(f.tels.value).ok, capMin:f.capMin.value, capMax:f.illimite.checked ? '' : f.capMax.value, illimite:f.illimite.checked,
      capacite:f.capacite.value.trim(), prix:f.gratuit.checked ? 0 : f.prix.value, gratuit:f.gratuit.checked, prixPar:f._par, devise:f.devise.value, toilettes:f.toilettes.checked,
      description:f.description.value.trim(), remarques:f.remarques.value.trim()};
    if(!x.nom){ f.nom.focus(); return toast('Indiquez le nom de l’emplacement.', 'erreur'); }
    if(!x.lieu){ f.lieu.focus(); return toast('Indiquez la localité (le village ou la ville).', 'erreur'); }
    if(x.capMin !== '' && x.capMax !== '' && Number(x.capMin) > Number(x.capMax)) return toast('Capacité : le minimum dépasse le maximum.', 'erreur');
    if(!x.gratuit && x.prix !== '' && Number(x.prix) > 0 && !x.prixPar) return toast('Choisissez si le prix est par personne, par nuit ou par jour.', 'erreur');
    // doublons : même nom au même endroit, ou un numéro déjà enregistré ailleurs
    if(!f._force){
      const dbl = emDoublons(x);
      if(dbl.length){
        const z = $('#em-doublons', f); z.hidden = false; f._force = true;
        z.innerHTML = '<b>'+ic('alerte')+(dbl.length > 1 ? 'Des emplacements semblables existent déjà :' : 'Un emplacement semblable existe déjà :')+'</b><ul>'+dbl.slice(0, 5).map(o => '<li><b>'+esc(o.e.nom)+'</b> — '+esc(emLieu(o.e) || 'sans localité')+' <span>('+esc(o.pourquoi)+')</span></li>').join('')+'</ul><p>Vérifiez avant d’enregistrer. Appuyez encore sur le bouton pour enregistrer quand même.</p>';
        z.scrollIntoView({block:'nearest', behavior:'smooth'});
        $('button[type=submit]', f).innerHTML = ic('check')+'Enregistrer quand même';
        return;
      }
    }
    await chargement($('button[type=submit]', f), 'Enregistrement…', async () => {
      try {
        const r = await api('emplacementEnregistrer', x);
        emRecevoir(r); rendreEmpl();
        toast((modif ? 'Emplacement modifié' : 'Emplacement ajouté')+' pour toutes les unités.'+(r.retires && r.retires.length ? ' Numéro retiré (pas libanais) : '+r.retires.join(', ')+'.' : ''));
        emVoir(r.enregistre);
      } catch(err){ erreur(err); if(/vient d.être modifié|n.existe plus/.test(msgErr(err))) chargerEmpl(true); }
    });
  };
}
function emDoublons(x){
  const n = emNrm(x.nom), l = emNrm(x.lieu), out = [];
  S.empl.liste.forEach(o => {
    if(o.id === x.id) return;
    const t = o.tels.find(t => x.tels.indexOf(t) >= 0);
    if(n && emNrm(o.nom) === n && (!l || !o.lieu || emNrm(o.lieu) === l)) out.push({e:o, pourquoi:'même nom'+(o.lieu ? ', même localité' : '')});
    else if(t) out.push({e:o, pourquoi:'même numéro '+emTel(t)});
  });
  return out;
}

/* ---------- camps ---------- */
function emCampForm(id){
  const e = emTrouve(id); if(!e) return;
  const d = S.empl, moi = d.moi;
  const m = ouvrirModal({titre:'Camp à « '+esc(e.nom)+' »', icone:'etoile', couleur:emCouleur(moi), sous:'L’emplacement reçoit une étoile ★ et prend la couleur de la dernière unité qui y a campé.',
    corps:'<form class="form" id="f-em-camp" novalidate>'+
      '<label class="champ"><span>Unité <span class="req">*</span></span><select name="unite">'+d.unites.map(u => '<option'+(u.nom === moi ? ' selected' : '')+'>'+esc(u.nom)+'</option>').join('')+'<option value="*">Autre unité…</option></select></label>'+
      '<label class="champ" id="em-autre" hidden><span>Nom de l’unité</span><input type="text" name="autre" maxlength="60" placeholder="ex : Guides Sainte Thérèse"></label>'+
      '<div class="rangee"><label class="champ"><span>Camp <span class="req">*</span></span><input type="text" name="camp" list="dl-em-camp" maxlength="120" placeholder="ex : Camp d’été 2025"></label>'+
        '<label class="champ"><span>Date <span class="req">*</span> <span class="aide">— début du camp</span></span><input type="date" name="date" value="'+aujourdhui()+'"></label></div>'+
      '<datalist id="dl-em-camp">'+EM_CAMPS.map(c => '<option value="'+esc(c)+'">').join('')+'</datalist>'+
      '<label class="champ"><span>Remarque <span class="aide">(facultatif)</span></span><input type="text" name="remarque" maxlength="500" placeholder="ex : très bon accueil, réserver la grande salle"></label>'+
      '<div class="actions"><button type="button" class="btn fantome" data-act="em-voir" data-id="'+esc(e.id)+'">Annuler</button><button type="submit" class="btn primaire grand" style="background:'+EM_C+'">'+ic('etoile')+'Ajouter le camp</button></div></form>'});
  const f = $('#f-em-camp', m);
  f.unite.addEventListener('change', () => { $('#em-autre', f).hidden = f.unite.value !== '*'; if(f.unite.value === '*') f.autre.focus(); });
  f.onsubmit = async ev => {
    ev.preventDefault();
    const unite = f.unite.value === '*' ? f.autre.value.trim() : f.unite.value;
    if(!unite){ f.autre.focus(); return toast('Indiquez le nom de l’unité.', 'erreur'); }
    if(!f.camp.value.trim()){ f.camp.focus(); return toast('Indiquez le camp.', 'erreur'); }
    if(!f.date.value) return toast('Indiquez la date du camp.', 'erreur');
    await chargement($('button[type=submit]', f), 'Enregistrement…', async () => {
      try { emRecevoir(await api('emplacementCampAjouter', {emplacement:e.id, unite, camp:f.camp.value.trim(), date:f.date.value, remarque:f.remarque.value.trim()})); rendreEmpl(); toast('Camp ajouté : ★ '+unite+'.'); emVoir(e.id); }
      catch(err){ erreur(err); }
    });
  };
}

Object.assign(ACTIONS, {
  'em-actualiser': () => chargerEmpl(true),
  'em-ajouter': () => emForm(null),
  'em-voir': el => { if(el.dataset.id) emVoir(el.dataset.id); else fermerModal(); },
  'em-tel': el => { window.location.href = el.getAttribute('href'); },
  'em-modifier': el => { const e = emTrouve(el.dataset.id); if(e) emForm(e); },
  'em-camp': el => emCampForm(el.dataset.id),
  'em-par': el => { const f = el.closest('form'); const v = f._par === el.dataset.v ? '' : el.dataset.v; f._par = v; $$('#em-par button', f).forEach(b => b.classList.toggle('actif', b.dataset.v === v)); },
  'em-filtres': el => { const o = el.closest('.em-tete-carte'); o.classList.toggle('ouvert'); el.setAttribute('aria-expanded', o.classList.contains('ouvert')); },
  'em-plus': () => { S.emN += EM_PAS; rendreEmpl(); },
  'em-effacer': () => { S.emF = {q:'', lieu:'', type:'', membres:'', campe:'', tri:S.emF.tri}; S.emN = EM_PAS; $$('[data-emf]').forEach(i => { i.value = S.emF[i.dataset.emf]; }); rendreEmpl(); },
  'em-suppr': async el => {
    const e = emTrouve(el.dataset.id); if(!e) return;
    if(!await confirmer('Supprimer cet emplacement ?', '« '+esc(e.nom)+' » sera retiré de la liste <b>pour toutes les unités</b>'+(e.camps.length ? ', avec '+pluriel(e.camps.length, 'camp enregistré', 'camps enregistrés') : '')+'. Une copie reste dans l’onglet « Supprimés » du Google Sheet.', 'Supprimer')) return emVoir(e.id);
    try { emRecevoir(await api('emplacementSupprimer', e.id)); rendreEmpl(); toast('Emplacement supprimé.'); }
    catch(err){ erreur(err); chargerEmpl(true); }
  },
  'em-camp-suppr': async el => {
    const eid = el.dataset.e, e = emTrouve(eid), k = e && e.camps.find(c => c.id === el.dataset.id); if(!k) return;
    if(!await confirmer('Retirer ce camp ?', esc(k.unite)+' · '+esc(k.camp)+' ('+esc(dateCourte(k.date))+')', 'Retirer')) return emVoir(eid);
    try { emRecevoir(await api('emplacementCampSupprimer', k.id)); rendreEmpl(); toast('Camp retiré.'); emVoir(eid); }
    catch(err){ erreur(err); }
  }
});
document.addEventListener('input', ev => {
  const k = ev.target.dataset && ev.target.dataset.emf; if(!k) return;
  S.emF[k] = ev.target.value; S.emN = EM_PAS;
  clearTimeout(S.emT); S.emT = setTimeout(rendreEmpl, k === 'q' || k === 'membres' ? 120 : 0);
});
document.addEventListener('keydown', ev => {
  if((ev.key === 'Enter' || ev.key === ' ') && ev.target.classList && ev.target.classList.contains('em-carte')){ ev.preventDefault(); emVoir(ev.target.dataset.id); }
});

/* =================================================================
 *  DÉMARRAGE
 * ================================================================= */
(function init(){
  $$('.logo-img').forEach(i => i.src = LOGO);
  $$('.app-icone').forEach(i => i.src = ICONE);
  $$('[data-reglage]').forEach(el => el.textContent = REGLAGES[el.dataset.reglage] || '');
  $('#pins-side').innerHTML = pins(268, 120, 9, 3);
  fondTopo();
  if(REGLAGES.maitrise) return demarrerMaitrise();
  construireNav();
  aller('accueil');
})();
</script>
