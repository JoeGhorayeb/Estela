<!DOCTYPE html>
<html lang="fr">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title><?= reglages.app ?></title>
<link rel="icon" type="image/png" href="<?!= include('Icone') ?>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,500;0,700;0,800;1,600&family=Nunito+Sans:opsz,wght@6..12,400;6..12,600;6..12,700;6..12,800&display=swap" rel="stylesheet">
<style>
/* La couleur principale et le nom se règlent dans Code.gs (bloc « RÉGLAGES » tout en haut). */
:root{
  --principale:<?= reglages.couleur ?>; --accent:<?= reglages.accent ?>;
  --foret:var(--principale); --foret-2:color-mix(in srgb,var(--principale) 72%,black); --foret-clair:color-mix(in srgb,var(--principale) 82%,white); --vert:#2E7D4F; --vert-f:#1E7B45; --vert-clair:#E5F2E9;
  --rouge:#C8161D; --rouge-clair:#FDE9E8;
  --jaune:#F4C20D; --or:#D99A00; --jaune-clair:#FFF5D1;
  --bois:#7A5230; --bois-clair:#F3EBDD; --kraft:#D9C3A0; --braise:#D2601A; --braise-clair:#FCEBDD;
  --papier:#FBF7EE; --blanc:#FFFFFF; --encre:#2B2118; --encre-2:#6B5B4B; --encre-3:#9A8A76;
  --ligne:#EADFCB; --champ:#E2D5BD;
  --ombre:0 1px 2px rgba(60,40,20,.05),0 6px 22px rgba(60,40,20,.07);
  --ombre-2:0 2px 4px rgba(60,40,20,.06),0 16px 40px rgba(60,40,20,.14);
  --r:18px;
  --titre:'Bitter',Georgia,serif;
  --texte:'Nunito Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:var(--texte);color:var(--encre);background-color:var(--papier);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;background-attachment:fixed}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--vert);text-decoration:none}
[hidden]{display:none!important}
.ic{width:20px;height:20px;flex:none;display:inline-block;vertical-align:middle}
h1,h2,h3{font-family:var(--titre);margin:0;letter-spacing:-.01em}
.num,.tab{font-variant-numeric:tabular-nums}

/* ---------- Structure ---------- */
.app{display:grid;grid-template-columns:268px minmax(0,1fr);min-height:100vh}
.app>div{min-width:0}
.sidebar{position:sticky;top:0;height:100vh;background:linear-gradient(175deg,var(--foret-clair) 0%,var(--foret) 45%,var(--foret-2) 100%);color:#F4EEDF;display:flex;flex-direction:column;padding:22px 16px 18px;overflow:hidden;z-index:5}
.sidebar::before{content:"";position:absolute;inset:0;background:radial-gradient(120% 60% at 0% 0%,color-mix(in srgb,var(--accent) 10%,transparent),transparent 60%);pointer-events:none}
.app-marque{display:flex;align-items:center;gap:12px;padding:2px 8px 18px;position:relative}
.app-icone{width:46px;height:46px;border-radius:13px;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.18),0 6px 14px rgba(0,0,0,.25)}
.app-marque b{display:block;font-family:var(--titre);font-weight:800;font-size:27px;line-height:1;color:#fff;letter-spacing:-.01em}
.app-marque span{font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:800}
.brand{display:flex;align-items:center;gap:12px;padding:10px 12px;margin:0 2px 8px;position:relative;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:16px}
.brand .logo-rond{width:44px;height:44px}
.brand .logo-rond::after{inset:-5px}
.brand .logo-rond img{width:36px;height:36px}
.logo-rond{width:62px;height:62px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none;box-shadow:0 0 0 3px rgba(255,255,255,.12),0 6px 16px rgba(0,0,0,.25);position:relative}
.logo-rond::after{content:"";position:absolute;inset:-7px;border-radius:50%;border:2px dashed color-mix(in srgb,var(--accent) 55%,transparent)}
.logo-rond img{width:50px;height:50px;object-fit:contain}
.brand-txt{min-width:0}
.brand-txt b{display:block;font-family:var(--titre);font-weight:800;font-size:16px;line-height:1.15;color:#fff}
.brand-txt span{display:block;font-size:12px;color:rgba(244,238,223,.7);font-weight:700;margin-top:2px}
.nav{display:flex;flex-direction:column;gap:4px;margin-top:10px;position:relative}
.nav-titre{font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:rgba(244,238,223,.5);font-weight:800;padding:10px 12px 6px}
.nav-btn{display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:13px;border:0;background:transparent;color:rgba(244,238,223,.82);cursor:pointer;text-align:left;font-weight:700;font-size:14.5px;transition:background .15s,color .15s}
.nav-btn .nav-ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:rgba(255,255,255,.07);color:color-mix(in srgb,var(--c) 45%,white);transition:.15s}
.nav-btn .nav-ic .ic{width:19px;height:19px}
.nav-btn:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-btn.actif{background:rgba(255,255,255,.13);color:#fff;box-shadow:inset 3px 0 0 var(--accent)}
.nav-btn.actif .nav-ic{background:var(--c);color:#fff}
.side-pied{margin-top:auto;position:relative;padding:14px 10px 0}
.devise{font-family:var(--titre);font-style:italic;font-weight:600;color:var(--accent);font-size:17px}
.side-pied small{display:block;color:rgba(244,238,223,.55);font-size:12px;margin-top:4px;word-break:break-all}
.side-pied a{color:#F4EEDF;font-size:13px;font-weight:700;display:inline-flex;gap:6px;align-items:center;margin-top:10px;opacity:.85}
.side-pied a:hover{opacity:1}
.pins{position:absolute;left:0;right:0;bottom:0;height:120px;opacity:.16;pointer-events:none}
.pins svg{width:100%;height:100%;display:block}

main{padding:28px 36px 70px;min-width:0}
.contenu{max-width:1220px;margin:0 auto}
.topbar,.bottomnav{display:none}

/* ---------- Composants ---------- */
.hero{--c:var(--foret);display:flex;align-items:center;gap:18px;background:linear-gradient(120deg,#fff 0%,#fff 55%,var(--bois-clair) 100%);border:1px solid var(--ligne);border-radius:22px;padding:20px 24px;box-shadow:var(--ombre);position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;background:var(--c);opacity:.06}
.hero-txt{flex:1;min-width:0}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:var(--c)}
.hero h1{font-size:30px;font-weight:800;line-height:1.15;margin-top:2px}
.hero p{margin:4px 0 0;color:var(--encre-2);max-width:620px}
.hero-actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end;position:relative;z-index:1}
.patch{--c2:color-mix(in srgb,var(--c) 22%,white);width:66px;height:66px;border-radius:50%;background:var(--c);color:#fff;display:grid;place-items:center;flex:none;position:relative;box-shadow:0 0 0 5px var(--c2),0 8px 18px color-mix(in srgb,var(--c) 35%,transparent)}
.patch::after{content:"";position:absolute;inset:5px;border-radius:50%;border:2px dashed rgba(255,255,255,.6)}
.patch .ic{width:30px;height:30px;stroke-width:1.9}
.patch.petit{width:46px;height:46px;box-shadow:0 0 0 4px var(--c2)}
.patch.petit::after{inset:4px;border-width:1.5px}
.patch.petit .ic{width:21px;height:21px}
.corde{height:7px;margin:16px 10px 22px;border-radius:4px;transform:skewX(-28deg);background:repeating-linear-gradient(90deg,var(--rouge) 0 18px,transparent 18px 23px,var(--vert) 23px 41px,transparent 41px 46px,var(--jaune) 46px 64px,transparent 64px 69px,var(--bois) 69px 87px,transparent 87px 92px);opacity:.85}
.carte{background:#fff;border:1px solid var(--ligne);border-radius:var(--r);padding:20px;box-shadow:var(--ombre)}
.carte-titre{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.carte-titre h2{font-size:19px;font-weight:800;display:flex;align-items:center;gap:10px}
.carte-titre h2 .ic{color:var(--c,var(--vert))}
.grille-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
.grille-sec{display:grid;grid-template-columns:minmax(0,1.65fr) minmax(0,1fr);gap:18px;align-items:start}
.pile{display:flex;flex-direction:column;gap:18px}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 16px;border-radius:12px;border:1px solid transparent;font-weight:800;font-size:14.5px;cursor:pointer;transition:transform .12s,box-shadow .15s,background .15s;white-space:nowrap;text-decoration:none;line-height:1.2}
.btn .ic{width:18px;height:18px;stroke-width:2.2}
.btn:hover{transform:translateY(-1px);box-shadow:0 6px 14px rgba(40,30,15,.15)}
.btn:active{transform:none}
.btn:disabled{opacity:.6;cursor:progress;transform:none;box-shadow:none}
.btn.primaire{background:var(--foret);color:#fff}
.btn.vert{background:var(--vert);color:#fff}
.btn.rouge{background:var(--rouge);color:#fff}
.btn.jaune{background:var(--jaune);color:var(--encre)}
.btn.accent{background:var(--accent);color:var(--encre)}
.btn.bois{background:var(--bois);color:#fff}
.btn.fantome{background:#fff;color:var(--encre);border-color:var(--champ)}
.btn.fantome:hover{border-color:var(--kraft)}
.btn.lien{background:transparent;color:var(--vert);padding:8px 10px}
.btn.lien:hover{box-shadow:none;background:var(--vert-clair)}
.btn.grand{padding:13px 20px;font-size:15.5px;border-radius:14px}
.icone-btn{width:34px;height:34px;border-radius:10px;border:1px solid transparent;background:transparent;display:inline-grid;place-items:center;cursor:pointer;color:var(--encre-2);transition:.15s}
.icone-btn:hover{background:var(--bois-clair);color:var(--encre)}
.icone-btn.danger:hover{background:var(--rouge-clair);color:var(--rouge)}
.icone-btn .ic{width:18px;height:18px}
:focus-visible{outline:3px solid color-mix(in srgb,var(--jaune) 80%,white);outline-offset:2px}

.champ{display:flex;flex-direction:column;gap:6px;font-weight:800;font-size:13px;color:var(--encre-2);min-width:0}
.champ .aide{font-weight:600;color:var(--encre-3);font-size:12.5px}
.req{color:var(--rouge)}
input[type=text],input[type=password],input[type=number],input[type=date],input[type=search],input:not([type]),select,textarea{width:100%;padding:11px 12px;border:1.5px solid var(--champ);border-radius:12px;background:#FFFDF8;font-size:15px;font-weight:600;color:var(--encre);transition:border-color .15s,box-shadow .15s;min-width:0}
textarea{resize:vertical;line-height:1.5}
input::placeholder,textarea::placeholder{color:#B3A48E;font-weight:500}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--vert);box-shadow:0 0 0 3.5px rgba(46,125,79,.15);background:#fff}
input[readonly]{background:var(--bois-clair);color:var(--encre-2)}
.form{display:flex;flex-direction:column;gap:16px}
.rangee{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.rangee.r3{grid-template-columns:repeat(3,minmax(0,1fr))}
.actions{display:flex;justify-content:flex-end;gap:10px;flex-wrap:wrap;padding-top:6px}

.seg{display:inline-flex;background:#F1E8D6;border-radius:13px;padding:4px;gap:2px}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:10px;font-weight:800;font-size:13.5px;color:var(--encre-2);cursor:pointer}
.seg button.actif{background:#fff;color:var(--encre);box-shadow:0 1px 3px rgba(60,40,20,.15)}
.seg.nature button.actif[data-v="Entrée"]{background:var(--vert);color:#fff}
.seg.nature button.actif[data-v="Dépense"]{background:var(--rouge);color:#fff}
.seg.nature{width:100%}
.seg.nature button{flex:1;padding:10px;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:8px}

.choix{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.opt{cursor:pointer}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt-box{border:1.5px solid var(--champ);border-radius:14px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:6px;font-weight:800;color:var(--encre-2);background:#FFFDF8;transition:.15s;font-size:14px}
.opt-box .ic{width:24px;height:24px;color:var(--encre-3)}
.opt:hover .opt-box{border-color:var(--kraft)}
.opt input:checked+.opt-box{border-color:var(--c,var(--vert));background:color-mix(in srgb,var(--c,var(--vert)) 10%,white);color:var(--encre);box-shadow:0 0 0 3px color-mix(in srgb,var(--c,var(--vert)) 15%,transparent)}
.opt input:checked+.opt-box .ic{color:var(--c,var(--vert))}
.opt input:focus-visible+.opt-box{outline:3px solid var(--jaune)}

.puces{display:flex;flex-wrap:wrap;gap:6px}
.puce{border:1px solid var(--champ);background:#fff;border-radius:999px;padding:5px 12px;font-size:13px;font-weight:700;color:var(--encre-2);cursor:pointer;transition:.12s;display:inline-flex;align-items:center;gap:6px}
.puce:hover{border-color:var(--kraft);color:var(--encre)}
.puce.actif,.puce.actif:hover{background:var(--foret);border-color:var(--foret);color:#fff}
.puce .compte{background:rgba(0,0,0,.08);border-radius:999px;padding:0 7px;font-size:11.5px}
.puce.actif .compte{background:rgba(255,255,255,.2)}

.tag{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border-radius:999px;font-size:12.5px;font-weight:800;white-space:nowrap;background:var(--bois-clair);color:var(--bois)}
.tag .ic{width:14px;height:14px}
.tag.vert{background:var(--vert-clair);color:var(--vert-f)}
.tag.rouge{background:var(--rouge-clair);color:var(--rouge)}
.tag.jaune{background:var(--jaune-clair);color:#8A6200}
.tag.braise{background:var(--braise-clair);color:#A2470F}
.tag.foret{background:color-mix(in srgb,var(--foret) 12%,white);color:var(--foret)}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.kpi{background:#fff;border:1px solid var(--ligne);border-radius:16px;padding:16px 18px;box-shadow:var(--ombre);position:relative;overflow:hidden}
.kpi .lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:var(--encre-3);display:flex;align-items:center;gap:6px}
.kpi .lbl .ic{width:16px;height:16px}
.kpi .val{font-family:var(--titre);font-weight:800;font-size:25px;margin-top:6px;font-variant-numeric:tabular-nums;line-height:1.15;word-break:break-word}
.kpi .det{font-size:12.5px;color:var(--encre-3);font-weight:700;margin-top:2px}
.kpi.vedette{background:linear-gradient(135deg,var(--foret),var(--foret-clair));color:#fff;border:0}
.kpi.vedette .lbl,.kpi.vedette .det{color:rgba(255,255,255,.72)}
.kpi.vedette.neg{background:linear-gradient(135deg,#9E1016,var(--rouge))}
.plus-c{color:var(--vert-f)}.moins-c{color:var(--rouge)}

.barres{display:flex;flex-direction:column;gap:14px}
.barre-l{display:grid;grid-template-columns:120px minmax(0,1fr);gap:12px;align-items:center}
.barre-l .nom{font-weight:800;font-size:14px;display:flex;align-items:center;gap:8px;min-width:0}
.barre-l .nom span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.barre-l .nom .ic{width:17px;height:17px;color:var(--encre-3)}
.pistes{display:flex;flex-direction:column;gap:5px}
.piste{display:flex;align-items:center;gap:10px}
.piste .fond{flex:1;height:10px;background:#F3ECDF;border-radius:6px;overflow:hidden}
.piste .rempli{height:100%;border-radius:6px;transition:width .5s cubic-bezier(.2,.8,.2,1)}
.piste .rempli.e{background:linear-gradient(90deg,#3E9A63,var(--vert))}
.piste .rempli.d{background:linear-gradient(90deg,#E0474D,var(--rouge))}
.piste .rempli.b{background:linear-gradient(90deg,#E8883F,var(--braise))}
.piste .v{font-size:12.5px;font-weight:800;min-width:92px;text-align:right;font-variant-numeric:tabular-nums;color:var(--encre-2)}

.barre-outils{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.recherche{position:relative;flex:1;min-width:200px}
.recherche .ic{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--encre-3);width:18px;height:18px}
.recherche input{padding-left:38px}
.barre-outils select{width:auto;min-width:140px}

.tableau{overflow-x:auto;margin:0 -20px -20px;border-top:1px solid var(--ligne)}
table{width:100%;border-collapse:separate;border-spacing:0}
th{text-align:left;font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--encre-3);background:#FAF5EA;padding:10px 14px;font-weight:800;white-space:nowrap}
td{padding:12px 14px;border-top:1px solid #F2E9D8;vertical-align:middle}
tr:first-child td{border-top:0}
tbody tr{transition:background .12s}
tbody tr:hover td{background:#FFFBF1}
td.num,th.num{text-align:right;white-space:nowrap}
.cellule-t{font-weight:800}
.sous{font-size:12.5px;color:var(--encre-3);font-weight:600}
.nowrap{white-space:nowrap}
.montant{font-weight:800;font-variant-numeric:tabular-nums}
.vide{text-align:center;padding:36px 16px;color:var(--encre-3)}
.vide .ic{width:40px;height:40px;color:var(--kraft);margin-bottom:6px}
.vide b{display:block;color:var(--encre-2);font-size:16px;font-family:var(--titre)}

.var{display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;font-weight:800;font-size:13px;font-variant-numeric:tabular-nums}
.var.plus{background:var(--vert-clair);color:var(--vert-f)}
.var.moins{background:var(--rouge-clair);color:var(--rouge)}
.var.neutre{background:#F1EBDF;color:var(--encre-3)}

.qte{vertical-align:middle;display:inline-flex;align-items:center;gap:4px;background:#FAF5EA;border-radius:12px;padding:3px}
.qte b{min-width:44px;text-align:center;font-family:var(--titre);font-size:17px;font-variant-numeric:tabular-nums}
.qte .icone-btn{width:30px;height:30px;background:#fff;border:1px solid var(--ligne)}
.qte .icone-btn.m:hover{background:var(--rouge-clair);color:var(--rouge);border-color:#F5C2C0}
.qte .icone-btn.p:hover{background:var(--vert-clair);color:var(--vert-f);border-color:#BFE0CB}
.qte-zero b{color:var(--rouge)}
tr.alerte td:first-child{box-shadow:inset 3px 0 0 var(--rouge)}
tr.attention td:first-child{box-shadow:inset 3px 0 0 var(--jaune)}

/* ---------- Accueil ---------- */
.accueil-hero{position:relative;overflow:hidden;border-radius:26px;padding:34px 36px 44px;color:#fff;background:linear-gradient(130deg,var(--foret-clair) 0%,var(--foret) 50%,var(--foret-2) 100%);box-shadow:var(--ombre-2);display:flex;align-items:center;gap:26px}
.accueil-hero::before{content:"";position:absolute;inset:0;background:radial-gradient(60% 90% at 90% 10%,color-mix(in srgb,var(--accent) 18%,transparent),transparent 60%),radial-gradient(50% 70% at 0% 100%,rgba(200,22,29,.18),transparent 60%)}
.accueil-hero .pins{height:90px;opacity:.22}
.accueil-hero .txt{position:relative;flex:1;min-width:0}
.accueil-hero .eyebrow{color:var(--accent)}
.accueil-hero h1{font-size:38px;font-weight:800;margin-top:4px;line-height:1.1}
.accueil-hero p{margin:8px 0 0;color:rgba(255,255,255,.8);font-size:16px}
.accueil-hero .chips{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
.chip-h{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);padding:6px 12px;border-radius:999px;font-weight:700;font-size:13px}
.chip-h .ic{width:16px;height:16px}
.chip-h.j{background:var(--accent);color:var(--encre);border-color:transparent}
.grand-logo{position:relative;width:150px;height:150px;border-radius:50%;background:#fff;display:grid;place-items:center;flex:none;box-shadow:0 0 0 8px rgba(255,255,255,.1),0 14px 34px rgba(0,0,0,.3)}
.grand-logo::after{content:"";position:absolute;inset:-16px;border-radius:50%;border:2px dashed color-mix(in srgb,var(--accent) 50%,transparent);animation:tourne 60s linear infinite}
.grand-logo img{width:122px;height:122px;object-fit:contain}
@keyframes tourne{to{transform:rotate(360deg)}}
.cartes-sec{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px}
.cartes-sec .carte-sec{grid-column:span 2}
.cartes-sec .carte-sec:nth-child(n+4){grid-column:span 3}
.carte-sec{--c:var(--vert);text-align:left;cursor:pointer;background:#fff;border:1px solid var(--ligne);border-radius:20px;padding:22px 20px 18px;box-shadow:var(--ombre);display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden;transition:transform .18s,box-shadow .18s,border-color .18s;font:inherit;color:inherit}
.carte-sec::before{content:"";position:absolute;left:0;right:0;top:0;height:5px;background:var(--c)}
.carte-sec:hover{transform:translateY(-3px);box-shadow:var(--ombre-2);border-color:color-mix(in srgb,var(--c) 40%,white)}
.carte-sec h3{font-size:20px;font-weight:800}
.carte-sec p{margin:0;color:var(--encre-2);font-size:14px}
.carte-sec .stat{margin-top:auto;padding-top:12px;border-top:1px dashed var(--ligne);font-weight:800;font-size:13.5px;color:var(--encre-2);display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:36px}
.carte-sec .stat .ic{color:var(--c);transition:transform .18s}
.carte-sec:hover .stat .ic{transform:translateX(4px)}
.citation{display:flex;gap:16px;align-items:center;background:var(--jaune-clair);border:1px solid #F3DF9B;border-radius:18px;padding:18px 22px}
.citation .ic{width:34px;height:34px;color:var(--or)}
.citation q{font-family:var(--titre);font-style:italic;font-weight:600;font-size:17px;quotes:"« " " »"}
.citation small{display:block;color:var(--encre-2);font-weight:700;margin-top:2px}
.bandeau-err{background:var(--rouge-clair);border:1px solid #F3C4C2;color:#8E1016;border-radius:14px;padding:12px 16px;font-weight:700;font-size:14px;display:flex;gap:10px;align-items:flex-start}

/* ---------- Secrétaire ---------- */
.interrupteur{display:flex;align-items:center;gap:12px;cursor:pointer;padding:12px 14px;border:1.5px solid var(--champ);border-radius:14px;background:#FFFDF8;font-weight:800}
.interrupteur input{position:absolute;opacity:0}
.interrupteur .rail{width:44px;height:26px;border-radius:999px;background:#DCCFB7;position:relative;transition:.2s;flex:none}
.interrupteur .rail::after{content:"";position:absolute;left:3px;top:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.2s}
.interrupteur input:checked+.rail{background:var(--vert)}
.interrupteur input:checked+.rail::after{left:21px}
.interrupteur input:focus-visible+.rail{outline:3px solid var(--jaune)}
.interrupteur small{display:block;font-weight:600;color:var(--encre-3);font-size:12.5px}
.lignes-dyn{display:flex;flex-direction:column;gap:8px}
.ligne-dyn{display:grid;grid-template-columns:minmax(0,1fr) 110px 34px;gap:8px;align-items:center}
.succes{background:linear-gradient(135deg,var(--vert-clair),#fff);border:1.5px solid #BFE0CB;border-radius:16px;padding:16px 18px;display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.succes .patch{--c:var(--vert)}
.succes .t{flex:1;min-width:200px}
.succes b{font-family:var(--titre);font-size:17px;display:block}
.liste-fiches{display:flex;flex-direction:column}
.fiche-l{display:flex;align-items:center;gap:12px;padding:10px 4px;border-top:1px solid #F2E9D8;color:var(--encre)}
.fiche-l:first-child{border-top:0}
.fiche-l:hover{background:#FFFBF1}
.fiche-l .doc-ic{width:36px;height:36px;border-radius:10px;background:#E8F0FE;color:#2A62C9;display:grid;place-items:center;flex:none}
.fiche-l .t{flex:1;min-width:0}
.pile,.pile>.carte,.grille-2>*,.liste-fiches{min-width:0}
.fiche-l .t b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.note{background:var(--bois-clair);border-radius:14px;padding:14px 16px;font-size:13.5px;color:var(--encre-2)}
.note code{background:#fff;padding:1px 6px;border-radius:6px;font-size:12.5px;color:var(--bois);font-weight:700}

/* ---------- Cuisinier ---------- */
.cartes-rec{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:16px}
.carte-rec{--c:var(--braise);background:#fff;border:1px solid var(--ligne);border-radius:18px;box-shadow:var(--ombre);cursor:pointer;text-align:left;padding:0;overflow:hidden;display:flex;flex-direction:column;transition:transform .18s,box-shadow .18s;font:inherit;color:inherit}
.carte-rec:hover{transform:translateY(-3px);box-shadow:var(--ombre-2)}
.carte-rec .bande{height:84px;background:linear-gradient(135deg,color-mix(in srgb,var(--c) 85%,white),var(--c));position:relative;display:flex;align-items:flex-end;padding:0 16px 12px;color:#fff}
.carte-rec .bande .ic{position:absolute;right:14px;top:12px;width:46px;height:46px;opacity:.35;stroke-width:1.5}
.carte-rec .bande .tag{background:rgba(255,255,255,.92);color:var(--encre)}
.carte-rec .corps{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
.carte-rec h3{font-size:18px;font-weight:800;line-height:1.25}
.meta{display:flex;flex-wrap:wrap;gap:10px 14px;color:var(--encre-2);font-weight:700;font-size:13px}
.meta span{display:inline-flex;align-items:center;gap:5px}
.meta .ic{width:16px;height:16px;color:var(--encre-3)}
.portion{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--braise-clair);border-radius:14px;padding:12px 14px;font-weight:800}
.portion input{width:80px;text-align:center;font-family:var(--titre);font-size:18px;font-weight:800;padding:7px}
.portion small{color:var(--encre-2);font-weight:600}
.rec-cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:22px;margin-top:18px}
.rec-cols h3{font-size:16px;font-weight:800;margin-bottom:10px;display:flex;align-items:center;gap:8px}
.rec-cols h3 .ic{color:var(--braise)}
.ingr{list-style:none;margin:0;padding:0}
.ingr li{display:flex;gap:10px;padding:8px 0;border-bottom:1px dashed var(--ligne);align-items:baseline}
.ingr li b{min-width:74px;font-variant-numeric:tabular-nums;color:var(--braise)}
.etapes{list-style:none;margin:0;padding:0;counter-reset:e}
.etapes li{counter-increment:e;display:flex;gap:12px;padding:6px 0 10px}
.etapes li::before{content:counter(e);width:28px;height:28px;border-radius:50%;background:var(--foret);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none;font-family:var(--titre)}
.astuce{margin-top:10px;background:var(--jaune-clair);border-left:4px solid var(--jaune);border-radius:10px;padding:12px 14px;font-size:14px}
.ingr-ligne{display:grid;grid-template-columns:90px 130px minmax(0,1fr) 34px;gap:8px;align-items:center}

/* ---------- Inventaires ---------- */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));gap:12px}
.stat-b{background:#fff;border:1px solid var(--ligne);border-radius:14px;padding:12px 14px;min-width:0;box-shadow:var(--ombre);display:flex;align-items:center;gap:12px}
.stat-b .n{font-family:var(--titre);font-weight:800;font-size:24px;line-height:1}
.stat-b .l{font-size:12px;font-weight:800;color:var(--encre-3);text-transform:uppercase;letter-spacing:.06em}
.stat-b .ic{width:22px;height:22px;color:var(--encre-3)}
.stat-b.rouge{border-color:#F3C4C2;background:var(--rouge-clair)}
.stat-b.rouge .n,.stat-b.rouge .ic{color:var(--rouge)}
.stat-b.jaune{border-color:#F3DF9B;background:var(--jaune-clair)}
.stat-b.jaune .n,.stat-b.jaune .ic{color:#9B6D00}
.lot-aide{background:var(--bois-clair);border-radius:14px;padding:12px 16px;font-size:14px;color:var(--encre-2)}
.lot-tete,.lot-ligne{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1.2fr) 96px 100px var(--col-exp,0px) 150px 34px;gap:8px;align-items:center}
.lot-tete{font-size:11.5px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--encre-3);padding:0 2px}
.lot-ligne{padding:8px;border-radius:14px;background:#fff;border:1px solid var(--ligne);transition:background .15s,border-color .15s}
.lot-ligne.moins{background:#FFF6F5;border-color:#F3C4C2}
.lot-ligne.plus{background:#F6FBF8;border-color:#CBE6D5}
.lot-ligne input,.lot-ligne select{padding:9px 10px;font-size:14px}
.lot-ligne .l-rem{grid-column:1/-1}
.diff{font-size:12.5px;font-weight:800;border-radius:10px;padding:6px 8px;text-align:center;line-height:1.25}
.diff.nouveau{background:var(--jaune-clair);color:#8A6200}
.diff.plus{background:var(--vert-clair);color:var(--vert-f)}
.diff.moins{background:var(--rouge-clair);color:var(--rouge)}
.diff.egal{background:#F1EBDF;color:var(--encre-3)}
.lot-resume{display:flex;gap:8px;flex-wrap:wrap;align-items:center;flex:1}
.pied-modal{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border-top:1px solid var(--ligne);padding-top:16px;margin-top:4px}
.rapport{display:flex;flex-direction:column;gap:6px}
.rap-l{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:#fff;border:1px solid var(--ligne)}
.rap-l .ic{width:20px;height:20px}
.rap-l.moins{background:var(--rouge-clair);border-color:#F3C4C2;color:var(--rouge)}
.rap-l.moins b,.rap-l.moins .sous{color:var(--rouge)}
.rap-l.plus .ic{color:var(--vert-f)}
.rap-l.nouveau .ic{color:var(--or)}
.rap-l.egal{opacity:.75}
.rap-l .fl{font-weight:800;font-variant-numeric:tabular-nums;white-space:nowrap}
details.hist summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px}
details.hist summary::-webkit-details-marker{display:none}
details.hist summary h2{font-size:18px;font-weight:800;display:flex;align-items:center;gap:10px}
details.hist summary .chev{transition:transform .2s}
details.hist[open] summary .chev{transform:rotate(180deg)}
details.hist .tableau{margin-top:16px}
.exp{display:inline-flex;align-items:center;gap:5px;font-weight:700;font-size:13.5px;white-space:nowrap}

/* ---------- Modale, toasts, chargement ---------- */
#modal-root{position:fixed;inset:0;z-index:60;display:none;place-items:center;padding:16px}
#modal-root.ouvert{display:grid}
.voile{position:absolute;inset:0;background:rgba(32,24,14,.5);backdrop-filter:blur(3px);animation:fondu .2s}
.modal{--c:var(--foret);position:relative;width:min(580px,100%);max-height:calc(100vh - 32px);overflow:auto;background:var(--papier);border-radius:24px;box-shadow:0 30px 80px rgba(20,12,4,.4);animation:monte .25s cubic-bezier(.2,.8,.2,1)}
.modal.large{width:min(960px,100%)}
.modal-tete{position:sticky;top:0;z-index:2;display:flex;align-items:center;gap:14px;padding:18px 22px;background:rgba(251,247,238,.96);backdrop-filter:blur(6px);border-bottom:1px solid var(--ligne)}
.modal-tete>div:nth-child(2){flex:1;min-width:0}
.modal-tete h2{font-size:21px;font-weight:800}
.modal-tete p{margin:2px 0 0;color:var(--encre-2);font-size:13.5px}
.modal-corps{padding:20px 22px 22px}
@keyframes fondu{from{opacity:0}}
@keyframes monte{from{opacity:0;transform:translateY(16px) scale(.98)}}
body.modal-ouvert{overflow:hidden}
#toasts{position:fixed;right:20px;bottom:20px;z-index:80;display:flex;flex-direction:column;gap:10px;max-width:min(420px,calc(100vw - 40px))}
.toast{display:flex;gap:10px;align-items:flex-start;background:var(--encre);color:#fff;border-radius:14px;padding:12px 16px;box-shadow:var(--ombre-2);font-weight:700;font-size:14px;animation:monte .25s;border-left:5px solid var(--jaune)}
.toast.ok{border-left-color:#4CC27E}
.toast.erreur{border-left-color:#FF5A5F;background:#3A1414}
.toast .ic{width:19px;height:19px;flex:none;margin-top:1px}
.spin{width:16px;height:16px;border-radius:50%;border:2.5px solid currentColor;border-right-color:transparent;animation:tourne .7s linear infinite;display:inline-block;flex:none}
.chargeur{display:flex;flex-direction:column;align-items:center;gap:14px;padding:50px 0;color:var(--encre-3);font-weight:700}
.anneau{width:48px;height:48px;border-radius:50%;background:conic-gradient(var(--rouge) 0 25%,var(--vert) 0 50%,var(--jaune) 0 75%,var(--bois) 0);-webkit-mask:radial-gradient(farthest-side,transparent calc(100% - 7px),#000 calc(100% - 6px));mask:radial-gradient(farthest-side,transparent calc(100% - 7px),#000 calc(100% - 6px));animation:tourne 1.1s linear infinite}
.sq{background:linear-gradient(90deg,#F2EADB 25%,#FBF6EC 50%,#F2EADB 75%);background-size:200% 100%;animation:brille 1.3s infinite;border-radius:12px}
@keyframes brille{to{background-position:-200% 0}}
.confirm-msg{margin:0 0 8px;font-size:15.5px}
.mt{margin-top:18px}

/* ---------- Présences ---------- */
.sec-onglets{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.onglet{display:inline-flex;align-items:center;gap:9px;padding:11px 18px;border-radius:14px;border:1.5px solid var(--ligne);background:#fff;font-weight:800;font-size:15px;color:var(--encre-2);cursor:pointer;box-shadow:var(--ombre);transition:.15s}
.onglet .ic{width:19px;height:19px}
.onglet:hover{border-color:var(--kraft);color:var(--encre)}
.onglet.actif{background:var(--bois);border-color:var(--bois);color:#fff}
.pres-barre{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;padding:14px 16px}
.pres-per{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.annee{display:inline-flex;align-items:center;gap:6px;color:var(--encre-2)}
.annee select{width:auto;padding:8px 10px;font-weight:800}
.pres-onglets .puce{padding:7px 13px;font-size:13.5px}
.pres-onglets .puce .ic{width:16px;height:16px}
.patrouilles{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px;align-items:start}
.pat-carte{--pc:var(--vert);background:#fff;border:1px solid var(--ligne);border-radius:16px;overflow:hidden;box-shadow:var(--ombre)}
.pat-tete{display:flex;align-items:center;gap:10px;padding:12px 14px;border-top:5px solid var(--pc);background:color-mix(in srgb,var(--pc) 9%,white)}
.pat-tete b{font-family:var(--titre);font-size:17px;flex:1}
.pat-compte{font-size:13px;font-weight:800;color:var(--encre-2);font-variant-numeric:tabular-nums;white-space:nowrap}
.pat-tete{flex-wrap:wrap;row-gap:6px}
.pat-tete .tag.distinction{order:10;flex-basis:auto;margin-left:22px}
.pat-tete .puce{padding:3px 10px;font-size:12px}
.pat-pastille{width:12px;height:12px;border-radius:50%;background:var(--pc);flex:none;display:inline-block;box-shadow:0 0 0 3px color-mix(in srgb,var(--pc) 22%,white)}
.pat-nom{display:inline-flex;align-items:center;gap:8px;font-weight:700}
.presence{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid #F2E9D8;cursor:pointer;user-select:none;transition:background .12s}
.presence:hover{background:#FFFBF1}
.presence input{position:absolute;opacity:0;pointer-events:none}
.presence .coche{width:26px;height:26px;border-radius:8px;border:2px solid var(--champ);display:grid;place-items:center;flex:none;background:#fff;transition:.12s;color:transparent}
.presence .coche .ic{width:17px;height:17px;stroke-width:3}
.presence.oui{background:#F3FAF5}
.presence.oui .coche{background:var(--vert);border-color:var(--vert);color:#fff}
.presence input:focus-visible+.coche{outline:3px solid var(--jaune)}
.presence .nom{flex:1;font-weight:700}
.tag.role{padding:2px 8px;font-size:11.5px}
.tag.role .ic{width:12px;height:12px}
.appel-tete .rangee{align-items:end}
.appel-etat{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.appel-pied{position:sticky;bottom:14px;z-index:4;margin-top:18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:var(--foret);color:#fff;border-radius:18px;padding:12px 14px 12px 20px;box-shadow:var(--ombre-2)}
.appel-total{flex:1;display:flex;flex-direction:column}
.appel-total b{font-family:var(--titre);font-size:19px;font-variant-numeric:tabular-nums}
.appel-total span{font-size:13px;opacity:.8;font-weight:700}
.pct.bon{color:var(--vert-f)}.pct.moyen{color:#9B6D00}.pct.faible{color:var(--rouge)}
.kpi.vedette .pct{color:#fff}
.hp-liste{display:flex;flex-direction:column;gap:14px}
.hp-nom{display:flex;align-items:center;gap:8px;font-weight:800;margin-bottom:6px}
.hp-l{display:grid;grid-template-columns:52px minmax(0,1fr) minmax(0,1.4fr);gap:10px;align-items:center;padding:4px 0 4px 20px}
.hp-l>span:nth-child(2){font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nom-role{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.show-m{display:none}
.m-tete{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.m-tete select{width:auto}
.m-ligne,.m-ajout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr) 34px;gap:6px;align-items:center;padding:9px 10px;border-top:1px solid #F2E9D8}
.m-ligne input[data-change=m-nom]{grid-column:1/3;font-weight:700}
.m-ligne [data-act=m-suppr]{grid-column:3;grid-row:1}
.m-ajout{grid-template-columns:minmax(0,1fr) 34px;background:#FCF8F0}
.m-ligne input,.m-ligne select,.m-ajout input{padding:8px 9px;font-size:14px}
.m-ligne select.role-0{background:var(--jaune-clair);border-color:#F3DF9B;font-weight:800}
.m-ligne select.role-1{background:var(--bois-clair);border-color:var(--kraft);font-weight:800}
.tag.distinction{background:linear-gradient(135deg,#FFE7A0,#F4C20D);color:#6A4A00;box-shadow:0 1px 0 rgba(0,0,0,.08)}
.distinction-carte{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:linear-gradient(120deg,#FFF8DF,#fff 60%);border-color:#F3DF9B}
.distinction-carte .dist-ic{width:42px;height:42px;border-radius:50%;background:#F4C20D;color:#6A4A00;display:grid;place-items:center;flex:none}
.distinction-carte .t{flex:1;min-width:180px}
.distinction-carte select{width:auto;min-width:180px;font-weight:800}
.appel-choix{display:flex;gap:18px;flex-wrap:wrap;margin-bottom:14px;padding-bottom:14px;border-bottom:1px dashed var(--ligne)}
.appel-choix .seg{flex-wrap:wrap}
#odj-pour{flex-wrap:wrap;max-width:100%}
.jalon img[src=""],.jalons-mini img[src=""]{visibility:hidden}
.rangee>.champ{min-width:0}
.seg.pour button{display:inline-flex;align-items:center;gap:7px}
.seg.pour button .ic{width:15px;height:15px}
.barre-l.large{grid-template-columns:minmax(0,260px) minmax(0,1fr)}

/* ---------- Progression ---------- */
.prog-info{display:flex;align-items:center;gap:8px;color:var(--encre-2);font-size:14px;flex-wrap:wrap}
.prog-etat{font-weight:800;color:var(--vert-f);font-size:13px;margin-left:8px}
.prog-grille{display:grid;grid-template-columns:290px minmax(0,1fr);gap:18px;align-items:start}
.pl{position:sticky;top:16px;padding:14px;max-height:calc(100vh - 32px);display:flex;flex-direction:column;gap:10px}
.pl-liste{overflow:auto;display:flex;flex-direction:column;gap:12px;margin:0 -6px;padding:0 6px}
.pl-titre{display:flex;align-items:center;gap:8px;font-weight:800;font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--encre-2);margin-bottom:4px}
.pl-m{width:100%;display:flex;flex-direction:column;align-items:flex-start;gap:4px;text-align:left;border:1px solid transparent;background:transparent;border-radius:12px;padding:8px 10px;cursor:pointer;font:inherit;color:inherit}
.pl-m:hover{background:#FFFBF1}
.pl-m.actif{background:var(--bois-clair);border-color:var(--kraft)}
.pl-nom{font-weight:800}
.pl-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.pl-b{display:inline-flex;align-items:center;gap:3px;font-size:12px;font-weight:800;color:#8B3A2E}
.pl-b .ic{width:13px;height:13px}
.niv-pille{--nc:var(--vert);display:inline-flex;align-items:center;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:800;background:color-mix(in srgb,var(--nc) 14%,white);color:color-mix(in srgb,var(--nc) 80%,black);white-space:nowrap}
.fiche-tete{display:flex;align-items:center;gap:16px;flex-wrap:wrap;border-top:5px solid var(--pc)}
.ft-nom{display:flex;align-items:center;gap:12px;flex:1;min-width:200px}
.ft-nom h2{font-size:22px;font-weight:800}
.ft-stats{display:flex;flex-direction:column;gap:4px}
.ft-date{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:800;color:var(--encre-2)}
.ft-date input{padding:8px 10px;width:auto}
.niveaux{display:flex;flex-direction:column;gap:14px;margin-top:14px}
.niv{--nc:var(--vert);background:#fff;border:1px solid var(--ligne);border-radius:18px;box-shadow:var(--ombre);overflow:hidden;border-left:6px solid var(--nc)}
.niv-tete{display:flex;align-items:center;gap:12px;padding:14px 16px;background:color-mix(in srgb,var(--nc) 7%,white)}
.niv-ic{width:38px;height:38px;border-radius:50%;background:var(--nc);color:#fff;display:grid;place-items:center;flex:none}
.niv-t{flex:1;min-width:0}
.niv-t h3{font-size:18px;font-weight:800;color:color-mix(in srgb,var(--nc) 75%,black)}
.niv-date{display:inline-flex;align-items:center;gap:6px;background:var(--nc);color:#fff;border-radius:999px;padding:5px 12px;font-weight:800;font-size:13px;white-space:nowrap}
.niv-date .ic{width:15px;height:15px}
.niv-barre{height:6px;background:color-mix(in srgb,var(--nc) 12%,white)}
.niv-barre div{height:100%;background:var(--nc);transition:width .4s}
.niv-corps{padding:14px 16px}
.niv-verrou{padding:14px 16px;color:var(--encre-3);font-weight:700;display:flex;gap:8px;align-items:center;background:repeating-linear-gradient(135deg,#FAF6EE 0 10px,#F4EEE2 10px 20px)}
.niv.verrouille .niv-ic{background:#B9AE9C}
.niv.verrouille{border-left-color:#D8CFBF}
.niv.verrouille .niv-tete{background:#FAF7F1}
.niv.verrouille .niv-t h3{color:var(--encre-3)}
.niv.clair:not(.verrouille) .niv-ic,.niv.clair .niv-date,.niv.clair .etp.oui .coche{color:color-mix(in srgb,var(--nc) 22%,black)}
.niv-tout{margin-left:auto;white-space:nowrap;font-size:13px;padding:6px 10px}
.niv-tout .ic{width:14px;height:14px}
.niv-pille .ic{width:12px;height:12px;margin-right:4px;stroke-width:3}
.patrouilles.une{grid-template-columns:minmax(0,560px)}
.etp-grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(66px,1fr));gap:8px}
.etp-grille.petite{grid-template-columns:repeat(4,minmax(0,1fr));margin-top:8px}
.etp{position:relative;display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 4px 7px;border:1.5px solid var(--champ);border-radius:12px;background:#FFFDF8;cursor:pointer;user-select:none;transition:.12s;min-width:0}
.etp:hover{border-color:var(--nc)}
.etp input{position:absolute;opacity:0;pointer-events:none}
.etp .coche{width:22px;height:22px;border-radius:7px;border:2px solid var(--champ);display:grid;place-items:center;color:transparent;background:#fff}
.etp .coche .ic{width:14px;height:14px;stroke-width:3}
.etp-t{font-weight:800;font-size:13px;text-align:center;line-height:1.2;overflow-wrap:anywhere}
.etp-d{font-size:10.5px;font-weight:800;color:color-mix(in srgb,var(--nc) 70%,black);opacity:.8}
.etp.oui{background:color-mix(in srgb,var(--nc) 10%,white);border-color:var(--nc)}
.etp.oui .coche{background:var(--nc);border-color:var(--nc);color:#fff}
.etp input:focus-visible+.coche{outline:3px solid var(--jaune)}
.b-liste .etp,.niv[style*="7B3FA0"] .etp{flex-direction:row;justify-content:flex-start;padding:8px 10px;gap:8px}
.b-liste{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:8px}
.b-liste .etp-t{text-align:left;flex:1}
.b-cats{display:flex;flex-direction:column;gap:14px}
.b-cat-t{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px;border-bottom:1px dashed var(--ligne);padding-bottom:4px}
.parties{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.partie{border:1.5px solid var(--champ);border-radius:14px;padding:8px;background:#FFFDF8}
.partie.choisie{border-color:var(--nc);background:color-mix(in srgb,var(--nc) 6%,white)}
.partie-t{width:100%;display:flex;align-items:center;gap:8px;background:transparent;border:0;cursor:pointer;font:inherit;color:inherit;text-align:left;padding:2px}
.partie-t b{flex:1}
.partie-t .coche{width:22px;height:22px;border-radius:50%;border:2px solid var(--champ);display:grid;place-items:center;color:transparent;flex:none}
.partie-t .coche .ic{width:13px;height:13px;stroke-width:3}
.partie.choisie .partie-t .coche{background:var(--nc);border-color:var(--nc);color:#fff}
.kpis-5{grid-template-columns:repeat(5,minmax(0,1fr))}
.kpi-sur{font-size:15px;color:var(--encre-3);font-weight:700}
.rang{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#F1EBDF;color:var(--encre-2);font-weight:800;font-size:13px;font-family:var(--titre)}
.rang.r1{background:linear-gradient(135deg,#FFE27A,#E0A800);color:#5A3F00}
.rang.r2{background:linear-gradient(135deg,#F1F1F1,#B8BCC2);color:#3D4248}
.rang.r3{background:linear-gradient(135deg,#F5C9A0,#C07A3E);color:#4A2A10}
b.pts{font-family:var(--titre);font-size:17px}
.leader{display:flex;flex-direction:column;gap:8px}
.ld-l{display:grid;grid-template-columns:32px minmax(0,1fr) minmax(0,1.2fr);gap:10px;align-items:center}
.ld-n{display:flex;flex-direction:column;min-width:0}
.ld-n b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ld-b .piste .v{min-width:30px}
.mini-barre{height:4px;border-radius:3px;background:color-mix(in srgb,var(--nc) 15%,white);margin-top:5px;max-width:140px}
.mini-barre div{height:100%;border-radius:3px;background:var(--nc)}
tr.cliquable{cursor:pointer}
.cat-l{grid-template-columns:minmax(0,1fr) 26px 34px}

/* ---------- Matériel › Local des bois (thème bois) + Compte rendu ---------- */
.bois{--b1:#4A2E17;--b2:#7A4E28;--b3:#B98552;--b4:#E9D2AE;--b5:#FBF4E6}
.bois-bandeau{display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap;border-radius:20px;padding:22px 24px;color:#FFF4E0;box-shadow:var(--ombre);border:1px solid #3B2412;
  background:repeating-linear-gradient(180deg,rgba(0,0,0,.24) 0 2px,transparent 2px 46px),
    repeating-linear-gradient(90deg,transparent 0 190px,rgba(0,0,0,.16) 190px 192px,transparent 192px 330px,rgba(0,0,0,.12) 330px 332px),
    repeating-linear-gradient(1deg,rgba(255,255,255,.05) 0 1px,transparent 1px 5px,rgba(0,0,0,.06) 5px 6px,transparent 6px 11px),
    linear-gradient(180deg,#8A5A2E,#6B4322)}
.bois-titre{display:flex;align-items:center;gap:14px;min-width:0;flex:1 1 280px}
.bois-logo{width:56px;height:56px;border-radius:50%;flex:none;border:2px solid #3B2412;box-shadow:0 2px 6px rgba(0,0,0,.3);
  background:radial-gradient(circle,#B98552 0 9%,#E9C99A 10% 22%,#C89B6D 23% 33%,#E2BE8C 34% 47%,#C89B6D 48% 58%,#DDB680 59% 73%,#B98552 74% 84%,#7A4E28 85% 100%)}
.bois-logo .ic{display:none}
.bois-titre h2{font-family:var(--titre);font-size:24px;font-weight:800;color:#FFF4E0}
.bois-titre p{color:rgba(255,244,224,.85);font-size:14px;margin-top:2px}
.bois-kpis{display:flex;gap:10px;flex-wrap:wrap}
.bois-kpi{background:rgba(255,244,224,.14);border:1px solid rgba(255,244,224,.3);border-radius:14px;padding:10px 16px;min-width:108px;display:flex;flex-direction:column}
.bois-kpi b{font-family:var(--titre);font-size:26px;line-height:1.1}
.bois-kpi span{font-weight:800;font-size:12.5px;text-transform:uppercase;letter-spacing:.06em}
.bois-kpi small{font-size:12px;opacity:.82}
.grille-bois{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:18px;align-items:start}
.grille-bois>*{min-width:0}
.bois .carte{border-color:#E4D3B6}
.bois .carte-titre h2 .ic{color:var(--b2)}
.bois-form{position:sticky;top:18px;background:linear-gradient(180deg,#FFFCF5,#FBF4E6)}
.bois-seg{display:flex;width:100%;flex-wrap:wrap}
.bois-seg button{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:9px 8px;white-space:nowrap}
.bois-seg button .ic{width:16px;height:16px}
.bois-seg button.actif{background:var(--b2);color:#fff}
.etat-p{width:10px;height:10px;border-radius:50%;background:var(--vert);flex:none}
.etat-p.jaune{background:var(--or)}
.etat-p.rouge{background:var(--rouge)}
.bois-longs{margin-top:-6px}
.bois-lignes{display:flex;flex-direction:column}
.bois-l{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:9px 0;border-top:1px dashed #E4D3B6}
.bois-l:first-child{border-top:0}
.bois-l.zero .planche,.bois-l.zero .palette-v{opacity:.45;filter:saturate(.5)}
.bois-v{min-width:0;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.bois-rem{flex-basis:100%}
.planche-piste{flex:1;min-width:0}
.planche{height:34px;display:flex;align-items:center;padding:0 12px;min-width:78px;position:relative;overflow:hidden;box-shadow:inset 0 -3px 0 rgba(0,0,0,.14),inset 0 2px 0 rgba(255,255,255,.25),0 1px 2px rgba(60,40,20,.25)}
.planche b{font-family:var(--titre);font-size:15px;position:relative;white-space:nowrap}
.planche.morine{border-radius:4px;color:#4A2E17;border:1px solid #A9783F;
  background:repeating-linear-gradient(178deg,rgba(122,78,40,.22) 0 1px,transparent 1px 5px,rgba(122,78,40,.10) 5px 6px,transparent 6px 9px),linear-gradient(180deg,#EBCB9B,#D7AC73)}
.planche.naturel{border-radius:17px;color:#FFF4E0;border:1px solid #4A2E17;padding-right:40px;
  background:repeating-linear-gradient(176deg,rgba(0,0,0,.2) 0 2px,transparent 2px 7px,rgba(255,255,255,.06) 7px 8px,transparent 8px 12px),linear-gradient(180deg,#8E6238,#6B4423)}
.planche.naturel::after{content:"";position:absolute;right:2px;top:2px;bottom:2px;aspect-ratio:1;border-radius:50%;border:1px solid #4A2E17;
  background:radial-gradient(circle,#B98552 0 12%,#E9C99A 13% 26%,#C89B6D 27% 40%,#E2BE8C 41% 58%,#C89B6D 59% 74%,#DDB680 75% 100%)}
.palette-v{width:46px;height:34px;border-radius:8px;display:grid;place-items:center;color:#4A2E17;border:1px solid #A9783F;background:linear-gradient(180deg,#EBCB9B,#D7AC73);flex:none}
.palette-v .ic{width:24px;height:24px}
.bois-act{display:flex;white-space:nowrap}
.bois-vide{padding:6px 0}
.bois-groupe.mor{border-left:6px solid #D7AC73}
.bois-groupe.nat{border-left:6px solid #7A4E28}
.bois-groupe.pal{border-left:6px solid #B98552}
.bois-recap .tableau{margin-bottom:0;border-bottom:1px solid var(--ligne)}
.bois-recap .recap-type{font-family:var(--titre);vertical-align:top}
.bois-recap .recap-total td{background:#FBF4E6;font-weight:800;border-top:1.5px solid #E4D3B6}
.recap-pied{display:flex;align-items:center;gap:10px;margin-top:16px;padding:12px 16px;border-radius:14px;color:#4A2E17;border:1px solid #D7AC73;
  background:repeating-linear-gradient(178deg,rgba(122,78,40,.12) 0 1px,transparent 1px 6px),linear-gradient(180deg,#F3E0BF,#E9D2AE)}
.recap-pied .ic{width:22px;height:22px;flex:none}
#cr-type{flex-wrap:wrap}
#cr-type button.actif{background:var(--bois);color:#fff}
/* ---------- Maîtrise de Groupe : connexion, onglets, administration, suivi des unités ---------- */
.nav-verrou{margin-left:auto;opacity:.75;display:inline-flex}
.nav-verrou .ic{width:14px;height:14px}
.verrou-txt{display:inline-flex;align-items:center;gap:6px;color:var(--encre-3)}
.carte-sec .stat .verrou-txt .ic{width:14px;height:14px;color:var(--encre-3);transform:none}
.cartes-sec.six .carte-sec,.cartes-sec.six .carte-sec:nth-child(n+4){grid-column:span 2}
.side-pied small a{display:inline;margin:0;font-size:12px;text-decoration:underline}
.m-session{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:#fff;border:1px solid var(--ligne);border-left:6px solid var(--accent);border-radius:18px;padding:14px 18px;box-shadow:var(--ombre);margin-bottom:18px}
.m-session.ok{border-left-color:var(--vert)}
.m-session .t{flex:1;min-width:220px;display:flex;flex-direction:column;gap:6px}
.m-session .t>b{font-family:var(--titre);font-size:17px}
.m-onglets{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px;margin-bottom:18px;background:#fff;border:1px solid var(--ligne);border-radius:18px;padding:6px;box-shadow:var(--ombre)}
.m-onglets button{display:flex;align-items:center;gap:12px;padding:10px 16px;border-radius:13px;border:0;background:transparent;cursor:pointer;text-align:left;color:var(--encre-2);font:inherit;transition:.15s;min-width:0}
.m-onglets button .ic{width:22px;height:22px;flex:none}
.m-onglets button span{display:flex;flex-direction:column;min-width:0}
.m-onglets button b{font-family:var(--titre);font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m-onglets button small{font-size:12px;font-weight:700;opacity:.85;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.m-onglets button:hover{background:var(--bois-clair)}
.m-onglets button.actif{background:var(--principale);color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.18)}
.m-onglets button.actif[data-v="unites"]{background:var(--accent);color:#2A1B06}
.login{display:grid;place-items:center;padding:24px 0 40px}
.login-carte{--c:var(--principale);width:min(440px,100%);background:#fff;border:1px solid var(--ligne);border-top:6px solid var(--c);border-radius:24px;padding:28px 28px 24px;box-shadow:var(--ombre-2);display:flex;flex-direction:column;gap:6px}
.login-carte .patch{margin-bottom:10px}
.login-carte h1{font-size:28px;font-weight:800;line-height:1.15}
.login-carte p{margin:2px 0 14px;color:var(--encre-2);font-size:14.5px}
.login-carte .actions .btn{flex:1;justify-content:center}
.login-note{display:flex;gap:8px;align-items:center;margin-top:14px;padding:10px 12px;border-radius:12px;background:var(--vert-clair);color:var(--vert-f);font-weight:700;font-size:13px}
.login-note .ic{width:16px;height:16px;flex:none}
.mdp{display:flex;gap:6px;align-items:center}
.mdp input{flex:1;min-width:0}
.u-entete .seg button{display:inline-flex;align-items:center;gap:7px}
.u-entete .seg button .ic{width:16px;height:16px}
.mdp .icone-btn{border-color:var(--champ);background:#fff;flex:none;width:42px;height:42px}
.adm-comptes{display:flex;flex-direction:column}
.adm-l{display:grid;grid-template-columns:minmax(150px,1fr) minmax(0,1.1fr) minmax(0,1.4fr) auto;gap:12px;align-items:end;padding:12px 0;border-top:1px dashed var(--ligne)}
.adm-l:first-child{border-top:0}
.adm-nom{display:flex;flex-direction:column;gap:5px;align-items:flex-start;align-self:center}
.adm-nom b{font-family:var(--titre);font-size:16px}
.adm-l .btn{height:42px}
.adm-libre{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;font-weight:700;color:var(--encre-2);cursor:pointer;margin-top:2px}
.adm-libre input{width:16px;height:16px;accent-color:var(--principale);margin:0}
.adm-l.libre .champ{opacity:.55}
.bandeau-info{display:flex;gap:10px;align-items:flex-start;background:color-mix(in srgb,var(--accent) 9%,white);border:1px solid color-mix(in srgb,var(--accent) 28%,white);color:color-mix(in srgb,var(--accent) 80%,black);border-radius:14px;padding:11px 16px;font-weight:600;font-size:13.5px;margin-bottom:14px}
.bandeau-info .ic{width:19px;height:19px;flex:none;margin-top:1px}
.adm-l.joker{background:color-mix(in srgb,var(--accent) 6%,white);border-radius:14px;padding:12px 14px;margin:8px -14px 0;border-top:0}
.adm-joker{display:flex;gap:8px;align-items:flex-start;font-size:12.5px;color:var(--encre-2);align-self:center;line-height:1.4}
.adm-joker .ic{width:16px;height:16px;flex:none;margin-top:2px;color:var(--accent)}
.adm-unites{display:flex;flex-direction:column;gap:12px}
.adm-u{border:1px solid var(--ligne);border-left:6px solid var(--pc);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.adm-u-t{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.adm-u-t b{font-family:var(--titre);font-size:16px}
.adm-u-t .btn{margin-left:auto}
.adm-chemin{word-break:break-word}
.adm-u-f{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.adm-u-f input{flex:1;min-width:220px}
.u-barre{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;padding:12px 16px}
.u-barre .puce{display:inline-flex;align-items:center;gap:8px;padding:7px 14px;font-size:14px}
.u-barre .puce .ic{width:15px;height:15px}
.u-puce.actif,.u-puce.actif:hover{background:var(--pc);border-color:var(--pc)}
.u-puce.actif .pat-pastille{background:#fff;box-shadow:0 0 0 3px rgba(255,255,255,.3)}
.u-droite{display:flex;align-items:center;gap:8px}
.u-lecture{background:color-mix(in srgb,var(--accent) 22%,white);color:color-mix(in srgb,var(--accent) 45%,black)}
.u-cartes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:stretch}
.u-carte{text-align:left;font:inherit;color:inherit;cursor:pointer;background:#fff;border:1px solid var(--ligne);border-top:6px solid var(--pc);border-radius:20px;padding:16px 18px 14px;box-shadow:var(--ombre);display:flex;flex-direction:column;gap:10px;transition:.18s;min-width:0}
.u-carte:hover{transform:translateY(-3px);box-shadow:var(--ombre-2);border-color:color-mix(in srgb,var(--pc) 45%,white);border-top-color:var(--pc)}
.u-carte-t{display:flex;align-items:center;gap:10px}
.u-carte-t b{font-family:var(--titre);font-size:18px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.u-carte-t>.ic{width:18px;height:18px;color:var(--pc);transition:transform .18s}
.u-carte:hover .u-carte-t>.ic{transform:translateX(4px)}
.u-carte-c{display:flex;flex-direction:column;gap:6px;flex:1;min-width:0}
.u-grand{font-family:var(--titre);font-weight:800;font-size:30px;line-height:1.1;font-variant-numeric:tabular-nums;word-break:break-word}
.u-split{display:flex;height:8px;border-radius:5px;overflow:hidden;background:#F3ECDF;margin-top:6px}
.u-split i{display:block;height:100%}
.u-split .e,.pt.e{background:var(--vert)}
.u-split .d,.pt.d{background:var(--rouge)}
.pt{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.u-lignes{display:flex;gap:14px;flex-wrap:wrap;font-size:13px;color:var(--encre-2);font-weight:700}
.u-lignes span{display:inline-flex;align-items:center;gap:6px}
.u-lignes b{color:var(--encre);margin-left:2px}
.u-lignes .ic{width:15px;height:15px;color:var(--encre-3)}
.u-pied{margin-top:auto;padding-top:10px;border-top:1px dashed var(--ligne);font-size:12.5px;font-weight:700;color:var(--encre-3)}
.u-sep{margin-top:8px;padding-top:10px;border-top:1px dashed var(--ligne);font-size:11.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--encre-3)}
.u-prog{display:flex;flex-direction:column;gap:5px}
.u-prog>div{display:flex;align-items:center;gap:8px;font-size:13.5px}
.u-prog .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--encre-2);font-weight:700}
.u-prog b{font-variant-numeric:tabular-nums}
.u-prog small{color:var(--encre-3);font-weight:700}
.u-jauge{margin:4px 0 2px}
.u-chips,.u-alertes{display:flex;flex-wrap:wrap;gap:6px}
.u-msg{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:12px;background:var(--bois-clair);color:var(--encre-2);font-size:13.5px;font-weight:700}
.u-msg .ic{width:18px;height:18px;flex:none;margin-top:1px}
.u-msg.err{background:var(--rouge-clair);color:#8E1016}
.u-astuce{margin:14px 2px 0;font-size:13px}
.u-total{display:grid;grid-template-columns:minmax(0,260px) minmax(0,1fr);gap:22px;align-items:center;margin-bottom:16px;border-left:6px solid var(--accent)}
.u-total .lbl{font-size:12px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:var(--encre-3);display:flex;align-items:center;gap:6px}
.u-total .lbl .ic{width:16px;height:16px}
.u-total .val{font-family:var(--titre);font-weight:800;font-size:32px;line-height:1.15}
.u-total-d .barre-l{grid-template-columns:minmax(0,170px) minmax(0,1fr)}
.u-entete{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;border-left:6px solid var(--pc);padding:14px 18px}
.u-entete-t{display:flex;align-items:center;gap:12px;min-width:0}
.u-entete-t h2{font-size:22px;font-weight:800}
.u-entete-a{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.u-chev{width:16px;height:16px;color:var(--encre-3);transform:rotate(-90deg)}
tr.cliquable:hover{background:#FFFBF1}
.u-qte{font-family:var(--titre);font-size:17px;font-variant-numeric:tabular-nums}
.u-montant{font-family:var(--titre);font-weight:800;font-size:34px;margin-bottom:14px}
.details{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 18px;margin:0}
.details dt{font-size:11.5px;letter-spacing:.08em;text-transform:uppercase;font-weight:800;color:var(--encre-3)}
.details dd{margin:2px 0 0;font-weight:700;word-break:break-word}
.u-noms{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-direction:column;gap:6px}
.u-noms li{display:flex;justify-content:space-between;gap:10px;padding:7px 10px;border-radius:10px;background:#fff;border:1px solid var(--ligne)}
.rec-cols h3 .ic{width:18px;height:18px}
.lecture [data-inerte]{cursor:default}
.lecture a[data-inerte]{pointer-events:none;color:inherit;text-decoration:none}
.lecture .niv-tout,.lecture .ft-date{display:none}
.lecture .etp,.lecture .jalon,.lecture .etape-case,.lecture .partie-t{cursor:default}
.lecture .etp:hover{border-color:var(--champ)}
.lecture .etp.oui:hover{border-color:var(--nc)}
.lecture button:disabled{opacity:1}
.lecture .seg button:disabled,.lecture .puce:disabled{opacity:.55}
.fiche-lecture .fiche-tete{box-shadow:none}
/* Couleurs de la Maîtrise : orange en haut, qui glisse vers le bleu en descendant (l'orange domine) */
body.maitrise{--orange-haut:color-mix(in srgb,var(--principale) 72%,#FFC46B);--bleu:var(--accent);
  --pont-1:color-mix(in srgb,color-mix(in oklch,var(--principale) 72%,var(--accent)) 50%,color-mix(in srgb,var(--principale) 72%,var(--accent)));
  --pont-2:color-mix(in srgb,color-mix(in oklch,var(--principale) 36%,var(--accent)) 50%,color-mix(in srgb,var(--principale) 36%,var(--accent)));
  --degrade:linear-gradient(180deg,var(--orange-haut) 0%,var(--principale) 30%,var(--principale) 58%,var(--pont-1) 72%,var(--pont-2) 87%,var(--bleu) 100%);
  background-image:linear-gradient(180deg,color-mix(in srgb,var(--principale) 13%,var(--papier)) 0%,var(--papier) 60%,color-mix(in srgb,var(--accent) 13%,var(--papier)) 100%)}
body.maitrise .sidebar{background:var(--degrade);color:#fff}
body.maitrise .sidebar::before{background:radial-gradient(120% 45% at 0% 0%,rgba(255,255,255,.14),transparent 60%)}
body.maitrise .app-marque span,body.maitrise .devise,body.maitrise .accueil-hero .eyebrow{color:#FFF1D6}
body.maitrise .nav-titre{color:rgba(255,255,255,.72)}
body.maitrise .nav-btn{color:#fff}
body.maitrise .nav-btn .nav-ic{background:rgba(255,255,255,.2);color:#fff}
body.maitrise .nav-btn:hover{background:rgba(255,255,255,.14)}
body.maitrise .nav-btn.actif{background:rgba(255,255,255,.24);box-shadow:inset 3px 0 0 #fff}
body.maitrise .nav-btn.actif .nav-ic{background:#fff;color:var(--principale)}
body.maitrise .side-pied small{color:rgba(255,255,255,.8)}
body.maitrise .logo-rond::after,body.maitrise .grand-logo::after{border-color:rgba(255,255,255,.6)}
body.maitrise .accueil-hero{background:var(--degrade)}
body.maitrise .accueil-hero::before{background:radial-gradient(60% 70% at 88% 0%,rgba(255,255,255,.16),transparent 60%)}
body.maitrise .kpi.vedette:not(.neg){background:linear-gradient(180deg,var(--orange-haut) 0%,var(--principale) 52%,var(--pont-1) 82%,var(--pont-2) 100%)}
body.maitrise .kpi.vedette .lbl,body.maitrise .kpi.vedette .det{color:rgba(255,255,255,.88)}
body.maitrise .btn.accent,body.maitrise .chip-h.j{color:#fff}
body.maitrise .m-onglets button.actif{background:linear-gradient(180deg,var(--orange-haut),var(--principale))}
body.maitrise .m-onglets button.actif[data-v="unites"]{background:linear-gradient(180deg,var(--pont-2),var(--bleu));color:#fff}
body.maitrise .u-lecture{background:color-mix(in srgb,var(--accent) 12%,white);color:var(--accent)}
body.maitrise .appel-pied{background:linear-gradient(180deg,var(--principale),var(--pont-1))}
body.maitrise .topbar{background:linear-gradient(180deg,var(--orange-haut),var(--principale))}
body.maitrise .bottomnav{border-top:3px solid var(--bleu)}

/* ---------- Progression du Clan + Ordre du jour ---------- */
.jalons-g{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.jalon{--jc:var(--bois);position:relative;display:flex;flex-direction:column;align-items:center;gap:8px;padding:16px 10px 12px;border:1.5px solid var(--champ);border-radius:16px;background:#FFFDF8;cursor:pointer;text-align:center;transition:.15s;user-select:none}
.jalon input{position:absolute;opacity:0;pointer-events:none}
.jalon img{width:84px;height:84px;object-fit:contain;filter:grayscale(1);opacity:.32;transition:.2s}
.jalon:hover{border-color:var(--jc)}
.jalon:hover img{opacity:.6}
.jalon.oui{border-color:var(--jc);background:color-mix(in srgb,var(--jc) 9%,white);box-shadow:0 0 0 3px color-mix(in srgb,var(--jc) 16%,transparent)}
.jalon.oui img{filter:none;opacity:1}
.jalon b{font-family:var(--titre);font-size:15.5px;line-height:1.2}
.jalon-etat{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:800;color:var(--encre-3);border-radius:999px;padding:3px 10px;background:#F1EBDF}
.jalon-etat .ic{width:14px;height:14px}
.jalon.oui .jalon-etat{background:var(--jc);color:#fff}
.jalon input:focus-visible~img{outline:3px solid var(--jaune);border-radius:12px}
.jalon.stat{cursor:default}
.jalon-n{font-family:var(--titre);font-weight:800;font-size:24px;line-height:1}
.jalons-mini{display:flex;gap:6px;align-items:center}
.jalons-mini img{width:28px;height:28px;object-fit:contain}
.etapes-c{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.etape-c{--ec:var(--vert);border:1.5px solid var(--champ);border-radius:16px;overflow:hidden;background:#fff;display:flex;flex-direction:column;transition:.15s}
.ruban{height:16px;box-shadow:inset 0 -1px 0 rgba(0,0,0,.12)}
.etape-c .corps{padding:14px;display:flex;flex-direction:column;gap:10px;align-items:flex-start;flex:1}
.etape-c .corps>b{font-family:var(--titre);font-size:17px}
.etape-c.oui{border-color:var(--ec);background:color-mix(in srgb,var(--ec) 6%,white)}
.etape-c.verrou{background:#FAF7F1}
.etape-c.verrou .ruban{opacity:.35}
.etape-c.verrou .corps>b{color:var(--encre-3)}
.etape-case{display:flex;align-items:center;gap:9px;cursor:pointer;font-weight:800;font-size:13.5px;color:var(--encre-2);user-select:none}
.etape-case input{position:absolute;opacity:0;pointer-events:none}
.etape-case .coche{width:26px;height:26px;border-radius:8px;border:2px solid var(--champ);display:grid;place-items:center;color:transparent;background:#fff;flex:none}
.etape-case .coche .ic{width:16px;height:16px;stroke-width:3}
.etape-c.oui .etape-case{color:var(--encre)}
.etape-c.oui .coche{background:var(--ec);border-color:var(--ec);color:#fff}
.etape-case input:focus-visible+.coche{outline:3px solid var(--jaune)}
.etape-verrou{display:flex;gap:6px;align-items:center;font-size:12.5px;font-weight:700;color:var(--encre-3)}
.etape-verrou .ic{width:15px;height:15px;flex:none}
.kpi-ruban{padding-top:28px}
.kpi-ruban .ruban{position:absolute;left:0;right:0;top:0;height:12px}
.type-doc{display:flex;margin-bottom:16px}
.type-doc button{flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px;font-size:14.5px}
.type-doc button .ic{width:17px;height:17px}
.odj-etapes{display:flex;flex-direction:column;gap:8px;counter-reset:odj}
.odj-e{counter-increment:odj;border:1px solid var(--ligne);border-radius:14px;padding:8px;background:#fff}
.odj-l{display:grid;grid-template-columns:30px minmax(0,1fr) auto 34px;gap:8px;align-items:center}
.odj-n::before{content:counter(odj) ".";font-family:var(--titre);font-weight:800;font-size:16px;color:var(--bois);display:block;text-align:right}
.odj-plus{padding:6px 8px;font-size:13px}
.odj-plus .ic{width:14px;height:14px}
.odj-puces{display:flex;flex-direction:column;gap:6px;margin:0 42px 0 38px}
.odj-puces:not(:empty){margin-top:8px}
.odj-p{display:grid;grid-template-columns:16px minmax(0,1fr) 34px;gap:8px;align-items:center}
.odj-b{font-weight:800;color:var(--bois);text-align:center}
.odj-p input{padding:8px 10px;font-size:14px}
#odj-note{padding:10px 14px}

/* ---------- Maîtrise : les trois espaces de l'accueil, fil d'Ariane ---------- */
.espaces{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1.15fr) minmax(0,.8fr);gap:18px;align-items:start}
.espace{--c:var(--principale);background:#fff;border:1px solid var(--ligne);border-top:6px solid var(--c);border-radius:22px;padding:18px;box-shadow:var(--ombre);display:flex;flex-direction:column;gap:14px;min-width:0}
.esp-t{display:flex;gap:14px;align-items:flex-start}
.esp-t .patch{--c:inherit;flex:none}
.esp-t h2{font-family:var(--titre);font-size:21px;line-height:1.15;margin:2px 0 4px}
.esp-t p{margin:0;color:var(--encre-2);font-size:13.5px}
.esp-t .eyebrow{color:var(--c);font-size:11px;letter-spacing:.12em;text-transform:uppercase;font-weight:800}
.esp-liste{display:flex;flex-direction:column;gap:6px}
.esp-l{--c:var(--bois);display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:14px;border:1px solid transparent;background:#FCF8F0;cursor:pointer;text-align:left;font:inherit;color:inherit;transition:border-color .15s,background .15s;min-width:0}
.esp-l:hover{border-color:color-mix(in srgb,var(--c) 45%,white);background:#fff}
.patch.mini{width:34px;height:34px;border-radius:10px}
.patch.mini .ic{width:18px;height:18px}
.patch.mini::after{display:none}
.esp-n{display:flex;flex-direction:column;flex:1;min-width:0}
.esp-n b{font-size:14.5px}
.esp-n .sous{font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.esp-f{width:18px;height:18px;color:var(--encre-3);flex:none}
.esp-f.verrou{color:var(--encre-3);opacity:.8}
.esp-admin{align-self:flex-start}
.nav-titre-lien{display:flex;align-items:center;gap:6px;width:100%;border:0;background:none;cursor:pointer;text-align:left;font-family:inherit}
.nav-titre-lien .ic{width:13px;height:13px}
.nav-titre-lien:hover,.nav-titre-lien.actif{color:#fff}
.ariane{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin:-4px 0 12px;font-size:12.5px;font-weight:700;color:var(--encre-3)}
.ariane button{display:inline-flex;align-items:center;gap:5px;border:0;background:none;padding:2px 0;font:inherit;color:var(--encre-2);cursor:pointer}
.ariane button:hover{color:var(--principale);text-decoration:underline}
.ariane .ic{width:14px;height:14px}
.ariane .ariane-sep{transform:rotate(-90deg);width:12px;height:12px;opacity:.6}
.ariane span{color:var(--encre)}
.u-legende{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.u-legende .tag{--pc:var(--bois);background:#fff;border:1px solid var(--ligne);color:var(--encre)}
.adm-nom .adm-libre{margin-top:0}

/* ---------- Réunions restreintes · photos · urgences · événements · listes · services ---------- */
.tag.restreinte{background:color-mix(in srgb,var(--or) 18%,white);color:#8A6200;margin-top:4px}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.photos:empty{display:none}
.photo{position:relative;background:#fff;border:1px solid var(--ligne);border-radius:14px;overflow:hidden;display:flex;flex-direction:column}
.photo img{width:100%;height:120px;object-fit:cover;display:block;background:#F3EBDD}
.photo .icone-btn{position:absolute;top:6px;right:6px;background:rgba(255,255,255,.92)}
.photo-leg{border:0;border-top:1px solid var(--ligne);border-radius:0;padding:8px 10px;font-size:13px}
.photo.attente{align-items:center;justify-content:center;gap:8px;min-height:160px}
.photos-ajout{cursor:pointer}
.urgences{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}
.urg{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--ligne);border-radius:16px;padding:12px 14px;box-shadow:var(--ombre);color:var(--encre);text-decoration:none;min-width:0}
.urg:hover{border-color:var(--rouge)}
.urg-n{display:inline-flex;align-items:center;gap:6px;font-family:var(--titre);font-weight:800;font-size:24px;color:var(--rouge);flex:none}
.urg-n .ic{width:18px;height:18px}
.urg-t{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.urg-t b{font-size:14px}
.urg-t [lang=ar]{font-size:13px;color:var(--encre-2);text-align:left}
.urg-t small{font-size:11.5px;color:var(--encre-3);font-weight:700}
.urg.croix-rouge,.urg.defense{border-color:color-mix(in srgb,var(--rouge) 35%,white);background:color-mix(in srgb,var(--rouge) 5%,white)}
.urg.croix-rouge .urg-n,.urg.defense .urg-n{font-size:28px}
.ev-sous{display:flex;flex-wrap:wrap;gap:4px 12px;margin-top:6px;font-size:12px;font-weight:700;color:var(--encre-2)}
.ev-sous span{display:inline-flex;align-items:center;gap:4px}
.ev-sous .ic{width:13px;height:13px;color:var(--bois)}
.evs{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.ev-carte{text-align:left;background:#FFFCF6;border:1px solid var(--ligne);border-radius:14px;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:6px;font:inherit;color:inherit;transition:border-color .15s,box-shadow .15s}
.ev-carte:hover{border-color:var(--bois);box-shadow:var(--ombre)}
.ev-t{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.ev-t b{font-family:var(--titre);font-size:16px;margin-right:2px}
.ev-bilan{font-family:var(--titre);font-weight:800;font-size:22px}
.ev-l{display:flex;gap:14px;font-size:13px;font-weight:700}
.ev-l span{display:inline-flex;align-items:center;gap:6px}
.ev-l .pt,.u-lignes .pt{width:9px;height:9px;border-radius:50%;display:inline-block}
.ev-l .pt.e{background:var(--vert)}.ev-l .pt.d{background:var(--rouge)}
tr.ev-ligne{cursor:pointer;background:#FFF8EA}
tr.ev-ligne:hover{background:#FFF1D6}
tr.ev-ligne .cellule-t{display:flex;align-items:center;gap:6px;font-family:var(--titre);font-size:15.5px}
tr.ev-ligne .cellule-t .ic{width:16px;height:16px;color:var(--bois)}
tr.ev-ligne .ev-chev{width:18px;height:18px;transition:transform .2s;color:var(--encre-3)}
tr.ev-ligne.ouvert .ev-chev{transform:rotate(180deg)}
tr.ev-enfant td{background:#FFFCF5}
tr.ev-enfant td:first-child{box-shadow:inset 4px 0 0 color-mix(in srgb,var(--bois) 45%,white)}
.listes-barre{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;padding:12px 16px;margin-bottom:16px}
.listes-barre .puce.nouvelle{border-style:dashed}
.tag.liste-tag{margin-top:4px;font-size:11.5px}
.lot-liste{margin-bottom:6px}
.services{display:flex;flex-direction:column}
.service{--pc:var(--bois);display:grid;grid-template-columns:62px minmax(0,1fr) auto;gap:14px;align-items:start;padding:14px 4px;border-top:1px dashed var(--ligne)}
.service:first-child{border-top:0}
.sv-date{display:flex;flex-direction:column;align-items:center;background:color-mix(in srgb,var(--pc) 10%,white);border-radius:12px;padding:6px 0;line-height:1.1;color:var(--pc)}
.sv-date b{font-family:var(--titre);font-size:22px}
.sv-date span{font-size:12px;font-weight:800;text-transform:uppercase}
.sv-date small{font-size:10.5px;color:var(--encre-3)}
.sv-c{display:flex;flex-direction:column;gap:6px;min-width:0}
.sv-t{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sv-t b{font-size:15.5px}
.tag.sv-unite{background:color-mix(in srgb,var(--pc) 14%,white);color:var(--pc)}
.tag.sv-type{background:color-mix(in srgb,var(--tc) 13%,white);color:var(--tc);border:1px solid color-mix(in srgb,var(--tc) 30%,white)}
.tag.sv-pour{display:inline-flex;align-items:center;gap:5px}
.tag.sv-pour .ic{width:13px;height:13px}
.sv-titre{font-size:15.5px;overflow-wrap:anywhere}
.serv-eq[hidden]{display:none}
#f-serv .seg.pour{display:flex;flex-wrap:wrap;max-width:100%}
#f-serv .seg.pour button{white-space:nowrap}
/* ---------- Trésorier › Commandes Coop ---------- */
.onglet-coop.actif{background:#1E5AA0;border-color:#1E5AA0}
.btn.coop-btn{background:#1E5AA0;color:#fff;border-color:#1E5AA0}
.btn.coop-btn:hover{background:#184B86}
.btn.coop-achat{background:#1E7339;color:#fff;border-color:#1E7339}
.coop-bandeau{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.coop-bandeau img{width:150px;height:auto;flex:none}
.coop-bandeau .t{flex:1;min-width:220px}
.coop-bandeau b{font-family:var(--titre);font-size:19px}
.coop-bandeau p{color:var(--encre-2);margin-top:3px;font-size:14px}
.kpi.vedette.coop-kpi{background:linear-gradient(135deg,#1E5AA0,#2F77C4)}
.coop-titre{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.coop-titre h2{font-family:var(--titre);font-size:20px;display:flex;align-items:center;gap:8px}
.coop-titre h2 .ic{width:20px;height:20px;color:#1E5AA0}
.coop-titre .sous{flex:1}
.recus{display:flex;flex-direction:column;gap:16px}
.recu{background:#fff;border:1px solid var(--ligne);border-radius:16px;box-shadow:var(--ombre);overflow:hidden;position:relative}
.recu-bande{display:grid;grid-template-columns:repeat(4,1fr);height:5px}
.recu-tete{display:flex;align-items:center;gap:16px;padding:16px 20px;border-bottom:2px dashed var(--ligne);flex-wrap:wrap}
.recu-tete img{width:96px;height:auto;flex:none}
.recu-id{flex:1;min-width:150px}
.recu-id .eyebrow{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#1E5AA0}
.recu-id h3{font-family:var(--titre);font-size:21px;margin:1px 0}
.recu-st{display:flex;flex-direction:column;align-items:flex-end;gap:6px}
.recu-total{font-family:var(--titre);font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.coop-statut{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12.5px;font-weight:800;white-space:nowrap}
.coop-statut .ic{width:14px;height:14px}
.coop-statut.ouverte{background:#E8F0FA;color:#1E5AA0}
.coop-statut.achetee{background:#FFF4DB;color:#94620A}
.coop-statut.payee{background:#E5F4EA;color:#1E7339}

/* ---------- Photographe › Checklists ---------- */
.onglet-ph.actif{background:#2D5DA8;border-color:#2D5DA8}
.ph-n{background:rgba(0,0,0,.08);border-radius:999px;padding:0 7px;font-size:11.5px;margin-left:2px}
.seg .ic{width:16px;height:16px;vertical-align:-3px}
.ph-cartes{display:flex;flex-direction:column;gap:14px}
.ph-carte{background:#fff;border:1px solid var(--ligne);border-radius:var(--r);box-shadow:var(--ombre);overflow:hidden;border-left:5px solid #2D5DA8}
.ph-carte.termine{border-left-color:var(--vert);background:#FCFDFB}
.ph-carte.termine .ph-tete{opacity:.82}
.ph-tete{display:grid;grid-template-columns:62px minmax(0,1fr) auto auto;gap:14px;align-items:center;padding:14px 16px}
.ph-date{width:58px;flex:none}
.ph-titre{border:0;background:transparent;text-align:left;padding:0;cursor:pointer;display:flex;flex-direction:column;gap:6px;min-width:0;font:inherit;color:inherit}
.ph-titre h3{font-size:18px;font-weight:800;line-height:1.2;overflow-wrap:anywhere}
.ph-meta{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
.ph-barre{display:flex;height:8px;border-radius:6px;background:#EEF1F6;overflow:hidden;max-width:420px}
.ph-barre i{display:block;height:100%;transition:width .35s}
.ph-barre .f{background:linear-gradient(90deg,#3E9A63,var(--vert))}
.ph-barre .p{background:#C9CED6}
.ph-compte{font-family:var(--titre);text-align:right;white-space:nowrap}
.ph-compte b{font-size:24px;font-weight:800}
.ph-compte span{color:var(--encre-3);font-weight:700;font-size:14px}
.ph-a{display:flex;gap:2px;align-items:center}
.ph-chev .ic{transition:transform .2s}
.ph-carte.ouvert .ph-chev .ic{transform:rotate(180deg)}
.ph-corps{border-top:1px solid #EEF1F6;padding:6px 16px 14px}
.ph-rem{display:flex;gap:8px;align-items:flex-start;background:#F2F6FC;border-radius:12px;padding:9px 12px;margin:8px 0 4px;color:#2B4A7A;font-weight:700;font-size:13.5px}
.ph-rem .ic{width:16px;height:16px;flex:none;margin-top:2px;opacity:.6}
.ph-prises{list-style:none;margin:0;padding:0}
.ph-prise{display:grid;grid-template-columns:36px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px dashed #E7EBF1}
.ph-prise:last-child{border-bottom:0}
.ph-type{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;background:#E9F0FB;color:#2D5DA8;border:0;padding:0}
.ph-type.v{background:#FDEBEF;color:#B4234F}
.ph-type .ic{width:18px;height:18px}
.ph-txt{display:flex;flex-direction:column;min-width:0}
.ph-txt b{font-weight:700;overflow-wrap:anywhere}
.ph-prise.fait .ph-txt b{color:var(--vert-f)}
.ph-prise.pasfait .ph-txt b{color:var(--encre-3);text-decoration:line-through;text-decoration-color:#C9CED6}
.ph-cases{display:flex;gap:6px}
.ph-case{display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--champ);background:#fff;border-radius:10px;padding:7px 11px;font-weight:800;font-size:13px;color:var(--encre-2);cursor:pointer;transition:.12s;min-height:38px}
.ph-case .ic{width:17px;height:17px;stroke-width:2.6}
.ph-case.ok:hover{border-color:#9FD3B3;color:var(--vert-f)}
.ph-case.non:hover{border-color:#F1B5B3;color:var(--rouge)}
.ph-case.ok.actif{background:var(--vert);border-color:var(--vert);color:#fff}
.ph-case.non.actif{background:#6B7280;border-color:#6B7280;color:#fff}
.ph-pied{margin-top:8px}
.ph-ajout{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:8px;align-items:center}
.ph-seg button{display:inline-flex;align-items:center;gap:6px}

.ph-reprendre{display:flex;align-items:center;gap:10px;margin-top:10px;font-weight:700;color:var(--encre-2);font-size:13px;flex-wrap:wrap}

.ph-e-a{display:flex;gap:0}
