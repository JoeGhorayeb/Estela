.ph-e-vide .ic{color:var(--kraft)}

/* ---------- Photographe › Couvertures ---------- */
.couv{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);gap:18px;align-items:start}
.couv-g,.couv-d{display:flex;flex-direction:column;gap:14px;min-width:0}
.couv-etape{display:flex;align-items:center;gap:10px;font-family:var(--titre);font-weight:800;font-size:16px;margin-bottom:12px}
.couv-etape span{width:26px;height:26px;border-radius:50%;background:#2D5DA8;color:#fff;display:grid;place-items:center;font-size:13px;font-family:var(--texte)}
.couv-fmts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.couv-fmt{border:1.5px solid var(--champ);background:#FFFDF8;border-radius:14px;padding:12px 8px;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;font:inherit;color:var(--encre-2);text-align:center;transition:.12s}
.couv-fmt b{font-size:13.5px;color:var(--encre);line-height:1.2}
.couv-fmt .sous{font-size:11.5px}
.couv-fmt-ic{display:block;border:2.5px solid currentColor;border-radius:5px;margin-bottom:4px;position:relative;color:#9AA6B6}
.couv-fmt-ic::after{content:"";position:absolute;left:0;right:0;bottom:0;height:16%;background:currentColor}
.couv-fmt:hover{border-color:var(--kraft)}
.couv-fmt.actif{border-color:#2D5DA8;background:#EEF3FC;box-shadow:0 0 0 3px rgba(45,93,168,.14)}
.couv-fmt.actif .couv-fmt-ic{color:#2D5DA8}
.couv-apercu{padding:16px}
.couv-cadre{position:relative;width:100%;margin:0 auto;border-radius:10px;overflow:hidden;background:#5E6A77;box-shadow:0 10px 30px rgba(20,30,50,.18)}
.couv-cadre canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab;user-select:none;-webkit-user-select:none}
.couv-cadre canvas.prise{cursor:grabbing}
.couv-vide{position:absolute;inset:0;border:0;background:rgba(20,26,36,.28);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;cursor:pointer;font:inherit;text-align:center;padding:16px}
.couv-vide .ic{width:44px;height:44px;stroke-width:1.6}
.couv-vide b{font-family:var(--titre);font-size:20px}
.couv-vide span{font-size:13px;font-weight:700;opacity:.85}
.couv-aide{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(15,20,30,.62);color:#fff;font-size:12px;font-weight:700;border-radius:999px;padding:5px 12px;display:flex;gap:6px;align-items:center;pointer-events:none;white-space:nowrap;max-width:calc(100% - 20px);overflow:hidden;text-overflow:ellipsis}
.couv-aide .ic{width:14px;height:14px;flex:none}
.couv-aide.cache{opacity:0;transition:opacity .5s}
.couv-zoom{display:flex;align-items:center;gap:8px;margin-top:12px;flex-wrap:wrap}
.couv-zoom input[type=range]{flex:1;min-width:120px;accent-color:#2D5DA8}
.couv-zv{font-weight:800;font-size:13px;min-width:48px;font-variant-numeric:tabular-nums;color:var(--encre-2)}
.couv-pleine{width:100%}
.couv-nom{display:flex;align-items:center;gap:6px;margin-top:10px;overflow-wrap:anywhere}
.couv-nom .ic{width:15px;height:15px;color:var(--vert);flex:none}
.couv-alerte{display:flex;gap:6px;align-items:flex-start;color:#A12A1F;font-weight:700;font-size:12.5px}
.couv-alerte .ic{width:15px;height:15px;flex:none;margin-top:1px}
.couv-coul{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.couv-pastille{width:38px;height:38px;border-radius:50%;border:3px solid #fff;background:var(--pc);box-shadow:0 0 0 1.5px var(--champ);cursor:pointer;padding:0;display:grid;place-items:center;position:relative;transition:.12s}
.couv-pastille.actif{box-shadow:0 0 0 3px #2D5DA8}
.couv-perso{color:var(--encre-2)}
.couv-perso .ic{width:18px;height:18px;mix-blend-mode:difference;color:#fff}
.couv-perso input{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%;border:0;padding:0}
.couv-hex{font-variant-numeric:tabular-nums;margin-left:2px}
.couv-final{margin:0 auto;border-radius:10px;overflow:hidden;box-shadow:0 10px 30px rgba(20,30,50,.2);background:#eee}
.couv-final img{display:block;width:100%;height:100%;object-fit:contain}

/* ---------- Animateur ---------- */
.onglet-an.actif{background:#A23B72;border-color:#A23B72}
.an-tag{background:var(--tf);color:var(--tc)}
.an-cats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.an-cat{display:flex;align-items:center;gap:14px;background:#fff;border:1px solid var(--ligne);border-radius:16px;padding:14px 16px;box-shadow:var(--ombre);cursor:pointer;font:inherit;color:inherit;text-align:left;transition:.15s;border-bottom:4px solid var(--tf)}
.an-cat:hover{transform:translateY(-2px);border-color:color-mix(in srgb,var(--tc) 35%,white)}
.an-cat.actif{border-color:var(--tc);box-shadow:0 0 0 3px color-mix(in srgb,var(--tc) 18%,white)}
.an-cat-ic{width:44px;height:44px;border-radius:13px;background:var(--tf);color:var(--tc);display:grid;place-items:center;flex:none}
.an-cat-ic .ic{width:22px;height:22px}
.an-cat b{display:block;font-family:var(--titre);font-size:24px;font-weight:800;line-height:1.1}
.an-cat span span{font-size:13px;font-weight:800;color:var(--encre-3)}
.an-groupe+.an-groupe{margin-top:22px}
.an-g-t{display:flex;align-items:center;gap:8px;font-size:17px;margin:0 0 10px;color:var(--tc)}
.an-g-t .ic{width:19px;height:19px}
.an-grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}
.an-carte{display:flex;flex-direction:column;background:#fff;border:1px solid var(--ligne);border-radius:16px;box-shadow:var(--ombre);overflow:hidden;border-top:4px solid var(--tc);min-width:0}
.an-c-corps{display:flex;gap:12px;padding:14px 14px 8px;border:0;background:transparent;text-align:left;cursor:pointer;font:inherit;color:inherit;flex:1;min-width:0}
.an-c-corps:hover .an-c-t b{color:var(--tc)}
.an-c-ic{width:38px;height:38px;border-radius:11px;background:var(--tf);color:var(--tc);display:grid;place-items:center;flex:none}
.an-c-ic .ic{width:19px;height:19px}
.an-c-t{display:flex;flex-direction:column;gap:4px;min-width:0}
.an-c-t b{font-size:15.5px;font-weight:800;line-height:1.25;overflow-wrap:anywhere}
.an-c-meta{display:flex;flex-wrap:wrap;gap:10px;font-size:12.5px;font-weight:700;color:var(--encre-2)}
.an-c-meta span{display:inline-flex;align-items:center;gap:4px}
.an-c-meta .ic{width:14px;height:14px;color:var(--encre-3)}
.an-c-ap{font-size:13px;color:var(--encre-2);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-line}
.an-c-a{display:flex;justify-content:flex-end;gap:2px;padding:0 8px 8px}
.an-texte{white-space:pre-wrap;background:#FBF7EE;border:1px solid var(--ligne);border-radius:14px;padding:16px 18px;line-height:1.65;font-size:15px;max-height:58vh;overflow:auto;overflow-wrap:anywhere}
.an-paroles{font-family:var(--titre);font-size:16px}
.an-choix{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.an-ch{display:flex;flex-direction:column;align-items:center;gap:6px;border:1.5px solid var(--champ);background:#fff;border-radius:14px;padding:12px 6px;cursor:pointer;font:inherit;color:var(--encre-2);transition:.12s}
.an-ch .ic{width:22px;height:22px;color:var(--tc)}
.an-ch.actif{border-color:var(--tc);background:var(--tf);color:var(--encre);box-shadow:0 0 0 3px color-mix(in srgb,var(--tc) 15%,white)}
.an-ch:disabled{cursor:default}
.an-ch:disabled:not(.actif){opacity:.4}
.vl-grille{display:grid;grid-template-columns:260px minmax(0,1fr);gap:18px;align-items:start}
.vl-liste{padding:14px;display:flex;flex-direction:column;gap:6px;position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto}
.vl-liste .carte-titre{margin:2px 4px 8px}
.vl-l{display:flex;flex-direction:column;gap:2px;text-align:left;border:1.5px solid transparent;background:#FBF7EE;border-radius:12px;padding:10px 12px;cursor:pointer;font:inherit;color:inherit}
.vl-l b{font-weight:800;overflow-wrap:anywhere}
.vl-l:hover{border-color:var(--kraft)}
.vl-l.actif{background:#FBEFF5;border-color:#A23B72}
.vl-detail{min-width:0}
.vl-tete-t{display:flex;gap:14px;justify-content:space-between;align-items:flex-start;flex-wrap:wrap}
.vl-tete h2{font-size:24px;font-weight:800;margin:2px 0}
.vl-a{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.vl-chips{margin-top:12px}
.vl-courbe-c{padding:12px}
.vl-courbe{overflow-x:auto;-webkit-overflow-scrolling:touch}
.vl-courbe svg{display:block;max-width:none;height:auto}
.vl-courbe.petite{border:1px solid var(--ligne);border-radius:12px;background:#fff}
.vl-deroule{list-style:none;margin:0;padding:0}
.vl-deroule li{display:flex;gap:12px;align-items:flex-start;padding:12px 0;border-top:1px solid #F2E9D8}
.vl-deroule li:first-child{border-top:0;padding-top:0}
.vl-num{width:28px;height:28px;border-radius:50%;background:var(--tc,#A23B72);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px;flex:none}
.vl-m{flex:1;min-width:0}
.vl-m-t{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.vl-m-t b{font-size:15.5px;overflow-wrap:anywhere}
.vl-h{font-weight:800;color:var(--encre-3);font-variant-numeric:tabular-nums;font-size:13px}
.vl-note{font-size:13px;color:var(--encre-2);margin-top:3px;font-style:italic}
.vl-voir-r{flex:none}
.vl-apercu{margin-bottom:10px}
.vl-ajout{display:flex;flex-wrap:wrap;gap:6px}
.vl-plus{display:inline-flex;align-items:center;gap:5px;border:1.5px solid color-mix(in srgb,var(--tc) 35%,white);background:var(--tf);color:var(--tc);border-radius:999px;padding:6px 12px;font-weight:800;font-size:13px;cursor:pointer;font-family:inherit}
.vl-plus .ic{width:15px;height:15px;stroke-width:2.6}
.vl-plus:hover{border-color:var(--tc)}
.vl-edit{list-style:none;margin:12px 0 0;padding:0;display:flex;flex-direction:column;gap:10px}
.vl-e{border:1px solid var(--ligne);border-left:5px solid var(--tc);border-radius:14px;padding:10px 12px;background:#fff}
.vl-e-t{display:grid;grid-template-columns:28px 120px minmax(0,1fr) auto auto;gap:8px;align-items:center}
.vl-e-t select,.vl-e-t input{padding:8px 10px;font-size:14px}
.vl-e-a{display:flex}
.vl-e-a .icone-btn{width:30px;height:30px}
.vl-e-a .icone-btn:disabled{opacity:.3;cursor:default}
.vl-lie{font-size:11.5px}
.vl-e-d{display:grid;grid-template-columns:auto 110px minmax(0,1fr) minmax(0,1.4fr);gap:10px;margin-top:8px;padding-left:36px;align-items:end}
.vl-mini{display:flex;flex-direction:column;gap:4px;font-size:12px;font-weight:800;color:var(--encre-3);min-width:0}
.vl-mini input{padding:7px 9px;font-size:14px}
.vl-niv{display:inline-flex;background:#F1E8D6;border-radius:10px;padding:3px;gap:2px}
.vl-niv button{border:0;background:transparent;width:30px;height:30px;border-radius:8px;font-weight:800;color:var(--encre-2);cursor:pointer;font-family:inherit}
.vl-niv button.actif{background:#A23B72;color:#fff}
.vl-niv-t{font-size:11.5px}

@media (max-width:1100px){
  .cartes-sec.n7,.cartes-sec.n8{grid-template-columns:repeat(2,minmax(0,1fr))}
  .cartes-sec.n7 .carte-sec,.cartes-sec.n7 .carte-sec:nth-child(n+4),.cartes-sec.n7 .carte-sec:nth-child(n+5),.cartes-sec.n8 .carte-sec,.cartes-sec.n8 .carte-sec:nth-child(n+4),.cartes-sec.n8 .carte-sec:last-child{grid-column:span 1}
  .cartes-sec.n7 .carte-sec:last-child{grid-column:1/-1}
  .couv{grid-template-columns:1fr}
  .vl-grille{grid-template-columns:1fr}
  .vl-liste{position:static;max-height:none;flex-direction:row;overflow-x:auto;flex-wrap:nowrap}
  .vl-liste .carte-titre{display:none}
  .vl-l{min-width:190px;max-width:240px;flex:none}
  .an-cats{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:900px){
  .bottomnav.defile{display:flex;overflow-x:auto;scroll-snap-type:x proximity;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  .bottomnav.defile::-webkit-scrollbar{display:none}
  .bottomnav.defile button{flex:0 0 68px;scroll-snap-align:start}
  .bottomnav.defile .bn-ic{width:40px}
}
@media (max-width:760px){
  .cartes-sec.n7,.cartes-sec.n8{grid-template-columns:1fr}
  .cartes-sec.n7 .carte-sec:last-child{grid-column:auto}
}
@media (max-width:640px){
  .ph-tete{grid-template-columns:52px minmax(0,1fr) auto;gap:10px;padding:12px}
  .ph-date{width:50px}
  .ph-a{grid-column:1/-1;justify-content:flex-end;margin-top:-6px}
  .ph-titre h3{font-size:16.5px}
  .ph-corps{padding:4px 12px 12px}
  .ph-prise{grid-template-columns:32px minmax(0,1fr);gap:10px}
  .ph-cases{grid-column:1/-1;padding-left:42px}
  .ph-case{flex:1;justify-content:center;min-height:42px}
  .ph-ajout{grid-template-columns:1fr auto}
  .ph-ajout .ph-seg{grid-column:1/-1;display:flex}
  .ph-ajout .ph-seg button{flex:1;justify-content:center}
  .ph-ajout .btn span{display:none}
  .ph-e{grid-template-columns:22px 32px minmax(0,1fr);padding:8px;row-gap:4px}
  .ph-e .ph-e-etat{grid-column:3;justify-self:start}
  .ph-e-a{grid-column:1/-1;justify-content:flex-end;margin-top:-2px}
  .couv-fmts{gap:6px}
  .couv-fmt{padding:10px 4px}
  .couv-fmt b{font-size:12px}
  .couv-fmt .sous{font-size:10.5px}
  .an-cats{gap:10px}
  .an-cat{padding:12px;gap:10px}
  .an-cat-ic{width:38px;height:38px}
  .an-grille{grid-template-columns:1fr}
  .an-choix{grid-template-columns:repeat(2,minmax(0,1fr))}
  .vl-e-t{grid-template-columns:26px minmax(0,1fr) auto;gap:6px}
  .vl-e-t .vl-num{grid-column:1;grid-row:1}
  .vl-e-t select{grid-column:2;grid-row:1}
  .vl-e-t .vl-e-a{grid-column:3;grid-row:1}
  .vl-e-t input{grid-column:1/-1;grid-row:2}
  .vl-e-t .vl-lie{grid-column:1/-1;grid-row:3;justify-self:start}
  .vl-e-d{grid-template-columns:1fr 1fr;padding-left:0}
  .vl-e-d .vl-mini:first-child{grid-column:1/-1}
  .vl-mini-note{grid-column:1/-1}
  .vl-tete h2{font-size:20px}
}
/* menu de gauche : il défile quand il y a beaucoup de sections (Maîtrise) */
.sidebar .nav{flex:0 1 auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.28) transparent;margin-right:-10px;padding-right:10px}
.sidebar .nav::-webkit-scrollbar{width:6px}
.sidebar .nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.28);border-radius:6px}
body.maitrise .nav-btn{padding:7px 12px}
body.maitrise .nav-btn .nav-ic{width:30px;height:30px}
/* ---------- Téléphone : menu « hamburger » plein écran (remplace la barre du bas) ---------- */
.tb-menu{display:none}
.menu-m{display:none}

    background:rgba(255,255,255,.14);color:#fff;box-shadow:0 0 0 1px rgba(255,255,255,.22) inset}

  body.sur-accueil .tb-menu{display:none}

  .menu-m{display:flex;flex-direction:column;position:fixed;inset:0;z-index:80;color:#F4EEDF;overflow:hidden;
    background:linear-gradient(170deg,var(--foret-clair) 0%,var(--foret) 42%,var(--foret-2) 100%);
    opacity:0;visibility:hidden;transform:translateY(-12px);transition:opacity .22s ease,transform .22s ease,visibility 0s linear .22s}
  body.maitrise .menu-m{background:var(--degrade,linear-gradient(170deg,var(--foret-clair),var(--foret-2)))}

  .menu-m::before{content:"";position:absolute;inset:0;background:radial-gradient(90% 50% at 100% 0%,color-mix(in srgb,var(--accent) 16%,transparent),transparent 65%);pointer-events:none}
  .mm-topo{position:absolute;inset:0;opacity:.5;pointer-events:none;background-size:520px 520px}
  .mm-defile{position:relative;flex:1;overflow-y:auto;overscroll-behavior:contain;padding:calc(14px + env(safe-area-inset-top)) 18px 150px;-webkit-overflow-scrolling:touch}
  .mm-tete{display:flex;align-items:center;gap:12px}
  .mm-tete .app-icone{width:44px;height:44px;display:block!important}
  .mm-tete b{display:block;font-family:var(--titre);font-weight:800;font-size:25px;line-height:1;color:#fff}
  .mm-tete small{display:block;font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-weight:800;margin-top:3px}
  .mm-fermer{margin-left:auto;width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;display:grid;place-items:center;cursor:pointer;box-shadow:0 0 0 1px rgba(255,255,255,.22) inset}
  .mm-fermer .ic{width:22px;height:22px;stroke-width:2.4}
  .mm-unite{display:flex;align-items:center;gap:12px;margin-top:16px;padding:10px 12px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);border-radius:16px}
  .mm-unite .logo-rond{width:44px;height:44px}
  .mm-unite .logo-rond::after{inset:-5px}
  .mm-unite .logo-rond img{width:36px;height:36px}

  .mm-titre::after{content:"";flex:1;height:1px;background:rgba(255,255,255,.16)}
  .mm-grille{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .mm-t{display:flex;align-items:center;gap:9px;min-height:60px;padding:9px 10px;border-radius:16px;border:1px solid rgba(255,255,255,.14);background:rgba(255,255,255,.07);
    color:#fff;font:inherit;font-weight:800;font-size:13px;line-height:1.2;letter-spacing:-.1px;text-align:left;cursor:pointer;position:relative;transition:background .15s,transform .1s;min-width:0}

  .mm-t .mm-ic::after{content:"";position:absolute;inset:3px;border-radius:50%;border:1.5px dashed rgba(255,255,255,.55)}

@media (max-width:900px) and (prefers-reduced-motion:reduce){ .menu-m,.menu-m.ouvert{transition:none} }
/* ---------- Saisons & fêtes ---------- */
#saison-ciel{position:fixed;inset:0;width:100vw;height:100vh;z-index:4;pointer-events:none}
/* la corde aux couleurs de la fête */
body[data-saison] .corde{background:repeating-linear-gradient(90deg,var(--s1) 0 18px,transparent 18px 23px,var(--s2) 23px 41px,transparent 41px 46px,var(--s3) 46px 64px,transparent 64px 69px,var(--s4) 69px 87px,transparent 87px 92px);opacity:.95}
body[data-saison=independance] .corde{background:repeating-linear-gradient(90deg,#ED1C24 0 22px,transparent 22px 27px,#fff 27px 49px,transparent 49px 54px,#00A651 54px 76px,transparent 76px 81px);box-shadow:0 0 0 .5px rgba(0,0,0,.08)}
/* pastille dans le menu de gauche */
.saison-pastille{display:flex;align-items:center;gap:8px;margin:0 2px 6px;padding:7px 12px;border-radius:999px;border:1px solid rgba(255,255,255,.18);background:linear-gradient(90deg,color-mix(in srgb,var(--s1,#fff) 30%,transparent),rgba(255,255,255,.06));
  color:#fff;font:inherit;font-weight:800;font-size:12.5px;cursor:pointer;position:relative;text-align:left}
.saison-pastille .ic{width:16px;height:16px;flex:none;color:var(--s3,#fff)}
body[data-saison=independance] .saison-pastille .ic,body[data-saison=noel] .saison-pastille .ic{color:#fff}
.saison-pastille span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
/* le message de la fête, sous le grand bandeau */
.saison-ruban{position:relative;display:flex;align-items:center;gap:16px;margin-top:16px;padding:16px 18px;border-radius:20px;background:#fff;border:1px solid var(--ligne);box-shadow:var(--ombre);overflow:hidden}
.saison-ruban::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:linear-gradient(180deg,var(--s1),var(--s2),var(--s3))}
.saison-ruban::after{content:"";position:absolute;right:-40px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--s1) 16%,transparent),transparent 70%)}
.sr-ic{width:54px;height:54px;border-radius:50%;flex:none;display:grid;place-items:center;color:#fff;background:linear-gradient(135deg,var(--s1),color-mix(in srgb,var(--s1) 60%,black));position:relative;box-shadow:0 0 0 4px color-mix(in srgb,var(--s1) 18%,white)}
.sr-ic::after{content:"";position:absolute;inset:4px;border-radius:50%;border:1.5px dashed rgba(255,255,255,.6)}
.sr-ic .ic{width:26px;height:26px}
body[data-saison=nouvel-an] .sr-ic{background:linear-gradient(135deg,#1B2340,#3A4A86);color:#F4E3A1}
.sr-t{flex:1;min-width:0;position:relative;z-index:1}
.sr-puce{display:inline-block;font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:color-mix(in srgb,var(--s1) 75%,black);background:color-mix(in srgb,var(--s1) 12%,white);border-radius:999px;padding:3px 10px}
body[data-saison=nouvel-an] .sr-puce{color:#7A5A00;background:#FBF1CF}
.sr-t h2{font-size:21px;font-weight:800;margin:6px 0 2px}
.sr-t p{margin:0;color:var(--encre-2);font-size:14.5px}
.sr-anim{position:relative;z-index:1;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--champ);background:#fff;border-radius:999px;padding:7px 12px;font:inherit;font-weight:800;font-size:12.5px;color:var(--encre-2);cursor:pointer;flex:none}
.sr-anim .ic{width:15px;height:15px}
.sr-anim:hover{border-color:var(--kraft);color:var(--encre)}

/* ---------- le décor du grand bandeau ---------- */
.accueil-hero.saison .txt,.accueil-hero.saison .grand-logo{z-index:2}
.saison-deco{position:absolute;inset:0;pointer-events:none;z-index:1;overflow:hidden;border-radius:inherit}
.sd-haut{position:absolute;left:0;right:0;top:0;height:80px}
.sd-bas-c{position:absolute;left:0;right:0;bottom:0}
.sd-bas{display:block;width:100%;height:56px}
.sd-logo{position:absolute;inset:0;pointer-events:none}
/* Noël : guirlande, neige au sol, couronne autour du logo */
.sd-fil{position:absolute;left:0;top:0;width:100%;height:36px}
.sd-ampoule{position:absolute;width:9px;height:13px;margin-left:-4.5px;border-radius:50% 50% 45% 45%;background:var(--b);box-shadow:0 0 10px 2px var(--b);animation:sd-scintille 2.4s ease-in-out infinite}
.sd-ampoule::before{content:"";position:absolute;left:2px;right:2px;top:-4px;height:5px;border-radius:2px;background:#3B4A3F}
@keyframes sd-scintille{0%,100%{opacity:1;box-shadow:0 0 12px 3px var(--b)}50%{opacity:.55;box-shadow:0 0 3px 0 var(--b)}}
.sd-couronne{position:absolute;inset:-24px;width:calc(100% + 48px);height:calc(100% + 48px);filter:drop-shadow(0 4px 6px rgba(0,0,0,.25))}
.accueil-hero.saison .grand-logo::after{z-index:0}
/* Nouvel An : nuit, étoiles suspendues, année */
.accueil-hero[data-fond=nuit]::after{content:"";position:absolute;inset:0;background:linear-gradient(120deg,rgba(14,18,48,.82) 0%,rgba(27,35,64,.55) 55%,rgba(60,40,10,.35) 100%);z-index:0;pointer-events:none}
.sd-pend{position:absolute;top:0;width:26px;margin-left:-13px;transform-origin:50% 0;animation:sd-balance 4s ease-in-out infinite}
.sd-pend::before{content:"";display:block;width:1.5px;height:var(--l);margin:0 auto;background:linear-gradient(#F4E3A1,rgba(244,227,161,.4))}
.sd-pend svg{display:block;width:26px;height:26px;filter:drop-shadow(0 0 6px rgba(244,227,161,.8))}
@keyframes sd-balance{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg)}}
.sd-annee{position:absolute;right:210px;bottom:-26px;font-family:var(--titre);font-weight:800;font-size:140px;line-height:1;color:transparent;-webkit-text-stroke:2px rgba(244,227,161,.55);letter-spacing:.02em}
/* Pâques : herbe et œufs, rayons derrière le logo */
.sd-rayons{position:absolute;inset:-70px;border-radius:50%;background:repeating-conic-gradient(rgba(255,240,190,.32) 0 7deg,transparent 7deg 18deg);-webkit-mask:radial-gradient(circle,#000 30%,transparent 70%);mask:radial-gradient(circle,#000 30%,transparent 70%);animation:sd-tourne 70s linear infinite;z-index:-1}
.sd-rayons.doux{background:repeating-conic-gradient(rgba(255,255,255,.28) 0 5deg,transparent 5deg 15deg)}
@keyframes sd-tourne{to{transform:rotate(360deg)}}
.accueil-hero.saison .grand-logo{overflow:visible}
.grand-logo .sd-logo{z-index:0}
.grand-logo img{position:relative;z-index:1}
/* Indépendance : drapeau, cèdre en filigrane */
.accueil-hero[data-fond=drapeau]::after{content:"";position:absolute;inset:0;background:linear-gradient(130deg,rgba(237,28,36,.38),transparent 55%);pointer-events:none;z-index:0}
.sd-drapeau{display:flex;flex-direction:column;height:44px;position:relative}
.sd-drapeau::after{content:"";position:absolute;inset:0;background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.35) 45%,transparent 60%);background-size:250% 100%;animation:sd-reflet 6s ease-in-out infinite}
@keyframes sd-reflet{from{background-position:120% 0}to{background-position:-120% 0}}
.sd-drapeau i{display:block}
.sd-drapeau .r{height:11px;background:#ED1C24}
.sd-drapeau .b{flex:1;background:#fff;overflow:hidden}
.sd-drapeau .b span{display:flex;justify-content:space-around;height:100%;align-items:center}
.sd-drapeau .b svg{height:20px;width:20px}
@keyframes sd-flotte{0%,100%{transform:skewY(0)}50%{transform:skewY(-.6deg)}}
.sd-filigrane{position:absolute;right:190px;top:50%;transform:translateY(-50%);width:230px;height:230px;opacity:.12}
.sd-filigrane.lys{opacity:.14;width:240px;height:240px}
.sd-anneau{position:absolute;inset:-14px;border-radius:50%;background:conic-gradient(var(--a) 0 25%,#fff 0 50%,var(--b) 0 75%,#fff 0);-webkit-mask:radial-gradient(circle,transparent 62.5%,#000 63%,#000 65.5%,transparent 66%);mask:radial-gradient(circle,transparent 62.5%,#000 63%,#000 65.5%,transparent 66%);animation:sd-tourne 30s linear infinite}
/* Saint Maroun : cèdres et aube */
.accueil-hero[data-fond=aube]::after{content:"";position:absolute;inset:0;background:radial-gradient(70% 90% at 80% 0%,rgba(255,214,120,.35),transparent 60%);pointer-events:none;z-index:0}
.accueil-hero.saison .pins{opacity:.12}
/* Journée des Fondateurs : nœud plat */
.sd-noeud{height:12px;margin:0 0 10px;background:repeating-linear-gradient(115deg,#F4C20D 0 6px,#C99A00 6px 8px,#F4C20D 8px 14px);border-radius:6px;opacity:.85;box-shadow:0 2px 0 rgba(0,0,0,.15)}
/* coins (Rameaux, fête des mères, Annonciation) */
.sd-coin{position:absolute;width:150px;height:150px;bottom:-8px}
.sd-coin.g{left:-8px}
.sd-coin.d{right:-8px;transform:scaleX(-1)}
.sd-coin.d.deux{right:200px;bottom:-14px;width:120px;height:120px;transform:scaleX(1) rotate(-8deg);opacity:.9}
.sd-coin.lys{right:200px;transform:none;width:130px;height:130px;opacity:.9}
/* Assomption : couronne de douze étoiles */
.accueil-hero[data-fond=ciel]::after{content:"";position:absolute;inset:0;background:linear-gradient(130deg,rgba(44,90,160,.5),transparent 70%);pointer-events:none;z-index:0}
.sd-etoiles{position:absolute;inset:0}
.sd-etoiles i{position:absolute;width:14px;height:14px;margin:-7px 0 0 -7px;background:#F4D46A;clip-path:polygon(50% 0,61% 35%,98% 35%,68% 57%,79% 91%,50% 70%,21% 91%,32% 57%,2% 35%,39% 35%);filter:drop-shadow(0 0 4px #FFE9A0);animation:sd-scintille2 2.8s ease-in-out infinite}
@keyframes sd-scintille2{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.6;transform:scale(.8)}}
/* Croix : soir et feu */
.accueil-hero[data-fond=soir]::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(40,10,40,.15),rgba(120,40,0,.45));pointer-events:none;z-index:0}
.sd-feu{position:absolute;right:240px;bottom:2px;width:120px;height:120px}
.sd-feu svg{width:100%;height:100%;overflow:visible}
.sd-feu .f1{transform-origin:60px 118px;animation:sd-flamme 1.1s ease-in-out infinite alternate}
.sd-feu .f2{transform-origin:60px 118px;animation:sd-flamme 0.8s ease-in-out infinite alternate-reverse}
@keyframes sd-flamme{from{transform:scale(1,1) skewX(0)}to{transform:scale(.94,1.08) skewX(3deg)}}
/* Saint François (Meute) : automne, lune, oiseaux, traces de loup, tau */
.accueil-hero[data-fond=automne]::after{content:"";position:absolute;inset:0;background:linear-gradient(130deg,rgba(139,94,52,.55),rgba(194,65,12,.18) 70%,transparent);pointer-events:none;z-index:0}
.sd-lune{position:absolute;right:230px;top:18px;width:54px;height:54px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFF6DC,#F3E2C2 60%,#E2C48F);box-shadow:0 0 30px 8px rgba(255,236,190,.35)}
.sd-oiseau{position:absolute;width:26px;height:11px;animation:sd-vol 3.2s ease-in-out infinite}
@keyframes sd-vol{0%,100%{transform:translateY(0) scaleY(1)}50%{transform:translateY(-6px) scaleY(.6)}}
.sd-filigrane.tau{opacity:.13;width:200px;height:200px}
.sd-bas.pattes{height:70px}
/* Saint Georges (Troupe) : fanions, bouclier et épées */
.accueil-hero[data-fond=chevalier]::after{content:"";position:absolute;inset:0;background:linear-gradient(130deg,rgba(30,60,120,.45),transparent 60%);pointer-events:none;z-index:0}
.sd-fanion{position:absolute;width:0;height:0;margin-left:-9px;border-left:9px solid transparent;border-right:9px solid transparent;border-top:20px solid var(--f);filter:drop-shadow(0 2px 2px rgba(0,0,0,.25));transform-origin:50% 0;animation:sd-balance 3.6s ease-in-out infinite}
.sd-filigrane.bouclier{opacity:.2;width:190px;height:190px}
/* Saint Paul (Clan) : la route, le soleil couchant, la fourche */
.accueil-hero[data-fond=route]::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(62,91,122,.35),rgba(194,65,12,.38));pointer-events:none;z-index:0}
.sd-bas.route{height:118px}
.sd-trait{animation:sd-marche 2.4s linear infinite}
@keyframes sd-marche{to{stroke-dashoffset:-52}}
.sd-filigrane.soleil{opacity:.55;width:120px;height:120px;top:auto;bottom:40px;transform:none;right:270px;filter:blur(1px) drop-shadow(0 0 30px rgba(255,200,120,.9))}
body.saison-calme .saison-deco *,body.saison-calme .sd-logo *,body.saison-calme .sd-logo{animation:none!important}
@media (prefers-reduced-motion:reduce){ .saison-deco *,.sd-logo,.sd-logo *{animation:none!important} }
@media (max-width:900px){
  .sd-annee{font-size:96px;right:auto;left:50%;transform:translateX(-50%);bottom:-18px}
  .sd-filigrane{right:50%;transform:translate(50%,-50%);width:180px;height:180px}
  .sd-feu{right:18px;width:72px;height:72px}
  .sd-lune{right:22px;top:auto;bottom:18px;width:40px;height:40px}
  .sd-filigrane.soleil{right:20px;bottom:30px;width:80px;height:80px}
  .sd-bas.route{height:80px}
  .sd-filigrane.bouclier,.sd-filigrane.tau{opacity:.09}
  .sd-coin{width:110px;height:110px}
  .sd-coin.d.deux{display:none}
  .sd-coin.lys{right:12px;width:96px;height:96px}
  .sd-couronne{inset:-16px;width:calc(100% + 32px);height:calc(100% + 32px)}
  .sd-rayons{inset:-46px}
  .saison-ruban{flex-wrap:wrap;padding:14px}
  .sr-t h2{font-size:18px}
  .sr-t{flex:1 1 calc(100% - 70px)}
  .sr-anim{margin-left:62px}
  .sd-haut{height:64px}
}
@media (max-width:640px){
  .sd-pend:nth-child(n+4){display:none}
  .sr-ic{width:46px;height:46px}
}
/* ---------- Secrétaire › Liste d'emplacements ---------- */
.onglet-em.actif{background:#3D6B4F;border-color:#3D6B4F}
input[type=url]{width:100%}
.em-tete-carte{padding:18px 20px 14px;margin-bottom:14px}
.em-tete{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.em-titre{display:flex;align-items:center;gap:14px;min-width:0}
.em-titre h2{font-size:21px;font-weight:800}
.em-titre p{margin:2px 0 0;color:var(--encre-2);font-weight:700;font-size:13.5px}
.em-titre .spin{width:13px;height:13px;vertical-align:-2px}
.em-boutons{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.em-outils{margin-top:16px;display:flex;flex-direction:column;gap:12px}
.em-q-ligne{display:flex;gap:8px;align-items:stretch}
.em-q{min-width:0}
.em-f-btn{display:none}
.em-f-btn b{background:#3D6B4F;color:#fff;border-radius:999px;min-width:20px;height:20px;padding:0 6px;font-size:12px;display:inline-grid;place-items:center}
.em-f-btn b:empty{display:none}
.em-q input{font-size:15.5px;padding-top:12px;padding-bottom:12px}
.em-filtres{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1.15fr) minmax(0,.7fr) minmax(0,1fr) minmax(0,1.1fr);gap:10px}
.em-f{display:flex;flex-direction:column;gap:5px;font-weight:800;font-size:12px;color:var(--encre-2);min-width:0}
.em-f>span{display:inline-flex;align-items:center;gap:5px;letter-spacing:.02em}
.em-f>span .ic{width:14px;height:14px;color:#3D6B4F}
.em-f select,.em-f input{padding:9px 10px;font-size:14px}
.em-legende{display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;margin-top:12px;padding-top:12px;border-top:1px dashed var(--ligne);font-size:12.5px;font-weight:700;color:var(--encre-2)}
.em-leg-t{color:var(--encre-3)}
.em-leg{display:inline-flex;align-items:center;gap:6px}
.em-leg i{width:12px;height:12px;border-radius:50%;display:block}
.em-leg i.aucun{border:2px solid var(--champ);background:#fff}
.em-resume{display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap;margin:4px 2px 12px;font-size:14px;color:var(--encre-2)}
.em-resume b{font-family:var(--titre);font-size:17px;color:var(--encre)}
.em-note{display:inline-flex;align-items:center;gap:5px;background:#E8F1EB;color:#2F5A41;border-radius:999px;padding:3px 10px;font-weight:800;font-size:12.5px}
.em-note .ic{width:14px;height:14px}
.em-resume .btn.lien{padding:5px 8px;font-size:13px}
.em-grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(285px,1fr));gap:14px}
.em-carte{--uc:#D9CDB6;position:relative;background:#fff;border:1px solid var(--ligne);border-radius:16px;box-shadow:var(--ombre);padding:16px 16px 14px 20px;cursor:pointer;display:flex;flex-direction:column;gap:7px;min-width:0;overflow:hidden;transition:transform .12s,box-shadow .15s,border-color .15s}
.em-carte::before{content:"";position:absolute;left:0;top:0;bottom:0;width:6px;background:var(--uc)}
.em-carte.campe{border-color:color-mix(in srgb,var(--uc) 30%,var(--ligne));background:linear-gradient(180deg,color-mix(in srgb,var(--uc) 7%,white),#fff 55%)}
.em-carte:hover{transform:translateY(-2px);box-shadow:var(--ombre-2)}
.em-carte:focus-visible{outline:3px solid color-mix(in srgb,#3D6B4F 50%,white);outline-offset:2px}
.em-c-haut{display:flex;align-items:center;justify-content:space-between;gap:8px}
.em-type{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--encre-3)}
.em-type .ic{width:15px;height:15px;color:#3D6B4F}
.em-etoile{display:inline-flex;align-items:center;gap:3px;background:var(--uc);color:#fff;border-radius:999px;padding:3px 8px 3px 6px;font-weight:800;font-size:12px;box-shadow:0 2px 6px color-mix(in srgb,var(--uc) 40%,transparent)}
.em-etoile .ic{width:14px;height:14px;fill:currentColor}
.em-carte h3{font-size:17px;font-weight:800;line-height:1.25;overflow-wrap:anywhere}
.em-lieu{margin:0;display:flex;align-items:flex-start;gap:5px;color:var(--encre-2);font-weight:700;font-size:13.5px}
.em-lieu .ic{width:15px;height:15px;margin-top:2px;color:#B4552E;flex:none}
.em-lieu.manque{color:var(--encre-3);font-style:italic}
.em-infos{display:flex;flex-wrap:wrap;gap:6px}
.em-i{display:inline-flex;align-items:center;gap:5px;background:#F5F0E6;color:var(--encre-2);border-radius:8px;padding:3px 8px;font-weight:800;font-size:12.5px;max-width:100%}
.em-i .ic{width:14px;height:14px;flex:none}
.em-i.prix{background:#EAF2EC;color:#2F5A41}
.em-contact{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-top:auto;padding-top:6px;font-size:13px}
.em-nom-c{font-weight:700;color:var(--encre);flex-basis:100%;overflow-wrap:anywhere}
.em-tel{display:inline-flex;align-items:center;gap:5px;border:1.5px solid #CFE1D4;color:#2F5A41;background:#fff;border-radius:999px;padding:4px 10px;font-weight:800;font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap}
.em-tel .ic{width:14px;height:14px}
.em-tel:hover{background:#EAF2EC;border-color:#9EC5AA}
.em-autres{font-weight:800;color:var(--encre-3);font-size:12.5px}
.em-dernier{display:flex;align-items:flex-start;gap:6px;border-top:1px dashed color-mix(in srgb,var(--uc) 35%,var(--ligne));padding-top:8px;margin-top:2px;font-size:12.5px;color:var(--encre-2)}

.em-dernier b{color:var(--uc)}
.em-plus{text-align:center;margin:18px 0 6px}
.em-reste{color:var(--encre-3);font-weight:700}

.em-camps li:first-child{border-top:0;background:color-mix(in srgb,var(--uc) 6%,white)}
.em-camps li>i{width:12px;height:12px;border-radius:50%;background:var(--uc)}
.em-camps li b{color:var(--uc)}
.em-camps small{display:block;color:var(--encre-3);font-weight:600;font-size:12.5px}
.em-d-meta{margin:0;color:var(--encre-3);font-size:12.5px;font-weight:600}
.em-rouge{color:var(--rouge);font-weight:800}
.btn.rouge-t{color:var(--rouge);border-color:#F1C4C2}
.btn.rouge-t:hover{background:var(--rouge-clair);border-color:var(--rouge)}
/* formulaire */
.em-fs{border:1.5px solid var(--ligne);border-radius:16px;padding:12px 14px 14px;margin:0;display:flex;flex-direction:column;gap:12px;min-width:0}
.em-fs legend{display:inline-flex;align-items:center;gap:7px;font-weight:800;font-size:13.5px;color:var(--encre);padding:0 6px}
.em-fs legend .ic{width:17px;height:17px;color:#3D6B4F}
.em-r3{grid-template-columns:minmax(0,1fr) minmax(0,1fr) auto;align-items:end}
.em-int{padding:10px 12px;white-space:nowrap}
.em-prix{display:grid;grid-template-columns:minmax(0,1fr) 78px;gap:6px}
.em-par{display:flex;flex-wrap:wrap}
.em-par button{flex:1;padding:9px 10px}
.em-par button:disabled{opacity:.45;cursor:not-allowed}
.em-tels-ap{display:flex;flex-wrap:wrap;gap:6px}
.em-tels-ap:empty{display:none}
.em-tels-ap .tag .ic{width:13px;height:13px}
.em-frais{display:flex;gap:6px;align-items:flex-start;margin:0;font-size:12.5px;color:var(--encre-2)}
.em-frais .ic{width:15px;height:15px;flex:none;margin-top:1px}
.em-doublons{background:var(--jaune-clair);border:1px solid #F1D98A;border-radius:14px;padding:12px 14px;color:#6A4A00;font-size:13.5px}
.em-doublons b{display:inline-flex;align-items:center;gap:6px}
.em-doublons ul{margin:6px 0;padding-left:20px}
.em-doublons li span{color:#8A6200;font-weight:600}
.em-doublons p{margin:0;font-weight:700}
@media (max-width:1100px){ .em-filtres{grid-template-columns:repeat(3,minmax(0,1fr))} }
@media (max-width:640px){
  .em-tete-carte{padding:16px 14px 12px}
  .em-titre h2{font-size:19px}
  .em-boutons{width:100%;flex-wrap:nowrap}
  .em-boutons .btn.primaire{flex:1;min-width:0}
  .em-f-btn{display:inline-flex;padding:10px 12px}
  .em-f-btn span{display:none}
  .em-tete-carte:not(.ouvert) .em-filtres,.em-tete-carte:not(.ouvert) .em-legende{display:none}
  .em-tete-carte.ouvert .em-f-btn{background:#EAF2EC;border-color:#9EC5AA}
  .rangee.em-r3.em-r-prix{grid-template-columns:1fr}
  .em-r-prix .em-int{grid-column:auto}
  .em-boutons .btn.fantome span{display:none}
  .em-filtres{grid-template-columns:repeat(2,minmax(0,1fr))}
  .em-filtres .em-f:first-child{grid-column:1/-1}
  .em-grille{grid-template-columns:1fr}
  .em-d-grille{grid-template-columns:1fr}
  .em-r3{grid-template-columns:1fr 1fr}
  .em-r3 .em-int{grid-column:1/-1}
  .em-legende{font-size:12px}
}
</style>
</head>

const nf2 = new Intl.NumberFormat('fr-FR',{minimumFractionDigits:2, maximumFractionDigits:2});
const nf0 = new Intl.NumberFormat('fr-FR',{maximumFractionDigits:0});

function argent(v, dev){ v = Number(v)||0; return dev === 'LBP' ? nf0.format(v)+' L.L.' : '$ '+nf2.format(v); }
function signe(v, dev){ return (v < 0 ? '− ' : '+ ') + argent(Math.abs(v), dev); }
function pad(n){ return String(n).padStart(2,'0'); }
function aujourdhui(){ const d = new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function isoPlus(j){ const d = new Date(Date.now()+j*864e5); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function dIso(iso){ const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(iso||''); return m ? new Date(+m[1], +m[2]-1, +m[3]) : null; }
function dateCourte(iso){ const d = dIso(iso); return d ? pad(d.getDate())+'/'+pad(d.getMonth()+1)+'/'+d.getFullYear() : '—'; }
function dateHeure(s){ if(!s) return '—'; const d = dIso(s); if(!d) return esc(s); const h = /^\d{2}:\d{2}$/.test(String(s).slice(11,16)) ? String(s).slice(11,16) : ''; return dateCourte(s)+(h ? ' · '+h : ''); }
function moisLong(ym){ const [y,m] = ym.split('-'); const t = new Date(+y, +m-1, 1).toLocaleDateString('fr-FR',{month:'long', year:'numeric'}); return t.charAt(0).toUpperCase()+t.slice(1); }
function joursAvant(iso){ const d = dIso(iso); if(!d) return null; const a = dIso(aujourdhui()); return Math.round((d - a)/864e5); }
function pluriel(n, s, p){ return n+' '+(n > 1 ? (p || s+'s') : s); }

function api(fn){
  const args = Array.prototype.slice.call(arguments, 1);
  return new Promise((ok, ko) => {
    if(REGLAGES.maitrise && fn !== 'connexion' && fn !== 'sessionEtat' && fn !== 'accesLibres'){
      // Maîtrise : tout passe par « appel », avec le jeton de la session
      const run = google.script.run.withSuccessHandler(ok).withFailureHandler(e => {
        if(/SESSION_EXPIREE/.test(msgErr(e))){
          const avait = !!S.session;
          if(avait) sessionPerdue(); else majLibres();
          ko(new Error(avait ? 'Votre connexion a expiré : reconnectez-vous.' : 'Cette section demande maintenant une connexion.'));
        }
        else { if(/Connexion requise|Accès refusé/.test(msgErr(e))) majLibres(); ko(e); }     // l'administrateur a peut-être refermé une section
      });
      run.appel(S.session ? S.session.jeton : '', fn, args);
      return;
    }
    const run = google.script.run.withSuccessHandler(ok).withFailureHandler(ko);
    run[fn].apply(run, args);
  });
}

function pins(w, h, n, seed){
  let s = seed || 7; const rnd = () => (s = (s*9301+49297)%233280)/233280;
  let out = '';
  for(let i = 0; i < n; i++){
    const x = (i+.5)*(w/n) + (rnd()-.5)*(w/n)*.6, th = h*(.45+rnd()*.55), bw = th*.42, base = h;
    for(let k = 0; k < 3; k++){
      const top = base - th + k*th*.26, bot = base - th*.18 + k*th*.06 - (2-k)*th*.16, ww = bw*(.55+k*.28);
      out += '<polygon points="'+x.toFixed(1)+','+top.toFixed(1)+' '+(x-ww/2).toFixed(1)+','+bot.toFixed(1)+' '+(x+ww/2).toFixed(1)+','+bot.toFixed(1)+'"/>';
    }
    out += '<rect x="'+(x-2).toFixed(1)+'" y="'+(base-th*.2).toFixed(1)+'" width="4" height="'+(th*.2).toFixed(1)+'"/>';
  }
  return '<svg viewBox="0 0 '+w+' '+h+'" preserveAspectRatio="none" fill="#fff">'+out+'</svg>';
}
function fondTopo(){
  const c = '#B99A6B'; let p = '';
  const cont = (cx, cy, rx, ry, n, rot) => { for(let i = 1; i <= n; i++){ const k = i/n; p += '<ellipse cx="'+cx+'" cy="'+cy+'" rx="'+(rx*k)+'" ry="'+(ry*k*(1+Math.sin(i)*.08))+'" transform="rotate('+(rot+i*4)+' '+cx+' '+cy+')"/>'; } };
  cont(120, 140, 170, 110, 6, -12); cont(520, 470, 190, 130, 7, 18); cont(560, 80, 110, 70, 4, 30); cont(90, 560, 120, 80, 4, -25);
  for(let i = 0; i < 5; i++) p += '<path d="M-20 '+(300+i*16)+' C 120 '+(250+i*14)+', 240 '+(360+i*12)+', 380 '+(300+i*15)+' S 560 '+(250+i*10)+', 700 '+(310+i*14)+'"/>';
  const svg = '<svg xmlns="http://www.w3.org/2000/svg" width="680" height="680" viewBox="0 0 680 680"><g fill="none" stroke="'+c+'" stroke-opacity=".16" stroke-width="1.1">'+p+'</g></svg>';
  document.body.style.backgroundImage = 'url("data:image/svg+xml,'+encodeURIComponent(svg)+'")';
}

  o = o || {};   // par défaut : confirmation d'une suppression (rouge). o = {icone, classe, couleur} pour une action sans danger.

    let fait = false;
    const m = ouvrirModal({titre:titre, icone:o.icone || 'alerte', couleur:o.couleur || 'var(--rouge)',
      corps:'<p class="confirm-msg">'+message+'</p><div class="actions"><button class="btn fantome" data-act="fermer">Annuler</button><button class="btn '+(o.classe || 'rouge')+'" id="ok-confirm">'+ic(o.icone || 'poubelle')+' '+esc(libelle||'Supprimer')+'</button></div>',
      onFermer:() => { if(!fait) res(false); }});
    $('#ok-confirm', m).onclick = () => { fait = true; fermerModal(); res(true); };
  });
}

function aller(id){
  const espace = v => v === 'suivi' || v.indexOf('u-') === 0;
  const changeEspace = REGLAGES.maitrise && espace(id) !== espace(S.vue || 'accueil');
  S.vue = id;

  if(changeEspace) construireNav();        // téléphone : la barre du bas suit l'espace (notre travail / suivi des unités)
  $$('.vue').forEach(v => { v.hidden = v.id !== 'vue-'+id; if(v.hidden && $('.login', v)) v.innerHTML = ''; });   // un seul formulaire de connexion à la fois
  $$('[data-nav]').forEach(b => b.classList.toggle('actif', b.dataset.nav === id));
  const bn = $('#bottomnav'), ba = bn && bn.classList.contains('defile') ? $('button.actif', bn) : null;
  if(ba) bn.scrollTo({left:Math.max(0, ba.offsetLeft - (bn.clientWidth - ba.offsetWidth) / 2), behavior:'smooth'});
  window.scrollTo(0, 0);
  rendre(id, true);
}
function rendre(id, charger){
  if(REGLAGES.maitrise && id !== 'accueil'){
    if(id === 'suivi') return rendreSuivi();                           // les sections du suivi des unités
    if(!ouvert(id)) return rendreConnexion(id);                       // verrouillé : formulaire de connexion
    if(id === 'admin') return rendreAdmin(charger);
    if(id.indexOf('u-') === 0) return rendreUnites(id.slice(2));      // suivi des unités (lecture seule)
  }
  if(id === 'accueil'){ rendreAccueil(); if(charger) chargerAccueil(); }
  else if(id === 'tresorier'){ rendreTresorier(); if(charger && !S.treso) chargerTreso(); if(charger && S.trOnglet === 'coop' && !S.coop) chargerCoop(); if(charger && S.trOnglet === 'cotisation' && !S.cot) chargerCot(); }
  else if(id === 'secretaire'){ rendreSecretaire(); if(charger && !S.secr) chargerSecr(); }
  else if(id === 'cuisinier'){ rendreCuisinier(); if(charger && !S.recettes) chargerRecettes(); }
  else if(id === 'materiel'){ rendreInventaire('materiel'); if(charger && !S.inv.materiel) chargerInv('materiel'); if(charger && REGLAGES.bois && S.matOnglet === 'bois' && !S.bois) chargerBois(); }

/* ---- Événements : les opérations d'un même événement (ex. « Camp HP ») sont regroupées ---- */
/** [{nom, ops, e, d, n, du, au, journees}] du plus récent au plus ancien (ops déjà triées du plus récent au plus ancien). */
function evenementsDe(ops){
  const g = {}, ordre = [];
  ops.forEach(o => { if(!o.evenement) return; const k = norm(o.evenement); if(!g[k]){ g[k] = {nom:o.evenement, ops:[]}; ordre.push(k); } g[k].ops.push(o); });
  return ordre.map(k => { const x = g[k], som = n => x.ops.filter(o => o.nature === n).reduce((s, o) => s + o.montant, 0), dates = x.ops.map(o => o.date).filter(Boolean).sort();
    return Object.assign(x, {e:som('Entrée'), d:som('Dépense'), n:x.ops.length, du:dates[0] || '', au:dates[dates.length-1] || '', journees:Array.from(new Set(x.ops.map(o => o.journee)))}); });
}
function periodeEv(x){ return x.du === x.au ? dateCourte(x.du) : dateCourte(x.du)+' → '+dateCourte(x.au); }
function sousEvenements(evs, dev){
  if(!evs.length) return '';
  return '<div class="ev-sous">'+evs.slice(0, 4).map(x => '<span>'+ic('drapeau')+esc(x.nom)+' <b class="'+(x.e - x.d < 0 ? 'moins-c' : 'plus-c')+'">'+signe(x.e - x.d, dev)+'</b></span>').join('')+(evs.length > 4 ? '<span class="sous">+ '+(evs.length - 4)+' autre'+(evs.length > 5 ? 's' : '')+'</span>' : '')+'</div>';
}
/** Carte « Événements » : bilan de chacun ; un clic l'affiche dans le journal. */
function carteEvenements(evs, dev, act){
  return '<div class="carte mt"><div class="carte-titre"><h2>'+ic('drapeau')+'Événements</h2><span class="sous">Toutes les entrées et dépenses d’un même événement, ensemble</span></div><div class="evs">'+
    evs.map(x => '<button class="ev-carte" data-act="'+act+'" data-v="'+esc(x.nom)+'"><div class="ev-t"><b>'+esc(x.nom)+'</b>'+x.journees.map(tagJournee).join('')+'</div>'+
      '<div class="ev-bilan '+(x.e - x.d < 0 ? 'moins-c' : 'plus-c')+'">'+signe(x.e - x.d, dev)+'</div>'+
      '<div class="ev-l"><span><i class="pt e"></i>'+argent(x.e, dev)+'</span><span><i class="pt d"></i>'+argent(x.d, dev)+'</span></div>'+
      '<div class="sous">'+pluriel(x.n, 'opération')+' · '+periodeEv(x)+'</div></button>').join('')+'</div></div>';
}
/** Lignes du journal : une ligne par opération, ou une ligne repliable par événement. */
function lignesJournal(l, ouverts, ligneOp, actEv, dev){
  const vus = {}, out = [];
  l.forEach(o => {
    if(!o.evenement){ out.push(ligneOp(o, false)); return; }
    const k = norm(o.evenement); if(vus[k]) return; vus[k] = true;
    const x = evenementsDe(l.filter(v => v.evenement && norm(v.evenement) === k))[0], ouvert = !!ouverts[k], net = x.e - x.d;
    out.push('<tr class="ev-ligne'+(ouvert ? ' ouvert' : '')+'" data-act="'+actEv+'" data-ev="'+esc(k)+'"><td class="nowrap">'+periodeEv(x)+'</td>'+
      '<td><div class="cellule-t">'+ic('drapeau')+esc(x.nom)+'</div><div class="sous">'+pluriel(x.n, 'opération')+' · '+(ouvert ? 'cliquez pour replier' : 'cliquez pour voir le détail')+'</div></td>'+
      '<td><div class="puces">'+x.journees.map(tagJournee).join('')+'</div></td><td class="hide-m"><span class="plus-c">+ '+argent(x.e, dev)+'</span> · <span class="moins-c">− '+argent(x.d, dev)+'</span></td>'+

    if(ouvert) x.ops.forEach(v => out.push(ligneOp(v, true)));
  });
  return out.join('');
}

/* ---- Photos de la fiche : réduites dans le navigateur (1600 px, JPEG) avant l'envoi ---- */
const PHOTOS_MAX = 12, PHOTO_COTE = 1600;
S.photos = []; S.photosEnCours = 0;
function rendrePhotos(){
  const z = $('#photos-fiche'); if(!z) return;
  z.innerHTML = S.photos.map((ph, i) => '<div class="photo"><img src="'+ph.apercu+'" alt="Photo '+(i+1)+'"><button type="button" class="icone-btn danger" data-act="photo-suppr" data-i="'+i+'" aria-label="Retirer la photo">'+ic('x')+'</button>'+
    '<input type="text" class="photo-leg" data-i="'+i+'" maxlength="150" placeholder="Légende (facultatif)" value="'+esc(ph.legende)+'"></div>').join('')+
    (S.photosEnCours ? '<div class="photo attente"><span class="spin"></span><span class="sous">Préparation…</span></div>' : '');
  $$('.photo-leg', z).forEach(i => i.oninput = () => { const ph = S.photos[Number(i.dataset.i)]; if(ph) ph.legende = i.value; });
}
function lirePhoto(fichier){
  return new Promise((ok, ko) => {
    const url = URL.createObjectURL(fichier), img = new Image();
    img.onload = () => {
      try {
        const k = Math.min(1, PHOTO_COTE / Math.max(img.naturalWidth, img.naturalHeight));
        const w = Math.max(1, Math.round(img.naturalWidth * k)), h = Math.max(1, Math.round(img.naturalHeight * k));
        const c = document.createElement('canvas'); c.width = w; c.height = h;
        const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, w, h); g.drawImage(img, 0, 0, w, h);
        const data = c.toDataURL('image/jpeg', 0.82);
        const pt = document.createElement('canvas'), kp = 240 / Math.max(w, h); pt.width = Math.round(w * kp); pt.height = Math.round(h * kp);
        pt.getContext('2d').drawImage(c, 0, 0, pt.width, pt.height);
        ok({data:data.slice(data.indexOf(',') + 1), type:'image/jpeg', legende:'', apercu:pt.toDataURL('image/jpeg', 0.7)});
      } catch(e){ ko(e); } finally { URL.revokeObjectURL(url); }
    };
    img.onerror = () => { URL.revokeObjectURL(url); ko(new Error('format')); };
    img.src = url;
  });
}
async function ajouterPhotos(fichiers){
  const place = PHOTOS_MAX - S.photos.length - S.photosEnCours;
  if(place <= 0) return toast(PHOTOS_MAX+' photos au plus par fiche.', 'erreur');
  if(fichiers.length > place) toast('Seulement '+pluriel(place, 'photo')+' de plus : les autres sont ignorées.', 'erreur');
  for(const fi of fichiers.slice(0, place)){
    S.photosEnCours++; rendrePhotos();
    try { S.photos.push(await lirePhoto(fi)); }
    catch(e){ toast('« '+fi.name+' » ne peut pas être lue (format non pris en charge).', 'erreur'); }
    S.photosEnCours--; rendrePhotos();
  }
}

/** Le total de chaque article sur toutes les listes, avec la quantité dans chaque liste. */
function totauxInv(d, articles){
  const g = {}, ordre = [];
  articles.forEach(a => { const k = norm(a.article);
    if(!g[k]){ g[k] = {article:a.article, type:a.type, unites:[], total:0, listes:[]}; ordre.push(k); }
    const x = g[k]; x.total += Number(a.quantite) || 0; if(a.unite && x.unites.indexOf(a.unite) < 0) x.unites.push(a.unite);
    x.listes.push({liste:a.liste, q:Number(a.quantite) || 0, unite:a.unite}); });
  return ordre.map(k => g[k]).map(x => Object.assign(x, {listes:x.listes.sort((a, b) => d.listes.indexOf(a.liste) - d.listes.indexOf(b.liste))}))
    .sort((a, b) => a.article.localeCompare(b.article, 'fr'));
}

function majLigneLot(cle, l, cible){
  const nom = norm($('.l-art', l).value), ex = nom ? articlesLot(cle).find(a => norm(a.article) === nom) : null;
  const ailleurs = nom && !ex ? S.inv[cle].articles.filter(a => norm(a.article) === nom) : [];      // connu dans d'autres listes
  const modele = ex || ailleurs[0];
  if(cible && cible.classList.contains('l-art') && modele){
    $('.l-type', l).value = modele.type;
    if(!$('.l-u', l).value) $('.l-u', l).value = modele.unite || '';
    if(ex && $('.l-exp', l) && !$('.l-exp', l).value) $('.l-exp', l).value = ex.expiration || '';
  }
  const qv = $('.l-q', l).value.trim(), diff = $('.diff', l);
  l.classList.remove('plus','moins');
  let st = '';
  if(!nom){ diff.className = 'diff'; diff.textContent = ''; }
  else if(!ex && ailleurs.length){ st = 'nouveau'; diff.className = 'diff nouveau'; diff.textContent = 'Nouveau dans cette liste · ailleurs : '+ailleurs.map(a => a.liste+' '+nfq.format(a.quantite)).join(', '); }
  else if(!ex){ st = 'nouveau'; diff.className = 'diff nouveau'; diff.textContent = 'Nouvel article'; }
  else if(qv === '' || isNaN(Number(qv))){ diff.className = 'diff egal'; diff.textContent = 'Actuel : '+nfq.format(ex.quantite); }
  else {
    const v = Number(qv) - ex.quantite;
    if(v > 0){ st = 'plus'; diff.className = 'diff plus'; diff.textContent = '+'+nfq.format(v)+' en plus ('+nfq.format(ex.quantite)+' → '+nfq.format(Number(qv))+')'; }
    else if(v < 0){ st = 'moins'; diff.className = 'diff moins'; diff.textContent = '−'+nfq.format(-v)+' en moins ('+nfq.format(ex.quantite)+' → '+nfq.format(Number(qv))+')'; }
    else { st = 'egal'; diff.className = 'diff egal'; diff.textContent = 'Inchangé ('+nfq.format(ex.quantite)+')'; }
  }
  if(st === 'plus' || st === 'moins') l.classList.add(st);
  l.dataset.st = st;
}
function resumeLot(){

function anneeDe(iso){ const d = dIso(iso); return d ? anneeScoute(d) : ''; }
/** Statistiques d'une liste de services (chaque participant compte une participation). */
function servCalc(l, membres){
  const parMembre = {}, parUnite = {}, parMois = {}, parType = {};
  l.forEach(sv => {
    parUnite[sv.unite] = parUnite[sv.unite] || {n:0, p:0}; parUnite[sv.unite].n++; parUnite[sv.unite].p += sv.participants.length;
    parType[sv.type] = parType[sv.type] || {n:0, p:0}; parType[sv.type].n++; parType[sv.type].p += sv.participants.length;
    const mo = sv.date.slice(0, 7); parMois[mo] = (parMois[mo] || 0) + 1;
    sv.participants.forEach(nom => { const k = norm(nom); const x = parMembre[k] = parMembre[k] || {nom:nom, n:0, der:'', unites:{}}; x.n++; if(sv.date > x.der) x.der = sv.date; x.unites[sv.unite] = (x.unites[sv.unite] || 0) + 1; });
  });
  const eq = {}; membres.forEach(m => { eq[norm(m.nom)] = m.unite; });
  const classement = Object.values(parMembre).map(x => Object.assign(x, {equipe:eq[norm(x.nom)] || ''})).sort((a, b) => b.n - a.n || b.der.localeCompare(a.der) || a.nom.localeCompare(b.nom, 'fr'));

/* =================================================================
 *  SECRÉTAIRE › PRÉSENCES  (libellés et options pilotés par les RÉGLAGES de Code.gs)
 * ================================================================= */
const COUL_PAT = ['#D99A00','#55626B','#D2601A','#2E7D4F','#2F6E8F','#C8161D','#7A5230','#8A4FA0'];
function anneeScoute(dt){ dt = dt || new Date(); const y = dt.getFullYear(); return dt.getMonth() >= 8 ? y+'-'+(y+1) : (y-1)+'-'+y; }
function trimestreDe(dt){ dt = dt || new Date(); const m = dt.getMonth(); return m >= 8 ? 1 : m <= 2 ? 2 : 3; }
Object.assign(S, {secOnglet:'fiches', pres:null, presPer:{annee:anneeScoute(), trimestre:trimestreDe()}, presOnglet:'appel', appel:null, mDraft:null, mSale:false, statTri:'unite', statType:'', statPour:'', presJeton:0});
const CFG = () => (S.pres && S.pres.config) || {unites:[], uniteNom:'patrouille', unitePluriel:'patrouilles', uniteTitre:'Patrouille', roles:[], rolesPar:null, uniques:[], restreintes:[], responsables:'', distinction:'', parUnite:false, ensemble:'Troupe', types:['Réunion','Camp','Journée']};
/** Rôles permis dans ce sous-groupe (Maîtrise : CG / ACG / EA pour le Groupe, CU / ACU pour les unités). */
function rolesDe(unite){ const c = CFG(); if(!c.rolesPar) return c.roles; return Object.prototype.hasOwnProperty.call(c.rolesPar, unite) ? c.rolesPar[unite] : (c.rolesPar['*'] || []); }
function roleEstUnique(r){ return (CFG().uniques || []).indexOf(r) >= 0; }
/** Réunion où seuls certains rôles sont attendus (HP, SI / SE, Conseil des chefs…), ou null. */
function restreinte(pour){ return pour ? ((CFG().restreintes || []).find(x => x.nom === pour) || null) : null; }
function libRestreinte(x){ return x.nom === x.roles.join(' / ') || x.nom.replace(/\s/g,'') === x.roles.join('/') ? x.nom : x.nom+' ('+x.roles.join(', ')+')'; }
const cap = s => s.charAt(0).toUpperCase()+s.slice(1);
function coulPat(p){ const l = (S.pres && S.pres.config.unites) || (S.prog && S.prog.unites) || []; const i = l.indexOf(p); return COUL_PAT[(i < 0 ? l.length : i) % COUL_PAT.length]; }
function unitesDe(membres){ const l = CFG().unites.slice(); membres.forEach(m => { if(l.indexOf(m.unite) < 0) l.push(m.unite); }); return l; }
function ordreRole(r){ const i = CFG().roles.indexOf(r); return i < 0 ? 99 : i; }
const triMembres = (a, b) => ordreRole(a.role)-ordreRole(b.role) || a.nom.localeCompare(b.nom, 'fr');
function tagRole(r){ const i = CFG().roles.indexOf(r); return i < 0 ? '' : '<span class="tag role '+(i === 0 ? 'jaune' : '')+'">'+ic('etoile')+esc(r)+'</span>'; }
function tagDistinction(u){ const d = S.pres; return d && d.config.distinction && d.distinction === u ? '<span class="tag distinction">'+ic('etoile')+esc(d.config.distinction)+'</span>' : ''; }
function nomPour(pour){ const x = restreinte(pour); return x ? (/^r[ée]union/i.test(x.nom) || /conseil/i.test(x.nom) ? x.nom : 'Réunion '+x.nom) : pour ? pour : CFG().ensemble; }
function tagPour(r){ const c = CFG(); if(restreinte(r.pour)) return '<span class="tag restreinte">'+ic('etoile')+esc(nomPour(r.pour))+'</span>'; if(!c.parUnite) return ''; return '<span class="tag '+(r.pour ? '' : 'foret')+'" '+(r.pour ? 'style="background:color-mix(in srgb,'+coulPat(r.pour)+' 14%,white);color:'+coulPat(r.pour)+'"' : '')+'>'+ic(r.pour ? 'groupe' : 'boussole')+esc(nomPour(r.pour))+'</span>'; }
function tagType(r){ const c = CFG(); if(!c.parUnite) return ''; const j = JOURNEES.find(x => x.v === r.type) || JOURNEES[0]; return '<span class="tag '+(r.type === 'Camp' ? 'braise' : r.type === 'Journée' ? 'jaune' : 'vert')+'">'+ic(j.icone)+esc(r.type)+'</span>'; }
function pct(a, b){ return b ? a/b : null; }
function fPct(v){ return v == null ? '—' : Math.round(v*100)+' %'; }
function clsPct(v){ return v == null ? '' : v >= .75 ? 'bon' : v >= .5 ? 'moyen' : 'faible'; }
const coulV = v => clsPct(v) === 'faible' ? 'var(--rouge)' : clsPct(v) === 'moyen' ? 'var(--or)' : 'var(--vert)';
function jauge(v, coul){ return '<div class="piste"><div class="fond"><div class="rempli" style="width:'+(v == null ? 0 : Math.max(v > 0 ? 2 : 0, v*100)).toFixed(1)+'%;background:'+(coul || 'var(--vert)')+'"></div></div><span class="v pct '+clsPct(v)+'">'+fPct(v)+'</span></div>'; }
function dateLongue(iso){ const d = dIso(iso); if(!d) return '—'; const t = d.toLocaleDateString('fr-FR',{weekday:'long', day:'numeric', month:'long'}); return t.charAt(0).toUpperCase()+t.slice(1); }
function attendus(r){ const M = S.pres.membres, x = restreinte(r.pour); return x ? M.filter(m => x.roles.indexOf(m.role) >= 0) : r.pour ? M.filter(m => m.unite === r.pour) : M; }

  const d = S.pres, a = S.appel, c = d.config;
  if(!d.membres.length) return sansMembres();
  const unitesPresentes = unitesDe(d.membres).filter(u => d.membres.some(m => m.unite === u));
  const rs = c.restreintes || [];
  const choix = !c.parUnite && rs.length ?
      '<div class="appel-choix"><div class="champ"><span>Qui est attendu ?</span><div class="seg pour">'+
        '<button data-act="appel-pour" data-v="" class="'+(!a.pour ? 'actif' : '')+'">'+ic('boussole')+(/^[aeiouyéè]/i.test(c.ensemble) ? 'Toute l’' : 'Toute la ')+esc(c.ensemble)+'</button>'+

/* ---- Statistiques (chaque membre n'est compté que pour les activités où il était attendu) ---- */
function calcStats(){
  const d = S.pres, M = d.membres, R = d.reunions.filter(r => (!S.statType || r.type === S.statType) && (!S.statPour || (S.statPour === '_' ? !restreinte(r.pour) : r.pour === S.statPour)));
  const cpt = {}, att = {}; M.forEach(m => { cpt[m.id] = 0; att[m.id] = 0; });
  const reus = R.map(r => {
    const a = attendus(r), p = new Set(r.presents);
    let n = 0; a.forEach(m => { att[m.id]++; if(p.has(m.id)){ cpt[m.id]++; n++; } });
    return {r:r, n:n, N:a.length, v:pct(n, a.length)};
  });
  const groupe = l => { const n = l.reduce((s, m) => s + cpt[m.id], 0), max = l.reduce((s, m) => s + att[m.id], 0); return {n:n, max:max, v:pct(n, max)}; };
  const resp = M.filter(m => m.role !== 'Membre');
  return {nR:R.length, cpt:cpt, att:att, total:groupe(M), resp:groupe(resp), nResp:resp.length, reus:reus,
    unites:unitesDe(M).map(u => Object.assign({u:u, mem:M.filter(m => m.unite === u)}, groupe(M.filter(m => m.unite === u)))).filter(x => x.mem.length)};
}

function mMarquer(){ S.mSale = true; rendrePres(); }
function mAjouter(p){
  const i = $('#sec-presences [data-ajout="'+CSS.escape(p)+'"]'); if(!i) return;
  const noms = i.value.split(/[,\n]/).map(x => x.trim()).filter(Boolean); if(!noms.length) return i.focus();
  noms.forEach(nom => {
    if(S.mDraft.some(m => norm(m.nom) === norm(nom))) return toast('« '+nom+' » est déjà dans la liste.', 'erreur');
    S.mDraft.push({id:'', nom:nom, unite:p, role:'Membre'});
  });
  mMarquer();
  const n = $('#sec-presences [data-ajout="'+CSS.escape(p)+'"]'); if(n) n.focus();
}
function regleRoles(c){
  if(!c.roles.length) return '';
  let t;
  if(c.rolesPar){
    const grp = {}; Object.keys(c.rolesPar).forEach(g => { const k = c.rolesPar[g].join(', '); (grp[k] = grp[k] || []).push(g === '*' ? 'les autres' : g); });
    t = Object.keys(grp).filter(Boolean).map(k => cap(grp[k].join(', '))+' : '+k).join(' · ')+'.'+(c.uniques.length ? ' Un seul '+c.uniques.join(' et un seul ')+' par '+c.uniteNom+'.' : '');
  } else t = 'Chaque '+c.uniteNom+' a un seul '+c.roles.join(' et un seul ')+'.';
  return t+(c.responsables ? ' Le % « '+c.responsables+' » compte les '+c.roles.join(' et ')+'.' : '');
}
function roleUnique(i){
  const m = S.mDraft[i]; if(m.role === 'Membre' || !roleEstUnique(m.role)) return;
  S.mDraft.forEach((x, j) => { if(j !== i && x.unite === m.unite && x.role === m.role){ x.role = 'Membre'; toast(x.nom+' n’est plus '+m.role+' ('+m.unite+').'); } });
}

function niv(){ return S.prog.config; }
function etatMembre(m){
  const P = niv(), s = m.suivi || {}, badgesOk = new Set(S.prog.badges.map(b => b.id));
  const maxDate = cles => cles.reduce((a, k) => s[k] && s[k] > a ? s[k] : a, '');
  const cP = Array.from({length:P.PROMESSE.etapes}, (_, i) => 'P:'+(i+1)), nP = cP.filter(k => s[k]).length, promOk = nP === cP.length;
  const c2 = Array.from({length:P.DEUXIEME.etapes}, (_, i) => 'C2:'+(i+1)), n2 = c2.filter(k => s[k]).length, deuxOk = promOk && n2 === c2.length;
  const choix = P.PREMIERE.parties.map((_, i) => i).filter(i => s['C1C:'+i]).slice(0, P.PREMIERE.partiesAChoisir);
  const c1 = []; choix.forEach(i => { for(let e = 1; e <= P.PREMIERE.etapesParPartie; e++) c1.push('C1:'+i+':'+e); });
  const total1 = P.PREMIERE.partiesAChoisir * P.PREMIERE.etapesParPartie, n1 = c1.filter(k => s[k]).length;
  const premOk = deuxOk && choix.length === P.PREMIERE.partiesAChoisir && n1 === total1;
  const raider = premOk && !!s.RAIDER;
  const badges = promOk ? Object.keys(s).filter(k => k.startsWith('B:') && badgesOk.has(k.slice(2))) : [];
  const niveau = !promOk ? {cle:'PROMESSE', reste:cP.length - nP, fait:nP, total:cP.length}
    : !deuxOk ? {cle:'DEUXIEME', reste:c2.length - n2, fait:n2, total:c2.length}
    : !premOk ? {cle:'PREMIERE', reste:total1 - n1, fait:n1, total:total1}
    : !raider ? {cle:'RAIDER', reste:1, fait:0, total:1} : {cle:'COMPLET', reste:0, fait:1, total:1};
  const pts = P.POINTS;
  return {nP, n2, n1, total1, choix, promOk, deuxOk, premOk, raider, badges, niveau,
    dates:{promesse: promOk ? maxDate(cP) : '', deuxieme: deuxOk ? maxDate(c2) : '', premiere: premOk ? maxDate(c1) : '', raider: raider ? s.RAIDER : ''},
    points:(promOk ? pts.promesse : 0) + (deuxOk ? pts.deuxieme : 0) + (premOk ? pts.premiere : 0) + (raider ? pts.raider : 0) + badges.length * pts.badge};
}

function progModifierLot(m, lot){

  if(S.progEnvoi) { S.progTimer = setTimeout(progEnvoyer, 500); return; }
  const q = S.progQ.splice(0); if(!q.length) return;
  S.progEnvoi = true; majProgEtat('Enregistrement…');
  try { await api('progressionEnregistrer', q); majProgEtat(S.progQ.length ? 'Modifications en attente…' : 'Enregistré ✓ '+new Date().toLocaleTimeString('fr-FR',{hour:'2-digit', minute:'2-digit'})); }
  catch(e){ erreur(e); majProgEtat('Erreur — rechargement'); S.prog = null; rendreProg(); chargerProg(); }
  finally { S.progEnvoi = false; }
}
window.addEventListener('beforeunload', e => { if(S.progQ && S.progQ.length){ progEnvoyer(); e.preventDefault(); e.returnValue = ''; } });

/** Mots et réglages du catalogue : badges (Troupe) ou brevets (Meute). */
function motsCat(){
  const P = niv();
  if(estMeute()) return {un:'brevet', Un:'Brevet', pl:'brevets', couleur:P.BREVETS.couleur, cats:catsBrevets(), titreSans:P.BREVETS.nom};
  return {un:'badge', Un:'Badge', pl:'badges', couleur:P.BADGES.couleur, cats:P.BADGES.categories, titreSans:P.BADGES.nom};
}
function vueProgCatalogue(){
  const d = S.prog, W = motsCat(), sansCat = W.cats.length === 1 && W.cats[0] === '';
  const detenus = {}; d.membres.forEach(m => Object.keys(m.suivi).forEach(k => { if(k.startsWith('B:')) detenus[k.slice(2)] = (detenus[k.slice(2)] || 0) + 1; }));
  return '<div class="carte m-tete"><div><b>Catalogue des '+W.pl+'</b><div class="sous">Ajoutez les '+W.pl+(sansCat ? '' : ' de chaque catégorie')+'. Ils apparaissent ensuite dans la fiche de chaque membre. Tapez un nom puis Entrée ; plusieurs à la fois en les séparant par des virgules.'+(sansCat ? ' Le chiffre à droite indique combien de membres l’ont obtenu.' : '')+'</div></div></div>'+
    '<div class="patrouilles mt'+(sansCat ? ' une' : '')+'">'+W.cats.map((c, i) => {

async function badgeAjouter(i){
  const W = motsCat(), c = W.cats[i], inp = $('[data-badge-ajout="'+i+'"]'); if(!inp) return;
  const noms = inp.value.split(',').map(x => x.trim()).filter(Boolean); if(!noms.length) return inp.focus();
  inp.disabled = true;
  try { for(const n of noms){ const r = await api('progressionBadgeEnregistrer', {categorie:c, nom:n}); S.prog.badges = r.badges; } toast(noms.length > 1 ? noms.length+' '+W.pl+' ajoutés.' : W.Un+' « '+noms[0]+' » ajouté.'); }
  catch(e){ erreur(e); }
  rendreProg(); const n = $('[data-badge-ajout="'+i+'"]'); if(n) n.focus();
}

/* =================================================================
 *  PROGRESSION DU CLAN : Jalons (icônes) + étapes qui s'ouvrent dans l'ordre
 * ================================================================= */
const JALONS_IMG = <?!= jalons ?>;
function estClan(){ return !!(S.prog && S.prog.config.type === 'clan'); }
function etatClan(m){
  const C = niv(), s = m.suivi || {}; let ouvert = true;
  const etapes = C.ETAPES.map((e, i) => { const o = ouvert, fait = o && !!s['E:'+e.cle]; ouvert = fait; return {def:e, i:i, ouvert:o, fait:fait, date: fait ? s['E:'+e.cle] : ''}; });
  const jalons = C.JALONS.map(j => ({def:j, fait:!!s['J:'+j.cle], date:s['J:'+j.cle] || ''}));
  const faits = etapes.filter(x => x.fait);
  return {etapes:etapes, jalons:jalons, nE:faits.length, nJ:jalons.filter(x => x.fait).length, dernier:faits[faits.length-1] || null, prochain:etapes.find(x => !x.fait) || null};
}
function ruban(couleurs){ const n = couleurs.length; return 'linear-gradient(90deg,'+couleurs.map((c, i) => c+' '+(i*100/n).toFixed(2)+'% '+((i+1)*100/n).toFixed(2)+'%').join(',')+')'; }
function coulEtape(def){ return def.couleurs.find(c => !/^#f{6}$/i.test(c)) || '#6B5B4B'; }
function resumeProg(m){
  if(estClan()){
    const e = etatClan(m);
    return (e.dernier ? '<span class="niv-pille" style="--nc:'+coulEtape(e.dernier.def)+'">'+esc(e.dernier.def.nom)+'</span>' : '<span class="niv-pille" style="--nc:#9A8A76">Aucune étape</span>')+(e.nJ ? '<span class="pl-b">'+ic('etoile')+e.nJ+'</span>' : '');
  }
  if(estMeute()){
    const e = etatMeute(m);
    return pilleStatutMeute(e)+(e.brevets.length ? '<span class="pl-b">'+ic('etoile')+e.brevets.length+'</span>' : '');
  }
  const e = etatMembre(m);
  return pilleNiveau(e)+(e.badges.length ? '<span class="pl-b">'+ic('etoile')+e.badges.length+'</span>' : '');
}
function ficheProgClan(m){

  const jalons = '<div class="carte mt"><div class="carte-titre"><h2 style="--c:var(--bois)">'+ic('etoile')+'Jalons</h2><span class="sous">'+e.nJ+' / '+C.JALONS.length+' obtenus</span></div>'+(Object.keys(JALONS_IMG).length ? '' : '<div class="note" style="margin-bottom:12px">Les icônes des Jalons ne sont pas installées : ajoutez le fichier HTML <b>Jalons</b> dans le programme (voir le guide), puis publiez une nouvelle version.</div>')+'<div class="jalons-g">'+

/* =================================================================
 *  PROGRESSION DE LA MEUTE : Promesse, 1ère étoile, 2ème étoile
 *  (une case par page du carnet) + Brevets de Capacité

function estMeute(){ return !!(S.prog && S.prog.config.type === 'meute'); }
function estClair(hex){ const m = /^#?([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i.exec(String(hex || '')); if(!m) return false; return (0.299*parseInt(m[1],16) + 0.587*parseInt(m[2],16) + 0.114*parseInt(m[3],16)) > 150; }
function pl(n, mot){ return n+' '+mot+(n > 1 ? 's' : ''); }
function etatMeute(m){
  const C = niv(), s = m.suivi || {}, ordre = C.DANS_L_ORDRE !== false;
  const connus = new Set(S.prog.badges.map(b => b.id));
  let avant = true;                                   // toutes les parties précédentes sont validées
  const parties = C.PARTIES.map((def, i) => {
    const cles = def.pages.map(p => def.cle+':'+p), n = cles.filter(k => s[k]).length;
    const ouvert = !ordre || avant, ok = ouvert && cles.length > 0 && n === cles.length;
    const x = {def:def, i:i, cles:cles, n:n, total:cles.length, ouvert:ouvert, ok:ok, date: ok ? cles.reduce((a, k) => s[k] > a ? s[k] : a, '') : ''};
    avant = avant && ok;
    return x;
  });
  const promOk = !!(parties[0] && parties[0].ok);
  let acquis = null; for(const x of parties){ if(!x.ok) break; acquis = x; }      // dernière partie validée, dans l'ordre
  const enCours = parties.find(x => !x.ok) || null;
  const brevetsOuverts = !ordre || promOk;
  const brevets = brevetsOuverts ? Object.keys(s).filter(k => k.startsWith('B:') && connus.has(k.slice(2))) : [];
  const points = parties.reduce((a, x) => a + (x.ok ? (Number(x.def.points) || 0) : 0), 0) + brevets.length * (Number(C.BREVETS.points) || 0);
  return {parties:parties, promOk:promOk, aspirant:!promOk, acquis:acquis, enCours:enCours, brevetsOuverts:brevetsOuverts, brevets:brevets, points:points};
}
function pilleStatutMeute(e){
  const C = niv();
  return e.aspirant ? '<span class="niv-pille" style="--nc:#8A7A68">'+esc(C.ASPIRANT || 'Aspirant')+'</span>'
    : '<span class="niv-pille" style="--nc:'+e.acquis.def.couleur+'">'+ic('check')+esc(e.acquis.def.nom)+'</span>';
}
function enCoursMeute(e){
  if(!e.enCours) return 'Parcours terminé';
  const r = e.enCours.total - e.enCours.n;
  return 'En cours : '+e.enCours.def.nom+' · '+pl(r, 'page')+' restante'+(r > 1 ? 's' : '');
}
function sectionNiv(o){
  const v = o.total ? o.fait/o.total : 0;
  return '<section class="niv '+(o.verrou ? 'verrouille' : '')+(o.date ? ' fini' : '')+(estClair(o.couleur) ? ' clair' : '')+'" style="--nc:'+o.couleur+'"><header class="niv-tete"><span class="niv-ic">'+ic(o.date ? 'check' : o.icone)+'</span><div class="niv-t"><h3>'+esc(o.titre)+'</h3><span class="sous">'+o.info+'</span></div>'+
    (o.date ? '<span class="niv-date">'+ic('calendrier')+'Validée le '+dateCourte(o.date)+'</span>' : (o.action && !o.verrou ? o.action : ''))+'</header>'+
    (o.total ? '<div class="niv-barre"><div style="width:'+(v*100).toFixed(1)+'%"></div></div>' : '')+
    (o.verrou ? '<div class="niv-verrou">'+ic('alerte')+esc(o.verrou)+'</div>' : '<div class="niv-corps">'+o.corps+'</div>')+'</section>';
}
function catsBrevets(){ const c = niv().BREVETS.categories || []; return c.length ? c : ['']; }
function ficheProgMeute(m){
  const C = niv(), e = etatMeute(m), s = m.suivi, B = C.BREVETS;

  const cats = catsBrevets(), parCat = {}; S.prog.badges.forEach(b => (parCat[b.categorie] = parCat[b.categorie] || []).push(b));
  const lien = '<a href="#" data-act="prog-onglet" data-v="catalogue">Catalogue des brevets</a>';

      : '<div class="b-cats">'+cats.map(c => { const l = parCat[c] || []; const n = l.filter(b => s['B:'+b.id]).length;
          return (c ? '<div class="b-cat"><div class="b-cat-t"><b>'+esc(c)+'</b><span class="sous">'+n+' / '+l.length+'</span></div>' : '<div class="b-cat">')+

        '<div class="sous" style="margin-top:4px">Pour ajouter un brevet : '+lien+'.</div></div>'
  });
  return tete+'<div class="niveaux">'+parties+brevets+'</div>';

/** Totaux par type : pièces, mètres, et détail par longueur (ou par état pour les palettes). */
function resumeBois(donnees){
  const d = donnees || S.bois, out = [];
  d.typesBois.concat([d.palette]).forEach(t => {
    const pal = t === d.palette, par = new Map();
    d.lignes.filter(l => l.type === t && l.quantite > 0).forEach(l => { const k = pal ? l.etat : l.longueur; par.set(k, (par.get(k) || 0) + l.quantite); });
    const detail = pal ? d.etats.filter(e => par.has(e)).map(e => ({cle:e, n:par.get(e)})) : Array.from(par.keys()).sort((a, b) => a - b).map(k => ({cle:k, n:par.get(k)}));
    out.push({type:t, palette:pal, detail:detail, pieces:detail.reduce((a, x) => a + x.n, 0), metres:pal ? 0 : detail.reduce((a, x) => a + x.cle * x.n, 0)});
  });
  return out;
}

function rendreBois(){ const c = $('#bois-corps'); if(c){ c.innerHTML = vueBois(); initBois(); } }
function initBois(){
  const f = $('#f-bois'); if(!f) return;
  f.onsubmit = async ev => {
    ev.preventDefault();
    const d = S.bois, pal = S.boisType === d.palette;
    const x = {type:S.boisType, quantite:Number(f.quantite.value), remarque:f.remarque.value.trim()};
    if(pal) x.etat = S.boisEtat; else x.longueur = Number(String(f.longueur.value).replace(',', '.'));
    if(!pal && !(x.longueur > 0)){ f.longueur.focus(); return toast('Indiquez la longueur en mètres.', 'erreur'); }
    if(!Number.isInteger(x.quantite) || x.quantite < 1){ f.quantite.focus(); return toast('Indiquez une quantité (nombre entier, au moins 1).', 'erreur'); }
    await chargement($('button[type=submit]', f), 'Enregistrement…', async () => {
      try { await boisEnvoyer(); const r = await api('boisAjouter', x); S.bois = r; rendreBois(); toast(r.message || 'Ajouté.'); }
      catch(e){ erreur(e); }
    });
  };
}
/* Boutons − / + : la quantité change tout de suite à l'écran, l'enregistrement est groupé. */
function boisMvt(id, delta){
  const l = S.bois.lignes.find(x => x.id === id); if(!l || l.quantite + delta < 0) return;
  l.quantite += delta;
  S.boisAttente[id] = (S.boisAttente[id] || 0) + delta;
  clearTimeout(S.boisTimer); S.boisTimer = setTimeout(boisEnvoyer, 700);
  rendreBoisGarde(); majBoisEtat('Modifications en attente…');
}
function rendreBoisGarde(){   // redessine en gardant ce qui est en cours de saisie dans le formulaire
  const f = $('#f-bois'), v = f ? {l:f.longueur ? f.longueur.value : '', q:f.quantite.value, r:f.remarque.value} : null;
  rendreBois();
  const n = $('#f-bois'); if(n && v){ if(n.longueur) n.longueur.value = v.l; n.quantite.value = v.q; n.remarque.value = v.r; }
}
function majBoisEtat(t){ S.boisEtat_ = t; const e = $('#bois-etat-envoi'); if(e) e.textContent = t; }
async function boisEnvoyer(){
  clearTimeout(S.boisTimer);
  if(S.boisEnvoi){ S.boisTimer = setTimeout(boisEnvoyer, 400); return; }
  const lot = S.boisAttente; S.boisAttente = {};
  const ids = Object.keys(lot).filter(id => lot[id] !== 0); if(!ids.length) return;
  S.boisEnvoi = true; majBoisEtat('Enregistrement…');
  try {
    let rep = null;
    for(const id of ids) rep = await api('boisMouvement', id, lot[id]);
    if(!Object.keys(S.boisAttente).length){ S.bois = rep; rendreBoisGarde(); }
    majBoisEtat(Object.keys(S.boisAttente).length ? 'Modifications en attente…' : 'Enregistré ✓');
  } catch(e){ erreur(e); S.boisAttente = {}; S.bois = null; rendreBois(); await chargerBois(); }
  finally { S.boisEnvoi = false; }
}
window.addEventListener('beforeunload', e => { if(Object.keys(S.boisAttente).some(k => S.boisAttente[k])){ boisEnvoyer(); e.preventDefault(); e.returnValue = ''; } });
function ouvrirBois(id){
  const d = S.bois, l = d.lignes.find(x => x.id === id); if(!l) return;
  const pal = l.type === d.palette;

        : '<label class="champ"><span>Longueur (en mètres) <span class="req">*</span></span><input type="number" name="longueur" min="0.05" step="any" inputmode="decimal" value="'+l.longueur+'"></label>')+
      '<label class="champ"><span>Quantité exacte <span class="req">*</span></span><input type="number" name="quantite" min="0" step="1" inputmode="numeric" value="'+l.quantite+'" autofocus></label>'+

      '<div class="actions"><button type="button" class="btn fantome" data-act="fermer">Annuler</button><button type="submit" class="btn bois grand">'+ic('check')+'Enregistrer</button></div></form>'});
  const f = $('#f-bois-m', m);
  f.onsubmit = async ev => {
    ev.preventDefault();

    if(f.quantite.value.trim() === '' || !Number.isInteger(x.quantite) || x.quantite < 0) return toast('Quantité invalide (nombre entier, 0 ou plus).', 'erreur');
    await chargement($('button[type=submit]', f), 'Enregistrement…', async () => {
      try { await boisEnvoyer(); S.bois = await api('boisModifier', id, x); fermerModal(); rendreBois(); toast('Ligne mise à jour.'); }
      catch(e){ erreur(e); }
    });
  };
}

    '<button class="onglet onglet-coop '+(S.trOnglet === 'coop' ? 'actif' : '')+'" data-act="tr-onglet" data-v="coop">'+ic('panier')+'Commandes Coop</button></div>';

async function chargerCoop(){

/** Une réponse du serveur : les commandes, et la caisse quand elle a changé (achat, paiement). */
function coopMaj(r){

const coopPaye = c => c.participants.filter(p => p.paye).reduce((s, p) => s + p.montant, 0);
const coopNbArticles = c => c.participants.reduce((s, p) => s + p.lignes.reduce((t, l) => t + l.quantite, 0), 0);
const coopEvenement = c => 'Commande Coop n°'+c.num+' — '+dateCourte(c.date);
/** Les membres d'une commande, par sous-groupe (dans l'ordre des patrouilles / sizaines / équipes), « Autres » à la fin. */
function coopParGroupe(parts, unites){
  const ordre = unites.slice(); parts.forEach(p => { if(ordre.indexOf(p.groupe) < 0) ordre.push(p.groupe); });
  return ordre.map(g => { const l = parts.filter(p => p.groupe === g).sort((a, b) => a.membre.localeCompare(b.membre, 'fr'));
    return {nom:g, l:l, total:l.reduce((s, p) => s + p.montant, 0), paye:l.filter(p => p.paye).reduce((s, p) => s + p.montant, 0)}; }).filter(x => x.l.length);
}
function coopStatutTag(c){

    : c.statut === S_.ACHETEE ? '<span class="coop-statut achetee">'+ic('horloge')+'Achetée · paiements en cours</span>'

      : '<div class="carte">'+vide('panier', 'Aucune commande en cours', 'Cliquez sur « Nouvelle commande » : choisissez les membres, puis ce que chacun commande.')+'</div>')+

  return '<article class="recu'+(c.statut === St.PAYEE ? ' solde' : '')+'" id="recu-'+esc(c.id)+'">'+

/** Ce qu'il faut acheter à la Coop : le total de chaque article, par taille / couleur / badge. */

  const f = $('#f-coop', m);
